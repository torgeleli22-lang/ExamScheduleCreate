    ${h.restore ? `<div class="result ${h.restore.error ? 'bad' : ''}" style="margin-bottom:14px">${esc(h.restore.msg)}
      ${h.restore.store ? `<button type="button" class="btn small danger" data-act="restoreYes">불러오기</button> <button type="button" class="btn small" data-act="restoreNo">취소</button>` : ''}</div>` : ''}
    ${[...byTerm].map(([k, list]) => `<section class="term"><h2>${esc(k)}</h2><div class="plancards">${list.map(card).join('')}</div></section>`).join('')
      || '<div class="empty">아직 만든 시험이 없어요.</div>'}`;
  renderGitHubCard();
}

/** 백업 파일을 지금 저장소와 합칠 계획을 세운다: 없는 시험은 추가, 같은 시험은 백업이 더 최신일 때만 덮어씀 */
function planRestore(raw) {
  const st = toStore(raw);
  if (!st || !Object.keys(st.plans).length) return { error: true, msg: '이 도구의 백업 파일이 아니에요.' };
  let add = 0, over = 0, skip = 0;
  for (const p of Object.values(st.plans)) {
    const cur = Store.plans[p.id];
    if (!cur) add++; else if ((p.updatedAt || 0) > (cur.updatedAt || 0)) over++; else skip++;
  }
  return { store: st, msg: `백업에 시험 ${Object.keys(st.plans).length}개가 있어요: 새로 추가 ${add}개, 백업이 더 최신이라 덮어쓰기 ${over}개, 지금 것이 같거나 최신이라 건너뛰기 ${skip}개.` };
}
function applyRestore(st) {
  let n = 0;
  for (const p of Object.values(st.plans)) {
    const cur = Store.plans[p.id];
    if (!cur || (p.updatedAt || 0) > (cur.updatedAt || 0)) { Store.plans[p.id] = p; persistLocal(); queueCloud(p.id); n++; }
  }
  return n;
}

function switchPlan(id) {
  const p = Store.plans[id]; if (!p) return;
  Store.currentId = id; usePlan(p);
  ui.pending = {}; ui.filter = { group: '', prof: '', status: '', q: '' }; ui.days = []; ui.missing = null; ui.wiz = null;
  closeDrawer(); refreshRoomList(); persistLocal(); render();
}

function bindHistory() {
  bindGitHubCard();
  const box = $('#historyBox');
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.closest('[data-plan]')?.dataset.plan, p = id && Store.plans[id];
    if (act === 'new') { openWizard(); return; }
    if (act === 'backupAll') { await saveFile(`시험시간표_전체백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(Store, null, 1)); return; }
    if (act === 'restoreNo') { ui.hist.restore = null; renderHistory(); return; }
    if (act === 'restoreYes') { const n = applyRestore(ui.hist.restore.store); ui.hist.restore = null; afterStoreChanged(); toast(`백업에서 시험 ${n}개를 불러왔어요.`); return; }
    if (!p) return;
    if (act === 'open') { switchPlan(id); setTab('board'); toast(`${p.title}을(를) 열었어요.`); return; }
    if (act === 'lock') { p.locked = !p.locked; touchPlan(p); render(); toast(p.locked ? `${p.title}을(를) 보관했어요. 이제 수정할 수 없어요.` : `${p.title} 보관을 풀었어요.`); return; }
    if (act === 'backup') { await saveFile(`${safeName(p.title)}_백업.json`, JSON.stringify({ v: 2, plans: { [p.id]: p }, currentId: p.id }, null, 1)); return; }
    if (act === 'del') { ui.hist.del = id; renderHistory(); return; }
    if (act === 'delNo') { ui.hist.del = null; renderHistory(); return; }
    if (act === 'delYes') {
      ui.hist.del = null;
      delete Store.plans[id];
      (Store.deleted = Store.deleted || {})[id] = Date.now();
      if (Store.currentId === id) Store.currentId = latestPlanId(Store);
      persistLocal(); queueCloud(id);
      switchPlan(Store.currentId);
      toast(`${p.title}을(를) 지웠어요.`); return;
    }
  });
  box.addEventListener('change', async e => {
    if (e.target.id !== 'hRestore' || !e.target.files[0]) return;
    try { ui.hist.restore = planRestore(JSON.parse(await e.target.files[0].text())); }
    catch { ui.hist.restore = { error: true, msg: '파일을 읽지 못했어요. JSON 백업 파일인지 확인해 주세요.' }; }
    renderHistory();
  });
}

/* ===== src/js/wizard.js ===== */
/* ---------- 자료 넣기 (선택한 학년도·학기·시험에 아직 자료가 없을 때) ----------
   위쪽에서 학년도·학기·중간/기말을 고르면, 그 시험이 없을 때 이 화면이 나온다.
   - 파일을 한꺼번에 넣으면 종류를 알아서 알아본다(recognizeFile): 강의시간표(xlsx) / 요일별 수업일 현황(pdf·hwp·xlsx) / 보강(hwp·xlsx·pdf)
   - 같은 학기 다른 시험(중간→기말)의 자료를 그대로 가져올 수도 있다. 새로 넣은 파일이 있으면 그것이 우선.
   - 보강은 시간표·수업일 현황이 있어야 수업과 짝지을 수 있다(parseMakeups). */

/** 다음에 만들 시험 기본값: 최근 학기에 빠진 시험이 있으면 그 학기, 둘 다 있으면 다음 학기 */
function nextMissing() {
  const last = sortedPlans()[0];
  const now = new Date();
  if (!last) return { termYear: now.getFullYear(), term: now.getMonth() < 7 ? 1 : 2, kind: 'mid' };
  const same = sortedPlans().filter(p => p.termYear === last.termYear && p.term === last.term);
  for (const k of ['mid', 'final']) if (!same.some(p => p.kind === k)) return { termYear: last.termYear, term: last.term, kind: k };
  return last.term === 1 ? { termYear: last.termYear, term: 2, kind: 'mid' } : { termYear: last.termYear + 1, term: 1, kind: 'mid' };
}
const findPlan = (y, t, k) => sortedPlans().find(p => p.termYear === +y && p.term === +t && p.kind === k);

/** 위쪽 선택칸이 바뀌었을 때: 있으면 그 시험으로, 없으면 자료 넣기 화면 */
function selectExam(termYear, term, kind) {
  const p = findPlan(termYear, term, kind);
  if (p) { ui.missing = null; ui.wiz = null; switchPlan(p.id); return; }
  openWizard({ termYear: +termYear, term: +term, kind });
}
function openWizard(sel = nextMissing()) {
  closeDrawer();
  ui.missing = { termYear: +sel.termYear, term: +sel.term, kind: sel.kind };
  const same = sortedPlans().find(p => p.termYear === ui.missing.termYear && p.term === ui.missing.term);
  ui.wiz = { files: [], tt: null, cal: null, calText: '', mk: [], groupsOff: {}, base: same ? same.id : '', alsoOther: !same, dept: S?.dept || '', busy: '' };
  render();
}
function closeWizard() { ui.missing = null; ui.wiz = null; render(); }

/** 지금 넣은 자료로 만들 시험의 시간표·수업일·보강. 준비가 안 됐으면 classes/calendar가 null */
function wizardSource() {
  const w = ui.wiz, base = w.base ? Store.plans[w.base] : null;
  // 시간표는 다른 학기 것도 쓸 수 있지만, 수업일 현황·보강은 같은 학기 것만 가져온다
  const sameTerm = base && base.termYear === ui.missing.termYear && base.term === ui.missing.term;
  const classes = w.tt ? w.tt.classes.filter(c => !w.groupsOff[groupOf(c)]) : base ? base.classes : null;
  const calendar = w.cal?.data || (sameTerm ? base.calendar : null);
  const year = ui.missing.termYear;
  let makeups = sameTerm && !w.tt ? (base.makeups || []).slice() : [];
  const unmatched = [];
  if (classes && calendar) for (const f of w.mk) {
    const r = parseMakeups(f.text, classes, calendar, year);
    for (const m of r.makeups) if (!makeups.some(x => x.id === m.id)) makeups.push(m);
    unmatched.push(...r.unmatched.map(u => ({ ...u, file: f.name })));
  }
  const sources = { timetable: w.tt?.name || base?.sources?.timetable || '', calendar: w.cal?.name || base?.sources?.calendar || '', makeups: w.mk.map(f => f.name).join(', ') };
  return { classes, calendar, year, makeups, unmatched, sources, dept: base?.dept };
}
function wizardIssues(src) {
  const out = [];
  if (!src.classes) out.push('강의시간표(.xlsx)를 넣어 주세요.');
  else if (!src.classes.length) out.push('고른 반에 수업이 없어요.');
  if (!src.calendar) out.push('요일별 수업일 현황(.pdf, .hwp, .xlsx 또는 붙여넣기)을 넣어 주세요.');
  else for (const k of kindsToMake()) if (!src.calendar.weeks[KINDS[k].week - 1]) out.push(`수업일 현황에 ${KINDS[k].week}주차(${KINDS[k].label})가 없어요.`);
  return out;
}
const otherKind = k => (k === 'mid' ? 'final' : 'mid');
function kindsToMake() {
  const m = ui.missing, out = [m.kind];
  const o = otherKind(m.kind);
  if (ui.wiz.alsoOther && !findPlan(m.termYear, m.term, o)) out.push(o);
  return out.sort((a, b) => (a === 'mid' ? -1 : 1));
}

function calendarPreview(cal, year, examWeeks) {
  const { dateMap } = buildDateMap(cal, year);
  const isoOf = {}; for (const [iso, x] of Object.entries(dateMap)) isoOf[`${x.col}|${x.week}`] = iso;
  const rows = cal.weeks.map((row, wi) => {
    if (!row) return '';
    const wk = wi + 1;
    const cells = cal.cols.map(col => {
      const iso = isoOf[`${col}|${wk}`];
      const shifted = iso && DOW[dowOf(iso)] !== col;
      return `<td class="${shifted ? 'alt' : ''}"${shifted ? ` title="${esc(`${fmt(iso)}에 ${col}요일 수업`)}"` : ''}>${iso ? esc(fmt(iso)) : ''}</td>`;
    }).join('');
    const label = examWeeks[wk] ? ` <span class="pill ok">${examWeeks[wk]}</span>` : '';
    return `<tr class="${examWeeks[wk] ? 'ex' : ''}"><th>${wk}주${label}</th>${cells}</tr>`;
  }).join('');
  return `<div class="calprev tablebox"><table><thead><tr><th>주차</th>${cal.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* 다시 그리는 도중 포커스된 칸이 지워지면서 change 이벤트가 또 renderWizard를 부를 수 있다 → 끝난 뒤 한 번 더 그린다 */

  if (wizRendering) { wizAgain = true; return; }

  try { drawWizard(); } finally { wizRendering = false; }
  if (wizAgain) { wizAgain = false; renderWizard(); }
}
function drawWizard() {

    <p class="hint">이 시험은 아직 없어요. 그 학기 <b>강의시간표</b>와 <b>요일별 수업일 현황</b>, 있으면 <b>보강</b> 자료를 한꺼번에 넣으세요. 어떤 자료인지는 알아서 알아봐요. 지난 시험 기록은 그대로 남아요.</p>
    <section class="step"><h3><span class="n">1</span>자료</h3>

        <select id="wBase"><option value="">가져오지 않음</option>${others.map(p => `<option value="${esc(p.id)}"${p.id === w.base ? ' selected' : ''}>${esc(p.title)} · 수업 ${p.classes.length}개${(p.makeups || []).length ? ` · 보강 ${p.makeups.length}건` : ''}</option>`).join('')}</select></label>` : ''}
      <div class="dropzone" id="wDrop">
        <b>여기에 파일을 끌어다 놓거나</b>
        <label class="btn small primary" for="wFiles">파일 고르기 (여러 개 가능)</label><input type="file" id="wFiles" multiple accept=".xlsx,.xlsm,.pdf,.hwp,.txt,.csv" hidden>
        <span class="hint">강의시간표 .xlsx · 수업일 현황 .pdf/.hwp/.xlsx · 보강결과보고서 .hwp/.xlsx/.pdf</span>
      </div>

      ${w.busy ? `<p class="hint">${esc(w.busy)}</p>` : ''}
      ${ttGroups.length ? `<div class="field"><span>시험 대상 반 (전공심화·야간처럼 빼야 할 반은 체크를 푸세요)</span><div class="radios">${ttGroups.map(g => {

      <details${src.calendar && !w.cal?.error ? '' : ' open'}><summary class="hint">요일별 수업일 현황 직접 붙여넣기·고치기</summary>

          <textarea id="wCalText" rows="6" placeholder="주	월	화	수	목	금	토&#10;1	3/2	3/3	3/4	3/5	3/6	3/7&#10;…">${esc(w.calText)}</textarea></label>

        ${mkRows ? `<div class="miniscroll"><table class="mklist"><thead><tr><th>반</th><th>과목</th><th>결강일</th><th>보강</th></tr></thead><tbody>${mkRows}</tbody></table></div>` : ''}

    </section>`;

/** 넣은 파일들을 알아보고 마법사 상태에 반영 */
async function wizardAddFiles(files) {
  const w = ui.wiz; if (!w || !files.length) return;
  w.busy = `파일 ${files.length}개 읽는 중…`; renderWizard();
  for (const f of files) {
    const r = await recognizeFile(f);
    w.files = w.files.filter(x => x.name !== r.name).concat([{ name: r.name, type: r.type, msg: r.msg }]);
    if (r.type === 'timetable') { w.tt = { name: r.name, classes: r.classes }; w.groupsOff = {}; }
    else if (r.type === 'calendar') { w.cal = { name: r.name, data: r.calendar, msg: r.msg }; w.calText = r.text; }
    else if (r.type === 'makeups') { w.mk = w.mk.filter(x => x.name !== r.name).concat([{ name: r.name, text: r.text }]); }
  }
  w.busy = '';
  renderWizard();
}

function createFromWizard() {
  const w = ui.wiz, m = ui.missing, src = wizardSource();
  if (wizardIssues(src).length) return;
  const made = [];
  for (const k of kindsToMake()) {
    const p = makePlan({ termYear: m.termYear, term: m.term, kind: k, dept: (w.dept || '').trim() || src.dept || S?.dept,
      calendar: src.calendar, classes: src.classes, sources: src.sources, taken: Store.plans });
    p.year = src.year;
    p.makeups = clone(src.makeups);
    Store.plans[p.id] = p; made.push(p);
    touchPlan(p);
  }
  ui.missing = null; ui.wiz = null;
  const first = made.find(p => p.kind === m.kind) || made[0];
  switchPlan(first.id);
  setTab('board');
  toast(`${made.map(p => p.title).join(', ')}을(를) 만들었어요.${src.makeups.length ? ` 보강 ${src.makeups.length}건 반영.` : ''}`);
}

function bindWizard() {
  const box = $('#createPanel');
  box.addEventListener('click', e => {
    if (e.target.closest('#wClose')) { closeWizard(); return; }
    if (e.target.closest('#wCreate')) { createFromWizard(); return; }
    if (e.target.closest('#wCalParse')) {

/* ===== src/js/drag.js ===== */
/* ---------- 날짜별 배치 화면 드래그 (pointer 이벤트, 같은 반 줄 안에서만, 가장자리 자동 스크롤) ---------- */
let drag = null;
function clearHighlight() { $$('.cell.ok,.cell.bad,.wcell.ok,.wcell.bad').forEach(el => el.classList.remove('ok', 'bad')); }
function dragTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest ? el.closest('.cell') : null;
  if (cell) return { date: cell.dataset.date, group: cell.dataset.group, p: +cell.dataset.p, track: cell.parentElement };
  const wc = el && el.closest ? el.closest('.wcell') : null;   // 주차×요일 판의 날짜 칸: 같은 교시 그대로 날짜만 옮김
  if (wc) return { date: wc.dataset.date, whole: true, el: wc };
  return null;
}
function onDragMove(e) {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.started = true;
    document.body.classList.add('dragging');
    drag.el.classList.add('src');
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('src');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.gridColumn = ''; g.style.gridRow = '';
    document.body.appendChild(g);
    drag.ghost = g; drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
  }
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  if (!drag.raf) drag.raf = requestAnimationFrame(autoScroll);
  updateTarget(e.clientX, e.clientY);
}
function autoScroll() {
  if (!drag || !drag.started) return;
  const y = drag.lastY, edge = 80;

  if (y < edge) dy = -Math.ceil((edge - y) / 3); else if (y > window.innerHeight - edge) dy = Math.ceil((y - (window.innerHeight - edge)) / 3);
  if (dy) { const before = window.scrollY; window.scrollBy(0, dy); if (window.scrollY !== before) updateTarget(drag.lastX, drag.lastY); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function updateTarget(x, y) {
  clearHighlight();
  const e = { clientX: x, clientY: y };
  const t = dragTarget(e.clientX, e.clientY);
  const tip = $('#dragTip');
  const c = D.byId[drag.id], ex = S.exams[drag.id];
  drag.target = null;
  if (!t) { tip.hidden = true; return; }
  if (t.whole) {
    const place = { date: t.date, start: ex.start, len: ex.len, room: ex.room };
    const cf = conflictsOf(c, place), wn = warningsOf(c, place);
    t.el.classList.add(cf.length ? 'bad' : 'ok');
    drag.target = place;
    tip.hidden = false;
    tip.textContent = `${fmt(t.date)} ${pRange(ex.start, ex.len)} ${tRange(ex.start, ex.len)}` + (cf.length ? '\n' + cf.map(describeConflict).join('\n') : ' · 겹침 없음') + (wn.length ? '\n' + wn.join('\n') : '');
  } else if (t.group !== groupOf(c)) {
    tip.hidden = false; tip.textContent = `${groupOf(c)} 줄 안에서만 옮길 수 있어요`;
  } else {
    const start = Math.max(1, Math.min(NP - ex.len + 1, t.p - drag.grabP));
    const place = { date: t.date, start, len: ex.len, room: ex.room };
    const cf = conflictsOf(c, place), wn = warningsOf(c, place);
    const cls = cf.length ? 'bad' : 'ok';
    $$('.cell', t.track).forEach(el => { const p = +el.dataset.p; if (p >= start && p < start + ex.len) el.classList.add(cls); });
    drag.target = place;
    tip.hidden = false;
    tip.textContent = `${fmt(t.date)} ${pRange(start, ex.len)} ${tRange(start, ex.len)}` + (cf.length ? '\n' + cf.map(describeConflict).join('\n') : ' · 겹침 없음') + (wn.length ? '\n' + wn.join('\n') : '');
  }
  tip.style.whiteSpace = 'pre-line';
  tip.style.left = Math.min(window.innerWidth - 330, e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + 18) + 'px';
}
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onCancel);
  clearHighlight();
  $('#dragTip').hidden = true;
  document.body.classList.remove('dragging');
  if (d.ghost) d.ghost.remove();
  if (d.el) d.el.classList.remove('src');
  if (cancelled) return;
  if (!d.started) { openDrawer(d.id); return; }
  if (d.target) {
    const ex = S.exams[d.id];
    if (ex.date !== d.target.date || ex.start !== d.target.start) {
      const before = `${fmt(ex.date)} ${pRange(ex.start, ex.len)}`;
      ex.date = d.target.date; ex.start = d.target.start; ex.keep = false;
      changed();
      const c = D.byId[d.id];
      const n = conflictsOf(c, { date: ex.date, start: ex.start, len: ex.len, room: ex.room }).length;
      toast(`${c.course}(${groupOf(c)}) ${before} → ${fmt(ex.date)} ${pRange(ex.start, ex.len)}${n ? ` · 겹침 ${n}건` : ''}`);
    }
  }
}
const onUp = e => endDrag(e, false);
const onCancel = e => endDrag(e, true);

/* ===== src/js/app.js ===== */
/* ---------- 앱: 공용 UI 상태, 변경 알림, 이벤트 연결, 시작 ---------- */
const TABS = ['board', 'courses', 'professors', 'history', 'setup'];
const ui = { tab: 'board', filter: { group: '', prof: '', status: '', q: '' }, drawerId: null, reg: null, pending: {}, hist: {}, wiz: null };

/** 지금 계획(S)을 고친 뒤 부른다: 저장 + 다시 그리기. 보관(잠금)된 계획은 저장하지 않는다. */
function changed(opts = {}) {
  if (isLocked()) { toast('보관된 기록이라 바꿀 수 없어요. 먼저 보관을 해제하세요.'); render(); return; }
  touchPlan(S);
  if (!opts.noRender) render();
}

let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3600); }
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('복사했어요.'); }
  catch {
    if (fallbackEl) { const rg = document.createRange(); rg.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
    toast('자동 복사가 막혀 있어요. 선택된 글을 Ctrl+C로 복사해 주세요.');
  }
}
function listTsv() {
  const head = ['날짜', '요일', '교시', '시간', '반', '과목', '교수', '강의실', '방식', '확정', '메모'];
  const rows = sortedExams().map(c => { const ex = S.exams[c.id], ok = hasSlot(ex);
    return [ok ? fmt(ex.date).replace(/\(.\)/, '') : '', ok ? DOW[dowOf(ex.date)] : '', ok ? pRange(ex.start, ex.len) : '', ok ? tRange(ex.start, ex.len) : '', groupOf(c), c.course, c.prof, ok ? roomLabel(ex.room) : '', ex.method, ex.done ? 'O' : '', ex.note.replace(/\s+/g, ' ')]; });
  return [head, ...rows].map(r => r.join('\t')).join('\n');
}
function refreshRoomList() { $('#roomList').innerHTML = D.rooms.map(r => `<option value="${esc(r)}"></option>`).join(''); }
function setTab(tab, push = true) {
  ui.tab = tab;
  for (const b of $$('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  for (const p of $$('.tabpanel')) p.hidden = p.id !== 'tab-' + tab;
  if (push && location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch { location.hash = tab; } }
  render();
}

function bind() {
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== ui.tab) setTab(h, false); });
  $('#summary').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (!b) return; ui.filter = { group: '', prof: '', status: b.dataset.jump, q: '' }; setTab('courses'); });
  $('#btnExport').addEventListener('click', exportExcel);
  $('#btnRegister').addEventListener('click', () => { if (!isLocked()) openRegister(); });
  // 학년도·학기·시험 선택
  for (const id of ['#selYear', '#selTerm', '#selKind']) $(id).addEventListener('change', () => {
    selectExam(+$('#selYear').value, +$('#selTerm').value, $('#selKind').value);
    if (!ui.missing) toast(`${S.title}을(를) 열었어요.`);
  });
  $('#lockBanner').addEventListener('click', e => { if (e.target.closest('#btnUnlock')) { S.locked = false; touchPlan(S); render(); toast('보관을 풀었어요. 이제 수정할 수 있어요.'); } });

  // 날짜별 배치: 주차×요일 판(카드는 날짜 칸으로) + 펼친 날짜의 반×교시 시간표(블록은 교시까지)
  const tb = $('#tab-board');
  tb.addEventListener('pointerdown', e => {
    const b = e.target.closest('.blk.exam, .wcard.exam'); if (!b || e.button !== 0 || isLocked()) return;
    const id = b.dataset.id, ex = S.exams[id];
    let grabP = 0;
    if (b.classList.contains('blk')) { const r = b.getBoundingClientRect(); grabP = Math.max(0, Math.min(ex.len - 1, Math.floor((e.clientX - r.left) / (r.width / ex.len)))); }
    drag = { id, el: b, x0: e.clientX, y0: e.clientY, started: false, grabP };
    e.preventDefault();
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  tb.addEventListener('click', e => {
    const dd = e.target.closest('[data-daydetail]');
    if (dd) {
      const d = dd.dataset.daydetail, days = ui.days || [];
      ui.days = days.includes(d) ? days.filter(x => x !== d) : [...days, d];
      renderBoard(); if (isLocked()) lockControls();
      if (ui.days.includes(d)) document.querySelector(`.day[data-day="${d}"]`)?.scrollIntoView({ block: 'nearest' });
      return;
    }
    const cd = e.target.closest('[data-closeday]');
    if (cd) { ui.days = (ui.days || []).filter(x => x !== cd.dataset.closeday); renderBoard(); return; }
    if (e.target.closest('#btnKeepAll')) {
      if (isLocked()) return;
      const n = keepAllUnmoved(); changed();
      toast(`${n}과목을 '기존 시간표 수업 진행'으로 확정했어요.`); return;
    }
    if (e.target.closest('#rangeReset')) { if (isLocked()) return; delete S.range; changed(); return; }
    const b = e.target.closest('.blk.exam, .wcard.exam');
    if (b && (e.detail === 0 || isLocked())) openDrawer(b.dataset.id);
  });
  tb.addEventListener('change', e => {
    if (e.target.id === 'showFixed') { ui.showFixed = e.target.checked; renderBoard(); return; }
    if (e.target.id === 'rangeFrom' || e.target.id === 'rangeTo') {
      const from = $('#rangeFrom').value, to = $('#rangeTo').value;
      if (!from || !to) return;
      if (from > to) { toast('기간의 시작이 끝보다 늦어요.'); renderBoard(); return; }
      if (isLocked()) { renderBoard(); return; }
      S.range = { from, to }; changed();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (drag) endDrag(e, true); else if (ui.drawerId || ui.reg) closeDrawer();
  });

  const lt = $('#listTable');
  lt.addEventListener('change', e => {
    const el = e.target, f = el.dataset.f, tr = el.closest('tr[data-id]'); if (!f || !tr || isLocked()) return;
    setExamField(tr.dataset.id, f, el.type === 'checkbox' ? el.checked : el.value);
    changed();
  });
  lt.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openDrawer(b.dataset.open); });
  $('#fGroup').addEventListener('change', e => { ui.filter.group = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fProf').addEventListener('change', e => { ui.filter.prof = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fStatus').addEventListener('change', e => { ui.filter.status = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fQ').addEventListener('input', e => { ui.filter.q = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#btnCopyTsv').addEventListener('click', () => copyText(listTsv()));

  $('#profGrid').addEventListener('click', e => {
    const cp = e.target.closest('[data-copy]');
    if (cp) { copyText(profMessage(cp.dataset.copy), document.getElementById('msg-' + cp.dataset.copy)); return; }
    const md = e.target.closest('[data-markdone]');
    if (md && !isLocked()) { for (const c of S.classes) if (c.prof === md.dataset.markdone) S.exams[c.id].done = true; changed(); toast(`${md.dataset.markdone} 교수님 과목을 확정으로 표시했어요.`); }
  });

  bindDrawer();
  bindSetup();
  bindHistory();
  bindWizard();
}

(function boot() {
  const seed = JSON.parse(document.getElementById('seed').textContent);
  Store = loadLocal();
  if (!Store) {
    // 처음 여는 브라우저: 저장소에 들어 있는 기본 자료(data/seed.json)로 계획 하나를 만든다
    Store = newStore();
    const p = upgradePlan({ v: 1, ...seed, exams: {}, extraDates: [], rev: 0, updatedAt: 0 });
    Store.plans[p.id] = p; Store.currentId = p.id;
  }
  if (!Store.plans[Store.currentId]) Store.currentId = latestPlanId(Store);
  usePlan(Store.plans[Store.currentId]);
  persistLocal();
  refreshRoomList();
  bind();
  const h = location.hash.slice(1);
  setTab(TABS.includes(h) ? h : 'board', false);
  setSave('local');
  initCloud();
  initGitHub();
  getDownloads();
})();
window.__planner = {
  openRegister, saveRegister, get reg() { return ui.reg; }, get state() { return S; }, get store() { return Store; },
  derive, render, conflictsOf, warningsOf, statusOf, counts, freeSlots, itemsOn, buildWorkbook, parseCalendarText, parseTimetableXlsx,
  parseCalendarPdf, profMessage, openDrawer, changed, switchPlan, openWizard, gh, ghSync,
};
