<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 시간표 편성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 행정용 작업 도구. 상단 요약 → 탭(날짜별 배치 / 과목 목록 / 교수님 확인 / 설정) → 오른쪽 편집 서랍.
   학년 색(1 노랑, 2 파랑, 3 초록)은 학과 강의시간표 관례를 그대로 따른다. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2333; --muted:#5b6474; --line:#d9dde5; --accent:#1f3a68; --accent-ink:#ffffff;
  --y1:#fff4cf; --y1s:#f2c94c; --y2:#e1ecfb; --y2s:#5f8fdc; --y3:#e2f2dc; --y3s:#5ea64f;
  --bad:#c42b2b; --bad-bg:#fde7e7; --warn:#9a5b00; --warn-bg:#fff0d6; --ok:#257346; --ok-bg:#e0f3e8;
  --fixed:#e9ebf0; --fixed-ink:#6b7280; --lunch:#f7f7f9;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
    --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
    --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
    --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
  --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
  --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
  --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:22px 0 14px}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px;font-weight:500}
h1{font-size:24px;font-weight:700;letter-spacing:-0.01em}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.savepill{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savepill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.savepill.cloud::before{background:var(--ok)}
.savepill.saving::before,.savepill.loading::before{background:var(--warn)}
.savepill.error::before{background:var(--bad)}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 14px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-size:15px}
button.chip:hover{border-color:var(--accent)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.bad b{color:var(--bad)}
.chip.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip.ok b{color:var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px 0 80px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* board */
.boardbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.sw.y1{background:var(--y1);border-color:var(--y1s)} .sw.y2{background:var(--y2);border-color:var(--y2s)} .sw.y3{background:var(--y3);border-color:var(--y3s)}
.sw.fx{background:repeating-linear-gradient(135deg,var(--fixed) 0 4px,transparent 4px 7px)}
.sw.bd{background:var(--bad-bg);border:2px solid var(--bad)}
.board{display:flex;flex-direction:column;gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.dayhead h3{font-size:17px}
.dayhead .dow{font-weight:500;color:var(--muted);margin-left:2px}
.tag{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--fixed);color:var(--muted)}
.tag.alt{background:var(--warn-bg);color:var(--warn)}
.tag.free{background:var(--ok-bg);color:var(--ok)}
.dayhead .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.scroller{overflow-x:auto}
.grid{min-width:940px}
.ghead,.grow{display:grid;grid-template-columns:52px 1fr}
.ghead .periods,.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.55fr) repeat(5,minmax(0,1fr))}
.ghead{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ghead .periods div{padding:4px 0;text-align:center;border-left:1px solid var(--line);line-height:1.3}
.ghead .periods b{display:block;color:var(--ink);font-size:12.5px}
.glabel{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border-right:1px solid var(--line);position:relative}
.glabel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.glabel.y1::before{background:var(--y1s)} .glabel.y2::before{background:var(--y2s)} .glabel.y3::before{background:var(--y3s)}
.grow{border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow.yb{border-top:2px solid var(--line)}
.track{position:relative;grid-auto-rows:minmax(42px,auto);padding:3px 0}
.cell{grid-row:1/-1;border-left:1px solid var(--line);margin:-3px 0}
.cell.lunch{background:var(--lunch)}
.cell.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.cell.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.blk{margin:2px 3px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;min-width:0;text-align:left;border:1px solid transparent;position:relative;z-index:1;overflow:hidden}
.blk .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.blk.fixed{background:repeating-linear-gradient(135deg,var(--fixed) 0 6px,transparent 6px 10px);border-color:var(--line);color:var(--fixed-ink)}
.blk.fixed .t{font-weight:500}
.blk.exam{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.blk.exam.y1{background:var(--y1);border-color:var(--y1s)} .blk.exam.y2{background:var(--y2);border-color:var(--y2s)} .blk.exam.y3{background:var(--y3);border-color:var(--y3s)}
.blk.exam:hover{filter:brightness(.97)}
.blk.exam.bad{border:2px solid var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.blk .badge{position:absolute;top:3px;right:4px;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px}
.badge.b-bad{background:var(--bad);color:#fff}
.badge.b-mv{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.badge.b-ok{background:var(--ok);color:#fff}
.blk.has-badge .t{padding-right:30px}
body.dragging,body.dragging *{cursor:grabbing !important}
body.dragging .blk{pointer-events:none}
.blk.src{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:6px;padding:5px 8px;max-width:320px;line-height:1.4}
.adddate{display:flex;gap:6px;align-items:center;font-size:13px}
select,input[type="text"],input[type="number"],textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
textarea{width:100%;resize:vertical}

/* list */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:12px}
.listtable select,.listtable input[type="text"]{padding:3px 6px;font-size:13px}
.listtable .note{min-width:160px;width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.st{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mv{border:1px solid var(--warn);color:var(--warn)} .pill.na{background:var(--fixed);color:var(--muted)}
tr.rbad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.gtag{font-weight:700}

/* profs */
.profgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-size:12.5px;color:var(--muted);font-weight:500}
.msg{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;max-height:240px;overflow:auto;font-family:var(--font-body)}

/* settings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card h2{font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field span{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result{font-size:13px;border-radius:7px;padding:8px 10px;background:var(--bg)}
.result.bad{background:var(--bad-bg);color:var(--bad)} .result.ok{background:var(--ok-bg);color:var(--ok)}
ul.plain{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.dhead h2{font-size:18px}
.dhead .btn{white-space:nowrap;flex-shrink:0}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dbody{padding:14px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid select,.fgrid input{width:100%}
.fgrid input[type="checkbox"]{width:auto;margin:0 6px 0 0}
.chk{display:flex;align-items:center;color:var(--ink) !important;min-height:30px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks .it{border-radius:7px;padding:7px 9px}
.checks .it.bad{background:var(--bad-bg);color:var(--bad)} .checks .it.warn{background:var(--warn-bg);color:var(--warn)} .checks .it.ok{background:var(--ok-bg);color:var(--ok)}
.slots{display:flex;flex-direction:column;gap:8px}
.slotday{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:start;font-size:13px}
.slotday .lbl{color:var(--muted);padding-top:3px}
.slotday .lbl b{color:var(--ink)}
.slotday .opts{display:flex;flex-wrap:wrap;gap:4px}
.slotbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 7px;font-size:12.5px}
.slotbtn:hover{border-color:var(--ok);background:var(--ok-bg)}
.slotbtn.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dsec h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:640px){
  .wrap{padding:0 16px}
  h1{font-size:20px}
  .setgrid,.profgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

/* plan picker · lock banner */
.planpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.planpick select{min-width:240px;max-width:100%}
.lockbanner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:9px 13px;margin-bottom:12px;font-size:13.5px}
.lockbanner[hidden]{display:none}
body.locked .blk.exam{cursor:pointer}

/* history */
.histhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.term{margin-bottom:16px}
.term h2{font-size:16px;margin:0 0 8px}
.plancards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.plancard.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plancard h3{font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plancard .meta{font-size:12.5px;color:var(--muted)}
.plancard .row{gap:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

/* modal (새 시험 만들기) */
.modal{position:fixed;inset:0;z-index:45;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox .dhead{border-radius:12px 12px 0 0}
.mbox .dbody{overflow:visible}
.step{border:1px solid var(--line);border-radius:9px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.step h3{font-size:14px;margin:0;display:flex;gap:8px;align-items:center}
.step h3 .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center}
.radios{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px}
.radios label{display:flex;gap:6px;align-items:center}
.calprev{overflow-x:auto}
.calprev table{font-size:12px;min-width:480px}
.calprev th,.calprev td{padding:3px 6px;text-align:center}
.calprev tr.ex td{background:var(--y2);font-weight:600}
.calprev td.alt{color:var(--warn);font-weight:700}
.miniscroll{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:7px}
.miniscroll table{font-size:12px}
.miniscroll td,.miniscroll th{padding:3px 7px}
@media (max-width:640px){ .plancards{grid-template-columns:1fr} .planpick select{min-width:0;width:100%} }
.savepill.gh-saved::before{background:var(--ok)}
.savepill.gh-loading::before,.savepill.gh-saving::before,.savepill.gh-pending::before{background:var(--warn)}
.savepill.gh-error::before{background:var(--bad)}
.savepill.gh-error{color:var(--bad)}
#ghCard code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
#ghCard details ol{margin-top:6px}
a.btn{text-decoration:none;color:inherit;display:inline-block}

/* 시험 선택 · 자료 넣기 */
.planpick label{display:flex;gap:6px;align-items:center}
.planpick select{min-width:0}
body.missing .summary,body.missing .tabs,body.missing main,body.missing #btnRegister,body.missing #btnExport,body.missing #lockBanner{display:none !important}
.createpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:6px 0 40px;display:flex;flex-direction:column;gap:14px}
.createpanel[hidden]{display:none}
.createpanel h2{font-size:19px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.dropzone.over{border-color:var(--accent);background:var(--y2)}
.filelist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.filelist .it{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;border-radius:7px;padding:7px 9px;background:var(--bg)}
.filelist .it.ok{background:var(--ok-bg)} .filelist .it.bad{background:var(--bad-bg)}
.filelist .ty{font-weight:700}
.mklist{font-size:12.5px}
.mklist td,.mklist th{padding:4px 7px}

/* 주차 × 요일 판 */
.rangebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.rangebar input[type="date"]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 7px}
.chkline{display:flex;gap:5px;align-items:center;color:var(--muted)}
.weekgrid-wrap{overflow-x:auto;margin-bottom:16px}
.weekgrid{display:grid;gap:6px;min-width:min-content}
.wh{font-size:12.5px;color:var(--muted);padding:2px 4px}
.wh b{color:var(--ink);font-size:14px;display:block}
.wday{display:flex;align-items:flex-start;justify-content:center;font-weight:700;padding-top:8px}
.wcell{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;min-height:70px;min-width:250px}
.wcell.out{opacity:.45}
.wcell.examday{border-color:var(--accent)}

/** 시험 종류. week = 기본 시험 주차 (계획마다 설정에서 바꿀 수 있음) */
const KINDS = { mid: { label: '중간고사', week: 8 }, final: { label: '기말고사', week: 15 } };
const EXCELJS_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clone = o => JSON.parse(JSON.stringify(o));
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const dowOf = iso => new Date(iso + 'T00:00:00Z').getUTCDay();

const opts = (arr, cur, lab = x => x) => arr.map(v => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(lab(v))}</option>`).join('');
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');

/* ===== src/js/model.js ===== */
/* ---------- 데이터 모델: 시험 계획(plan)과 저장소(Store) ----------
   Store = { v:2, plans: { [planId]: Plan }, deleted: { [planId]: 지운 시각 }, currentId }
   - deleted: 지운 시험 기록. 다른 컴퓨터(GitHub 저장)와 합칠 때 지운 시험이 되살아나지 않게 한다.
   Plan  = { v:2, id, termYear, term(1|2), kind('mid'|'final'), title, dept, year, examWeek,
             calendar:{cols, weeks}, classes:[...], exams:{[classId]: Exam}, extraDates:[],
             locked, createdAt, updatedAt, rev, sources:{timetable, calendar} }
   - year: 수업일 현황의 "월/일"을 날짜로 바꿀 때 쓰는 연도(학년도). 2학기 1~2월 날짜는 다음 해로 본다.
   - 계획마다 시간표·수업일을 따로 들고 있다(스냅숏). 지난 학기 기록이 새 학기 업로드에 영향받지 않게. */

let Store = null;   // 모든 계획
let S = null;       // 지금 보고 있는 계획 (Store.plans[Store.currentId] 와 같은 객체)
const D = {};       // S에서 계산한 값 (derive()가 채움)

function planTitle(p) {
  const k = KINDS[p.kind];
  return `${p.termYear}학년도 ${p.term}학기 ${k ? k.label : '시험'}`;
}
function planIdFor(termYear, term, kind, taken = {}) {
  const base = `${termYear}-${term}-${kind}`;
  let id = base, n = 2;
  while (taken[id]) id = `${base}-${n++}`;
  return id;
}
/** 새 계획. classes/calendar는 복사해서 넣는다. */
function makePlan({ termYear, term, kind, dept, calendar, classes, examWeek, sources, taken }) {
  const p = {
    v: 2, id: planIdFor(termYear, term, kind, taken), termYear: +termYear, term: +term, kind,
    title: '', dept: dept || '', year: +termYear, examWeek: +(examWeek || KINDS[kind]?.week || 15),
    calendar: clone(calendar), classes: clone(classes), exams: {}, extraDates: [],
    locked: false, createdAt: Date.now(), updatedAt: Date.now(), rev: 0, sources: sources || {},
  };
  p.title = planTitle(p);
  return p;
}
function validPlan(s) {
  return !!(s && (s.v === 1 || s.v === 2) && Array.isArray(s.classes) && s.calendar && Array.isArray(s.calendar.weeks)
    && Array.isArray(s.calendar.cols) && s.exams && typeof s.exams === 'object');
}
/** v1(한 개짜리 상태) → v2 계획. 제목에서 학기·시험 종류를 읽고, 없으면 시험 주차로 짐작한다. */
function upgradePlan(s, taken = {}) {
  if (s.v === 2 && s.id && s.kind) return s;
  const title = String(s.title || '');
  const term = +((title.match(/([12])\s*학기/) || [])[1] || (s.calendar?.weeks?.[0]?.[0]?.startsWith?.('3/') ? 1 : 2));
  const kind = /중간/.test(title) ? 'mid' : /기말/.test(title) ? 'final' : (+s.examWeek <= 10 ? 'mid' : 'final');
  const termYear = +((title.match(/(20\d\d)\s*학년도/) || [])[1] || s.year);
  const p = { ...s, v: 2, termYear, term, kind, locked: !!s.locked, createdAt: s.createdAt || s.updatedAt || Date.now(), sources: s.sources || {} };
  p.id = planIdFor(termYear, term, kind, taken);
  if (!p.title) p.title = planTitle(p);
  return p;
}
function newStore() { return { v: 2, plans: {}, deleted: {}, currentId: null }; }
/** 저장된 무언가(v2 저장소, v2 계획, v1 상태)를 저장소로. 모르는 형식이면 null. */
function toStore(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.v === 2 && raw.plans && typeof raw.plans === 'object') {
    const st = newStore();
    for (const p of Object.values(raw.plans)) if (validPlan(p)) { const q = upgradePlan(p, st.plans); st.plans[q.id] = q; }
    if (raw.deleted && typeof raw.deleted === 'object') for (const [id, t] of Object.entries(raw.deleted)) if (+t > 0) st.deleted[id] = +t;
    st.currentId = st.plans[raw.currentId] ? raw.currentId : latestPlanId(st);
    return st;
  }
  if (validPlan(raw)) { const st = newStore(); const p = upgradePlan(raw); st.plans[p.id] = p; st.currentId = p.id; return st; }
  return null;
}
/** 학기 순서: 최신 학기가 앞, 한 학기 안에서는 중간 → 기말. */
function planOrder(a, b) {
  const kr = k => (k === 'mid' ? 0 : k === 'final' ? 1 : 2);
  return b.termYear - a.termYear || b.term - a.term || kr(a.kind) - kr(b.kind) || (b.createdAt || 0) - (a.createdAt || 0);
}
const sortedPlans = (st = Store) => Object.values(st.plans).sort(planOrder);
const latestPlanId = st => sortedPlans(st)[0]?.id || null;

/**
 * 두 저장소 합치기 (이 브라우저 ↔ GitHub). 시험(계획)마다 updatedAt이 더 최신인 쪽이 이긴다.
 * 지운 기록(deleted)이 그 계획의 마지막 수정보다 늦으면 지운 것으로 본다.
 * → { plans, deleted, localChanged: 이 브라우저 쪽이 바뀌는지, remoteChanged: GitHub 쪽에 올려야 하는지 }
 */
function mergeStores(local, remote) {
  const lp = local.plans || {}, rp = remote.plans || {}, ld = local.deleted || {}, rd = remote.deleted || {};
  const deleted = { ...rd };
  for (const [id, t] of Object.entries(ld)) deleted[id] = Math.max(deleted[id] || 0, t);
  const plans = {};
  let localChanged = false, remoteChanged = false;
  for (const id of new Set([...Object.keys(lp), ...Object.keys(rp)])) {
    const a = lp[id], b = rp[id];
    let win = !a ? b : !b ? a : ((b.updatedAt || 0) > (a.updatedAt || 0) ? b : a);
    if (deleted[id] && deleted[id] >= (win.updatedAt || 0)) win = undefined;
    if (win) plans[id] = win;
    if (win !== a) localChanged = true;
    if (win !== b) remoteChanged = true;
  }
  for (const id of Object.keys(deleted)) {
    if (deleted[id] !== ld[id]) localChanged = true;
    if (deleted[id] !== rd[id]) remoteChanged = true;
  }
  return { plans, deleted, localChanged, remoteChanged };
}
/** GitHub에 올리는 모양: 보던 시험(currentId)·탭 표시(writer)처럼 브라우저마다 다른 값은 뺀다 */
function storePayload(st) {
  const plans = {};
  for (const id of Object.keys(st.plans).sort()) { const { writer, ...rest } = st.plans[id]; plans[id] = rest; }
  return { v: 2, plans, deleted: st.deleted || {} };
}

/* ===== src/js/calendar.js ===== */
/* ---------- 수업일 현황 → 날짜 계산 ----------
   함정: 수업일 현황의 날짜는 실제 요일과 시간표 요일이 다를 수 있다.
   예) 2026-2: 12/15(화)는 "금요일 14주차" 수업일, 12/22(화)는 "토요일 15주차".
   그래서 날짜마다 (시간표 요일 열, 주차)를 D.dateMap 으로 들고 겹침을 검사한다. */

function tokToIso(tok, year = S.year, firstMonth = D.firstMonth) {
  const m = String(tok || '').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if (!m) return null;
  const mo = +m[1], da = +m[2];
  let y = +year;
  if (firstMonth >= 7 && mo <= 2) y += 1;   // 2학기 달력의 1~2월은 다음 해
  return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
}
/** 수업일 표 하나에서 날짜 지도를 만든다. S 없이도 쓸 수 있다(새 시험 만들기 미리보기). */
function buildDateMap(calendar, year) {
  const first = calendar.weeks.find(Boolean)?.find(Boolean);
  const firstMonth = first ? +String(first).split('/')[0] : 9;
  const dateMap = {}, colDates = {};
  calendar.weeks.forEach((row, wi) => {
    (row || []).forEach((tok, ci) => {
      const col = calendar.cols[ci];
      const iso = tokToIso(tok, year, firstMonth);
      if (!col || !iso) return;
      dateMap[iso] = { col, week: wi + 1 };
      (colDates[col] = colDates[col] || [])[wi] = iso;
    });
  });
  return { firstMonth, dateMap, colDates };
}
function derive() {
  const m = buildDateMap(S.calendar, S.year);
  D.firstMonth = m.firstMonth; D.dateMap = m.dateMap; D.colDates = m.colDates;
  D.allDates = Object.keys(D.dateMap).sort();
  D.lastDate = D.allDates[D.allDates.length - 1];
  D.byId = Object.fromEntries(S.classes.map(c => [c.id, c]));
  D.groups = [...new Set(S.classes.map(groupOf))].sort();
  D.profs = [...new Set(S.classes.map(c => c.prof).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  D.rooms = [...new Set(S.classes.map(c => c.room).filter(Boolean))].sort();
  D.candDates = D.allDates.filter(d => D.dateMap[d].week >= S.examWeek - 2 && dowOf(d) !== 0);
  deriveMakeups();
  for (const c of S.classes) if (!S.exams[c.id]) S.exams[c.id] = defaultExam(c);
  for (const id of Object.keys(S.exams)) if (!D.byId[id]) delete S.exams[id];
}
/** 지금 볼 계획을 정하고 파생값을 다시 계산 */
function usePlan(p) { S = p; derive(); return S; }

/* 보강: 결강일의 원래 수업은 없어지고, 보강일·교시에 그 수업이 생긴다.
   시험 주차 수업이 결강되고 보강됐다면 그 보강 시간이 기본 시험 시간이 된다. */
function deriveMakeups() {
  D.makeups = (S.makeups || []).filter(m => D.byId[m.classId] && m.to);
  D.cancelled = new Set(D.makeups.filter(m => m.from).map(m => `${m.classId}|${m.from}`));
  D.examMakeup = {};
  for (const m of D.makeups) {
    const c = D.byId[m.classId];
    if (m.from && m.from === D.colDates[c.day]?.[S.examWeek - 1]) D.examMakeup[c.id] = m;
  }
}
/** 이 수업의 시험 주차 수업 날짜 (보강됐으면 보강일) */
const defaultDate = c => D.examMakeup?.[c.id]?.to || D.colDates[c.day]?.[S.examWeek - 1] || '';
const defaultStart = c => D.examMakeup?.[c.id]?.start ?? c.start;
const defaultLen = c => { const m = D.examMakeup?.[c.id]; return m ? m.end - m.start + 1 : lenOf(c); };
const defaultRoom = c => D.examMakeup?.[c.id]?.room || c.room;
const prevDate = c => D.colDates[c.day]?.[S.examWeek - 2] || '';
function defaultExam(c) {
  return { method: '미정', date: defaultDate(c), start: defaultStart(c), len: defaultLen(c), room: defaultRoom(c), note: '', done: false };
}
/** 수업일·보강이 바뀐 뒤: 옮기지 않았던 시험은 새 기본 시간으로 따라가게 한다 */
function rebaseUnmoved(change) {
  const unmoved = new Set(S.classes.filter(c => S.exams[c.id] && !isMoved(c)).map(c => c.id));
  change();
  derive();
  for (const c of S.classes) if (unmoved.has(c.id)) Object.assign(S.exams[c.id], { date: defaultDate(c), start: defaultStart(c), len: defaultLen(c), room: defaultRoom(c) });
}
function dayInfoLabel(iso) {
  const info = D.dateMap[iso];
  if (!info) return { text: '수업일 현황에 없는 날', cls: 'alt' };
  const real = DOW[dowOf(iso)];
  const hasClasses = S.classes.some(c => c.day === info.col);
  let text = `${info.col}요일 시간표 · ${info.week}주차`;
  let cls = info.week === S.examWeek ? '' : 'alt';
  if (info.col !== real) text += ` (${real}요일에 ${info.col}요일 수업)`;
  if (!hasClasses) { text += ' · 우리 과 수업 없음'; cls = 'free'; }
  return { text, cls };
}
/** 수업일 표에서 실제 요일과 시간표 요일이 다른 날 (대체 수업일) */
function shiftedDays(calendar, year) {
  const { dateMap } = buildDateMap(calendar, year);
  return Object.entries(dateMap).filter(([iso, x]) => DOW[dowOf(iso)] !== x.col).map(([iso, x]) => ({ iso, ...x })).sort((a, b) => a.iso.localeCompare(b.iso));
}

/* ===== src/js/rules.js ===== */
/* ---------- 겹침 · 경고 규칙 ---------- */
const hasSlot = ex => !NO_SLOT.has(ex.method);
const isMoved = c => { const ex = S.exams[c.id]; return hasSlot(ex) && (ex.date !== defaultDate(c) || ex.start !== defaultStart(c)); };
/** 공지·엑셀에 쓰는 방식 글자: '기존 시간표 수업 진행'으로 확정했으면 그것을 앞에 */
const methodLabel = c => { const ex = S.exams[c.id]; return isKept(c) ? `기존 시간표 수업 진행${ex.method !== '미정' ? ` (${ex.method})` : ''}` : ex.method; };
/** '기존 시간표 수업 진행'으로 확정했고 그 뒤로 옮기지 않았는지 */
const isKept = c => !!(S.exams[c.id]?.keep && !isMoved(c));

/* 어떤 날짜에 시간을 차지하는 것 전부.
   - fixed: 그날 열리는 정규 수업 (시험 주차가 아닌 주, 또는 시험 주차여도 시험 시간이 없는 과목은 정상 수업으로 본다)
   - makeup: 그 날짜로 잡힌 보강 (결강일의 원래 수업은 fixed에서 빠진다)
   - exam:  그 날짜에 배치된 모든 시험 */
function itemsOn(iso, excludeId) {
  const out = [];
  const info = D.dateMap[iso];
  if (info) {
    const examWeekDay = info.week === S.examWeek;
    for (const c of S.classes) {
      if (c.day !== info.col) continue;
      if (examWeekDay && hasSlot(S.exams[c.id])) continue;
      if (D.cancelled?.has(`${c.id}|${iso}`)) continue;
      out.push({ kind: 'fixed', c, s: c.start, e: c.end, room: c.room, week: info.week });
    }
  }
  for (const m of D.makeups || []) {
    if (m.to !== iso) continue;
    const c = D.byId[m.classId];
    if (D.examMakeup[c.id] === m && hasSlot(S.exams[c.id])) continue;   // 시험 주차 보강 = 시험 자리
    out.push({ kind: 'makeup', c, s: m.start, e: m.end, room: m.room || c.room, week: m.from ? D.dateMap[m.from]?.week : null, from: m.from, m });
  }
  for (const c of S.classes) {
    if (c.id === excludeId) continue;
    const ex = S.exams[c.id];
    if (!hasSlot(ex) || ex.date !== iso) continue;
    out.push({ kind: 'exam', c, s: ex.start, e: ex.start + ex.len - 1, room: ex.room });
  }
  return out;
}
/** p = {date, start, len, room}. 교시가 겹치면서 같은 반 / 같은 교수 / 같은 강의실이면 겹침 */
function conflictsOf(c, p) {
  if (!p.date) return [];
  const s = p.start, e = p.start + p.len - 1, g = groupOf(c), rn = normRoom(p.room);
  const res = [];
  for (const it of itemsOn(p.date, c.id)) {
    if (it.s > e || it.e < s) continue;
    const kinds = [];
    if (groupOf(it.c) === g) kinds.push('반');
    if (it.c.prof && it.c.prof === c.prof) kinds.push('교수');
    if (rn && normRoom(it.room) === rn) kinds.push('강의실');
    if (kinds.length) res.push({ kinds, it });
  }
  return res;
}
function warningsOf(c, p) {
  const w = [];
  if (!p.date) { w.push('날짜를 정해 주세요'); return w; }
  const dw = dowOf(p.date);
  if (dw === 0 || dw === 6) w.push(`${DOW[dw]}요일이에요`);
  if (!D.dateMap[p.date]) w.push('수업일 현황에 없는 날짜예요');
  if (D.lastDate && p.date > D.lastDate) w.push(`학기 마지막 수업일(${fmt(D.lastDate)}) 이후예요`);
  const pv = prevDate(c);
  if (pv && p.date <= pv) w.push(`${S.examWeek - 1}주차 수업(${fmt(pv)})보다 이르거나 같은 날이에요`);
  if (p.start <= LUNCH && p.start + p.len - 1 >= LUNCH) w.push('점심시간(5교시)이 끼어 있어요');
  if (p.start + p.len - 1 > NP) w.push('10교시를 넘어가요');
  return w;
}
function describeConflict(x) {
  const it = x.it, o = it.c;
  const what = it.kind === 'exam' ? '시험' : it.kind === 'makeup' ? `보강(${it.from ? `${fmt(it.from)} 결강분` : '추가'})` : `${it.week}주차 수업`;
  const room = x.kinds.includes('강의실') ? ` · ${roomLabel(it.room)}` : '';
  return `${x.kinds.join('·')} 겹침: ${o.course}(${o.prof}, ${groupOf(o)}) ${what} ${pRange(it.s, it.e - it.s + 1)}${room}`;
}
function statusOf(c) {
  const ex = S.exams[c.id];
  if (!hasSlot(ex)) return { bad: [], warn: [], moved: false, undecided: false, done: !!ex.done, noslot: true, keep: false };
  const p = { date: ex.date, start: ex.start, len: ex.len, room: ex.room };
  return { bad: conflictsOf(c, p), warn: warningsOf(c, p), moved: isMoved(c), undecided: ex.method === '미정', done: !!ex.done, noslot: false, keep: isKept(c) };
}

/* ---------- 파일 읽기: 수업일 현황(PDF·붙여넣기), 강의시간표(xlsx) ---------- */

/** 외부 라이브러리는 처음 필요할 때만 CDN에서 불러온다. */
const libP = {};
function loadScript(url, globalName, failMsg) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (!libP[url]) libP[url] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => window[globalName] ? res(window[globalName]) : rej(new Error(failMsg));
    s.onerror = () => { delete libP[url]; rej(new Error(failMsg + ' 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
  return libP[url];
}
const loadExcelJS = () => loadScript(EXCELJS_URL, 'ExcelJS', '엑셀 기능을 불러오지 못했어요.');
async function loadPdfJs() {
  const lib = await loadScript(PDFJS_URL, 'pdfjsLib', 'PDF 읽기 기능을 불러오지 못했어요.');
  if (!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
  return lib;
}

/**
 * '주 / 월~토' 표 텍스트 → { cols, weeks }.
 * 각 줄: "주차번호 날짜 날짜 …" (예: "14 12/14 12/1 12/9 12/10 12/15(화) 12/19").
 * 주차 번호가 없는 표면 위에서부터 1주차로 센다.
 */
function parseCalendarText(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let cols = DAY_ORDER.slice();
  const weeks = [], unnumbered = [];
  const tokRe = /\d{1,2}\s*\/\s*\d{1,2}(?:\s*\(\s*[월화수목금토일]\s*\))?/g;
  for (const l of lines) {
    if (!/\d{1,2}\s*\/\s*\d{1,2}/.test(l)) {
      const hdr = l.match(/[월화수목금토일]/g);
      if (hdr && hdr.length >= 5 && /주/.test(l)) cols = hdr.filter(h => DAY_ORDER.includes(h));
      continue;
    }
    const m = l.match(/^(\d{1,2})(?:\s*주(?:차)?)?\s+(.*)$/);
    const body = m && !/^\s*\//.test(m[2]) ? m[2] : l;
    const toks = (body.match(tokRe) || []).map(t => t.replace(/\s+/g, ''));
    if (toks.length < Math.min(5, cols.length)) continue;
    if (m && body === m[2]) weeks[+m[1] - 1] = toks.slice(0, cols.length);
    else unnumbered.push(toks.slice(0, cols.length));
  }
  if (!weeks.filter(Boolean).length && unnumbered.length) unnumbered.forEach((r, i) => { weeks[i] = r; });
  const n = weeks.filter(Boolean).length;
  if (!n) return { error: true, msg: '표에서 주차별 날짜를 찾지 못했어요. 각 줄이 "주차 번호 + 날짜들" 순서인지 확인해 주세요.' };
  for (let i = 0; i < weeks.length; i++) if (!weeks[i]) weeks[i] = null;
  return { data: { cols, weeks }, msg: `${n}주 × ${cols.length}요일(${cols.join('·')})을 읽었어요.` };
}
function calendarText(cal) {
  const lines = ['주\t' + cal.cols.join('\t')];
  cal.weeks.forEach((row, i) => { if (row) lines.push(`${i + 1}\t${row.join('\t')}`); });
  return lines.join('\n');
}

/** PDF 글자 조각(pdf.js textContent.items) → 줄 텍스트. 같은 높이(y)끼리 묶고 왼쪽부터 잇는다. */
function pdfItemsToLines(items, tol = 3) {
  const its = items.filter(it => it && String(it.str || '').trim())
    .map(it => ({ s: String(it.str).trim(), x: it.transform[4], y: it.transform[5] }))
    .sort((a, b) => b.y - a.y || a.x - b.x);
  const rows = [];
  for (const it of its) {
    const row = rows.find(r => Math.abs(r.y - it.y) <= tol);
    if (row) row.items.push(it); else rows.push({ y: it.y, items: [it] });
  }
  return rows.sort((a, b) => b.y - a.y).map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.s).join(' '));
}
async function pdfToText(buf) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  const out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    out.push(...pdfItemsToLines(tc.items));
  }
  return out.join('\n');
}
/** 수업일 현황 PDF → parseCalendarText 결과 + 읽은 텍스트(사용자가 고칠 수 있게) */
async function parseCalendarPdf(buf) {
  const text = await pdfToText(buf);
  const res = parseCalendarText(text);
  if (res.error && !text.trim()) res.msg = 'PDF에서 글자를 찾지 못했어요. 스캔한 이미지 PDF라면 표를 직접 붙여 넣어 주세요.';
  return { ...res, text: res.data ? calendarText(res.data) : text };
}

function assignIds(list) {
  const seen = {};
  return list.map(o => { let id = `${o.day}-${o.year}${o.ban}-${o.start}`; if (seen[id]) id += '-' + (++seen[id]); else seen[id] = 1; return { ...o, id }; });
}
/**
 * 강의시간표 xlsx → { sheet, classes }.
 * '요일 | 학년 | 반 | 1 | 2 | … | 10' 머리글이 있는 첫 시트를 읽는다.
 * 칸 내용 "과목명(교수)-강의실", 가로로 병합된 칸 = 연속 교시.
 */
async function parseTimetableXlsx(buf) {
  const ExcelJS = await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  const txt = cell => { try { return String(cell.text ?? '').trim(); } catch { return ''; } };
  for (const ws of wb.worksheets) {
    let hdr = null;
    ws.eachRow({ includeEmpty: false }, (row, r) => { if (hdr) return; row.eachCell((cell, c) => { if (!hdr && /^요\s*일$/.test(txt(cell))) hdr = { r, c }; }); });
    if (!hdr) continue;
    let np = 0;
    for (let k = 0; k < 14; k++) { if (txt(ws.getCell(hdr.r, hdr.c + 3 + k)) === String(k + 1)) np = k + 1; else break; }
    if (!np) np = NP;
    const out = []; let day = null, year = null;
    for (let r = hdr.r + 1; r <= ws.rowCount; r++) {
      const dcell = ws.getCell(r, hdr.c);
      const dt = txt(dcell);
      if (/^요\s*일$/.test(dt) && !(dcell.isMerged && dcell.master && dcell.master.address !== dcell.address)) break;
      if (DAY_ORDER.includes(dt)) day = dt;
      const yt = txt(ws.getCell(r, hdr.c + 1)); if (/^\d$/.test(yt)) year = +yt;
      const ban = txt(ws.getCell(r, hdr.c + 2));
      if (!day || !year || !/^[A-Za-z]$/.test(ban)) continue;
      for (let k = 0; k < np; k++) {
        const cell = ws.getCell(r, hdr.c + 3 + k);
        if (cell.isMerged && cell.master && cell.master.address !== cell.address) continue;
        const t = txt(cell); if (!t) continue;
        let span = 1;
        while (k + span < np) { const nx = ws.getCell(r, hdr.c + 3 + k + span); if (nx.isMerged && nx.master && nx.master.address === cell.address) span++; else break; }
        const m = t.match(/^(.+?)\s*\(([^)]+)\)\s*-?\s*(.*)$/);
        out.push({ day, year, ban: ban.toUpperCase(), start: k + 1, end: k + span, course: (m ? m[1] : t).trim(), prof: m ? m[2].trim() : '', room: (m ? m[3] : '').replace(/호/g, '').replace(/\s+/g, '') });
        k += span - 1;
      }
    }
    if (out.length) return { sheet: ws.name, classes: assignIds(out) };
  }

}

/** xlsx 모든 시트 → 글자 (행은 줄, 칸은 탭). 날짜 칸은 "월/일"로 */
async function xlsxToText(buf) {
  const ExcelJS = await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  const cellText = v => {
    if (v == null) return '';
    if (v instanceof Date) return `${v.getUTCFullYear()}/${v.getUTCMonth() + 1}/${v.getUTCDate()}`;
    if (typeof v === 'object') { if (v.richText) return v.richText.map(r => r.text).join(''); if ('result' in v) return cellText(v.result); if (v.text) return String(v.text); return ''; }
    return String(v);
  };
  const lines = [];
  for (const ws of wb.worksheets) ws.eachRow({ includeEmpty: false }, row => {
    const vals = []; row.eachCell({ includeEmpty: true }, cell => vals.push(cellText(cell.value).replace(/\s*\n\s*/g, ' ').trim()));
    if (vals.some(Boolean)) lines.push(vals.join('\t'));
  });

}

/**
 * 파일 하나가 무슨 자료인지 알아낸다.

 *   timetable: 학과 강의시간표 (xlsx, '요일·학년·반·1~10교시' 머리글)
 *   calendar:  요일별 수업일 현황 (pdf · hwp · xlsx · 글자)
 *   makeups:   보강결과보고서·보강 계획 (hwp · xlsx · pdf · 글자). 수업과 짝짓기는 적용할 때 parseMakeups()로.

async function recognizeFile(file) {

    else return { name, type: 'unknown', msg: '읽을 수 없는 파일 형식이에요 (.xlsx, .pdf, .hwp, .txt).' };

}
const TYPE_LABEL = { timetable: '강의시간표', calendar: '요일별 수업일 현황', makeups: '보강', unknown: '알 수 없음' };

/* ===== src/js/hwp.js ===== */
/* ---------- 한글(.hwp 5.0) 문서 → 글자 ----------
   학교 양식(보강결과보고서, 수업일 현황 등)이 .hwp로 오기 때문에 브라우저에서 직접 읽는다. 라이브러리 없음.
   1) .hwp는 MS 복합 문서(CFB) 안에 FileHeader, BodyText/Section0.. 스트림이 들어 있다 → cfbStreams()
   2) Section 스트림은 (압축되어 있으면 raw deflate를 풀고) 레코드의 나열이다 → hwpRecordsToLines()
   3) 표는 칸(LIST_HEADER)마다 행·열 번호가 있으므로, 같은 행의 칸은 탭으로 이어 한 줄로 만든다.
      예) "35382-101\tJAVA프로그래밍응용\t2\t2026/09/22\t화\t6~8\t2026/12/15\t화\t6~8\t양숙희" */

/** CFB(복합 문서) → { 경로: Uint8Array } (경로 예: 'FileHeader', 'BodyText/Section0') */
function cfbStreams(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
  if (bytes.length < 512 || sig.some((b, i) => bytes[i] !== b)) throw new Error('한글(.hwp 5.0) 파일이 아니에요.');
  const u32 = o => dv.getUint32(o, true);
  const secSize = 1 << dv.getUint16(0x1E, true), miniSize = 1 << dv.getUint16(0x20, true);
  const nFat = u32(0x2C), firstDir = u32(0x30), cutoff = u32(0x38), firstMiniFat = u32(0x3C), firstDifat = u32(0x44);
  const END = 0xFFFFFFFA;
  const secOff = sid => (sid + 1) * secSize;
  // FAT 섹터 목록 (헤더의 109개 + DIFAT 사슬)
  const fatSecs = [];
  for (let i = 0; i < 109 && fatSecs.length < nFat; i++) { const s = u32(0x4C + i * 4); if (s < END) fatSecs.push(s); }
  for (let d = firstDifat, guard = 0; d < END && fatSecs.length < nFat && guard < 10000; guard++) {
    const per = secSize / 4 - 1;
    for (let i = 0; i < per && fatSecs.length < nFat; i++) { const s = u32(secOff(d) + i * 4); if (s < END) fatSecs.push(s); }
    d = u32(secOff(d) + per * 4);
  }
  const fat = [];
  for (const s of fatSecs) for (let i = 0; i < secSize / 4; i++) fat.push(u32(secOff(s) + i * 4));
  const chain = (start, table) => { const out = []; for (let s = start, g = 0; s < END && g < 1e6; g++) { out.push(s); s = table[s]; } return out; };
  const readChain = start => {
    const secs = chain(start, fat), out = new Uint8Array(secs.length * secSize);
    secs.forEach((s, i) => out.set(bytes.subarray(secOff(s), secOff(s) + secSize), i * secSize));
    return out;
  };
  // 디렉터리
  const dir = readChain(firstDir), ddv = new DataView(dir.buffer);
  const entries = [];
  for (let o = 0; o + 128 <= dir.length; o += 128) {
    const nameLen = ddv.getUint16(o + 0x40, true);
    let name = '';
    for (let i = 0; i < Math.max(0, nameLen / 2 - 1); i++) name += String.fromCharCode(ddv.getUint16(o + i * 2, true));
    entries.push({ name, type: dir[o + 0x42], left: ddv.getUint32(o + 0x44, true), right: ddv.getUint32(o + 0x48, true),
      child: ddv.getUint32(o + 0x4C, true), start: ddv.getUint32(o + 0x74, true), size: ddv.getUint32(o + 0x78, true) });
  }
  const root = entries[0];
  const miniStream = root && root.start < END ? readChain(root.start) : new Uint8Array(0);
  const miniFat = [];
  if (firstMiniFat < END) { const mf = readChain(firstMiniFat), mdv = new DataView(mf.buffer); for (let i = 0; i + 4 <= mf.length; i += 4) miniFat.push(mdv.getUint32(i, true)); }
  const readStream = e => {
    if (e.size < cutoff) {
      const secs = chain(e.start, miniFat), out = new Uint8Array(secs.length * miniSize);
      secs.forEach((s, i) => out.set(miniStream.subarray(s * miniSize, (s + 1) * miniSize), i * miniSize));
      return out.subarray(0, e.size);
    }
    return readChain(e.start).subarray(0, e.size);
  };
  // 트리(왼쪽·오른쪽 형제, 자식)를 돌며 경로를 만든다
  const out = {};
  const walk = (idx, prefix, seen) => {
    if (idx >= END || idx >= entries.length || seen.has(idx)) return;
    seen.add(idx);
    const e = entries[idx];
    walk(e.left, prefix, seen); walk(e.right, prefix, seen);
    const path = prefix ? `${prefix}/${e.name}` : e.name;
    if (e.type === 2) out[path] = readStream(e);
    else if (e.type === 1) walk(e.child, path, seen);
  };
  if (root) walk(root.child, '', new Set());
  return out;
}

async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}

/** HWP 레코드 → 줄 목록. 본문 문단은 한 줄씩, 표는 한 행이 한 줄(칸은 탭) */
function hwpRecordsToLines(data) {
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const lines = [];
  let cur = null;          // 지금 쓰는 줄
  let table = 0, row = -1; // 지금 표 번호·행
  let inCell = false, cellLevel = -1, cellHasText = false;
  const flush = () => { if (cur !== null && cur.replace(/\t/g, '').trim()) lines.push(cur.replace(/[  ]+/g, ' ').trim()); cur = null; };
  for (let i = 0; i + 4 <= data.length;) {
    const h = dv.getUint32(i, true); i += 4;
    const tag = h & 0x3ff, level = (h >> 10) & 0x3ff;
    let size = (h >>> 20) & 0xfff;
    if (size === 0xfff) { size = dv.getUint32(i, true); i += 4; }
    const rec = data.subarray(i, i + size); i += size;
    if (tag === 77) { table++; row = -1; continue; }                       // HWPTAG_TABLE
    if (tag === 72 && size >= 16) {                                         // HWPTAG_LIST_HEADER (표의 칸)
      const rdv = new DataView(rec.buffer, rec.byteOffset, rec.byteLength);
      const r = rdv.getUint16(10, true);
      if (r !== row || cur === null) { flush(); cur = ''; row = r; } else cur += '\t';
      inCell = true; cellLevel = level; cellHasText = false;
      continue;
    }
    if (tag === 66) {                                                       // HWPTAG_PARA_HEADER
      if (inCell && level < cellLevel) { inCell = false; flush(); row = -1; }
      if (!inCell) { flush(); cur = ''; }
      continue;
    }
    if (tag !== 67) continue;                                               // HWPTAG_PARA_TEXT
    let t = '';
    for (let j = 0; j + 2 <= rec.length;) {
      const ch = rec[j] | (rec[j + 1] << 8);
      if (ch < 32) {
        if ([1, 2, 3, 11, 12, 14, 15, 16, 17, 18, 21, 22, 23, 4, 5, 6, 7, 8, 9, 19, 20].includes(ch)) { if (ch === 9) t += ' '; j += 16; continue; }
        if (ch === 10) t += ' ';
        j += 2; continue;
      }
      t += String.fromCharCode(ch); j += 2;
    }
    if (cur === null) cur = '';
    cur += t;   // 한 칸 안의 여러 문단(줄바꿈된 과목명 등)은 붙여 쓴다
    cellHasText = true;
  }
  flush();
  return lines;
}

/** .hwp 바이트 → 글자(줄바꿈으로 구분) */
async function hwpToText(bytes) {
  const st = cfbStreams(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
  const fh = st['FileHeader'];
  if (!fh || !String.fromCharCode(...fh.subarray(0, 17)).startsWith('HWP Document File')) throw new Error('한글(.hwp 5.0) 문서가 아니에요.');
  const props = new DataView(fh.buffer, fh.byteOffset, fh.byteLength).getUint32(36, true);
  if (props & 2) throw new Error('암호가 걸린 한글 문서는 읽을 수 없어요. 암호를 풀고 다시 저장해 주세요.');
  const secs = Object.keys(st).filter(k => /^BodyText\/Section\d+$/.test(k)).sort((a, b) => +a.slice(16) - +b.slice(16));
  const out = [];
  for (const k of secs) out.push(...hwpRecordsToLines((props & 1) ? await inflateRaw(st[k]) : st[k]));
  return out.join('\n');
}

/* ===== src/js/makeups.js ===== */
/* ---------- 보강 · 자료 종류 알아보기 (DOM 없음, 단위 테스트에서 그대로 불러씀) ----------
   보강결과보고서(학교 양식) 한 줄 예:
     35382-101  JAVA프로그래밍응용  2  2026/09/22 화 6~8  2026/12/15 화 6~8  양숙희
     과목코드     과목명            학년  결강 일자·요일·교시   보강 일자·요일·교시    담당교수
   - 반 칸이 없다 → 과목코드 끝 3자리(101=A, 102=B, 103=C)와 결강 요일·교시로 시간표 수업을 찾는다.
   - 날짜가 둘이면 첫째가 결강(원래 수업일), 둘째가 보강일. 하나면 보강일만.
   - 교시는 "2~4", "2~4교시", "13:35~15:20" 모두 읽는다.
   plan.makeups = [{ id, classId, from(결강일|''), to(보강일), start, end, room, note }] */

// 2026/12/15, 2026.12.15, 2026-12-15, 12/15, 12.15, 12월 15일, 12/15(화)
const DATE_RE = /(?<![\d.])(?:(\d{4})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})|(\d{1,2})\s*[.\/월]\s*(\d{1,2}))(?:\s*일)?(?!\d)(?:\s*\(\s*[월화수목금토일]\s*\))?/g;
const normName = s => String(s || '').replace(/\s+/g, '').replace(/[()（）\[\]·.,-]/g, '').toUpperCase();

/** 한 줄에서 날짜들을 ISO로 (연도 없으면 학년도·달력 첫 달로 짐작) */
function lineDates(line, year, firstMonth) {
  const out = [];
  for (const m of String(line).matchAll(DATE_RE)) {
    const mo = +(m[2] || m[4]), da = +(m[3] || m[5]);
    if (mo < 1 || mo > 12 || da < 1 || da > 31) continue;
    let y = m[1] ? +m[1] : +year + (firstMonth >= 7 && mo <= 2 ? 1 : 0);
    out.push(`${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`);
  }
  return out;
}
/** 날짜를 지운 줄에서 교시 범위들: "2~4", "6-8교시", "3교시", "13:35~15:20" */
function linePeriods(line) {
  const s = String(line).replace(DATE_RE, ' ').replace(/\d{5}-\d{3}/g, ' ');
  const out = [];
  const re = /(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})|(?<![\d:])(\d{1,2})\s*[~\-–]\s*(\d{1,2})(?![\d:])(?:\s*교시)?|(?<![\d:~\-])(\d{1,2})\s*교시/g;
  for (const m of s.matchAll(re)) {
    if (m[1]) {
      const t1 = `${m[1].padStart(2, '0')}:${m[2]}`, t2 = `${m[3].padStart(2, '0')}:${m[4]}`;
      let a = PERIODS.findIndex(p => p[1] > t1) + 1, b = PERIODS.findIndex(p => p[1] >= t2) + 1;
      if (a > 0) out.push([a, b > 0 ? b : NP]);
    } else if (m[5]) { const a = +m[5], b = +m[6]; if (a >= 1 && b >= a && b <= 15) out.push([a, b]); }
    else out.push([+m[7], +m[7]]);
  }
  return out;
}

/**
 * 보강 양식 글자 → { makeups, unmatched }
 * classes: 그 학기 수업 목록, calendar/year: 날짜를 시간표 요일·주차로 바꿀 때
 */
function parseMakeups(text, classes, calendar, year) {
  const { dateMap, firstMonth } = buildDateMap(calendar, year);
  const byName = classes.map(c => ({ c, n: normName(c.course) })).filter(x => x.n);
  const makeups = [], unmatched = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.trim();
    const dates = lineDates(line, year, firstMonth);
    if (!dates.length) continue;
    const periods = linePeriods(line);
    const code = line.match(/\d{5}-(\d{3})/);
    if (!code && !periods.length) continue;      // 제출일 같은 날짜만 있는 줄
    const nl = normName(line);
    let cands = byName.filter(x => nl.includes(x.n));
    if (!cands.length) { unmatched.push({ line, why: '시간표에서 이 과목을 찾지 못했어요' }); continue; }
    const longest = Math.max(...cands.map(x => x.n.length));
    cands = cands.filter(x => x.n.length === longest).map(x => x.c);
    const banFromCode = code ? String.fromCharCode(64 + (+code[1] % 100)) : null;
    const g = line.match(/(?<![\d])([1-4])\s*학년\s*([A-Za-z])\s*반?|(?<![\d\-])([1-4])\s*([A-Za-z])\s*반/);
    const grp = g ? `${g[1] || g[3]}${(g[2] || g[4]).toUpperCase()}` : null;
    const cells = line.split('\t').map(t => t.trim());
    const yearTok = cells.find(t => /^[1-4](학년)?$/.test(t));
    const from = dates.length >= 2 ? dates[0] : '';
    const to = dates[dates.length - 1];
    const fromCol = from && dateMap[from] ? dateMap[from].col : (from ? DOW[dowOf(from)] : null);
    const fromP = dates.length >= 2 ? periods[0] : null;
    const score = c => (grp && groupOf(c) === grp ? 8 : 0) + (banFromCode && c.ban === banFromCode ? 4 : 0)
      + (yearTok && c.year === +yearTok[0] ? 2 : 0) + (fromCol && c.day === fromCol ? 3 : 0)
      + (fromP && c.start === fromP[0] ? 2 : 0) + (c.prof && line.includes(c.prof) ? 2 : 0);
    cands.sort((a, b) => score(b) - score(a));
    const c = cands[0];
    if (cands.length > 1 && score(cands[1]) === score(c) && cands[1].ban !== c.ban) { unmatched.push({ line, why: `어느 반인지 알 수 없어요 (${cands.map(groupOf).join('/')})` }); continue; }
    const p = periods[periods.length - 1] || [c.start, c.end];
    const room = (line.match(/(?<!\d)(\d{3,4})\s*호/) || [])[1] || c.room;
    makeups.push({ id: `${c.id}|${from}|${to}|${p[0]}`, classId: c.id, from, to, start: p[0], end: p[1], room, note: line.replace(/\t+/g, ' ') });
  }
  return { makeups, unmatched };
}

/** 글자만 보고 어떤 자료인지: 'calendar'(요일별 수업일 현황) | 'makeups'(보강) | 'unknown' */
function classifyText(text) {
  const t = String(text || '');
  const cal = parseCalendarText(t);
  const weeks = cal.data ? cal.data.weeks.filter(Boolean).length : 0;
  if (weeks >= 6 && !/보\s*강\s*(결\s*과|계\s*획)/.test(t)) return 'calendar';
  const rows = t.split(/\r?\n/).filter(l => (l.match(DATE_RE) || []).length >= 2 && linePeriods(l).length);
  // '보강'이라는 말이 있거나, 과목코드(35382-101)가 있는 결강·보강 줄이 있으면 보강 자료
  if (rows.length && (/보\s*강/.test(t) || rows.some(l => /\d{5}-\d{3}/.test(l)))) return 'makeups';
  if (weeks >= 6) return 'calendar';
  return 'unknown';
}

/* ===== src/js/store.js ===== */
/* ---------- 저장 ----------
   - 기본: 이 브라우저 localStorage('exam-planner:v2'). 예전 v1 데이터('exam-planner:v1')는 처음 열 때 계획 하나로 옮긴다(원본은 그대로 둠).
   - claude.ai 아티팩트로 열면 window.claude.use('db')의 'plans/{planId}' 문서에 계획별로 저장한다.
     삭제는 {deleted:true} 표시만 남겨 다른 사람 화면에서도 지워지게 한다. 지금 보는 계획(currentId)은 브라우저마다 따로. */
const LS_KEY = 'exam-planner:v2';
const LS_KEY_V1 = 'exam-planner:v1';
const TAB_ID = Math.random().toString(36).slice(2, 10);

/** 이 브라우저에 저장. silent가 아니면 GitHub 저장도 예약(github.js) */
function persistLocal({ silent = false } = {}) {
  let ok = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(Store)); } catch { ok = false; }
  if (!silent && typeof ghQueue === 'function') ghQueue();
  return ok;
}
function loadLocal() {
  try { const t = localStorage.getItem(LS_KEY); if (t) { const st = toStore(JSON.parse(t)); if (st && Object.keys(st.plans).length) return st; } } catch {}
  try { const t = localStorage.getItem(LS_KEY_V1); if (t) return toStore(JSON.parse(t)); } catch {}
  return null;
}

const cloud = { col: null, loaded: false, mode: 'local', queue: {}, writing: {}, timer: {} };
function setSave(mode, detail) {
  if (mode) cloud.mode = mode;
  const el = $('#saveState');
  const map = { local: '이 브라우저에만 저장돼요', loading: '저장된 내용 불러오는 중', saving: '저장 중', cloud: '저장됨', offline: '저장소 연결 대기 중 · 이 브라우저에 보관', error: '저장소에 저장하지 못했어요 · 이 브라우저에 보관',
    'gh-loading': 'GitHub에서 불러오는 중', 'gh-pending': 'GitHub에 저장 대기', 'gh-saving': 'GitHub에 저장 중', 'gh-saved': 'GitHub에 저장됨',
    'gh-readonly': 'GitHub에서 불러옴 · 보기 전용', 'gh-error': 'GitHub 저장 실패 · 이 브라우저에 보관' };
  el.textContent = map[cloud.mode] || '';
  el.className = 'savepill ' + cloud.mode;
  el.title = detail ? String(detail) : '';
}
/** 계획 p가 바뀌었다고 알림 → 로컬 저장 + (있으면) 클라우드 예약 */
function touchPlan(p) {
  p.rev = (p.rev || 0) + 1; p.updatedAt = Date.now(); p.writer = TAB_ID;
  persistLocal();
  queueCloud(p.id);
}
function queueCloud(id) {
  if (!cloud.col) return;
  cloud.queue[id] = true; setSave('saving');
  clearTimeout(cloud.timer[id]); cloud.timer[id] = setTimeout(() => flushCloud(id), 700);
}
async function flushCloud(id) {
  if (!cloud.col || cloud.writing[id] || !cloud.queue[id]) return;
  cloud.writing[id] = true; delete cloud.queue[id];
  const p = Store.plans[id];
  try {
    const body = p ? { payload: JSON.stringify(p), rev: p.rev || 0, updatedAt: p.updatedAt || 0, writer: TAB_ID }
      : { deleted: true, updatedAt: Date.now(), writer: TAB_ID };
    await cloud.col.doc(id).set(body);
    if (!Object.keys(cloud.queue).length) setSave('cloud');
  } catch (err) {
    if (err && err.code === 'unavailable') { cloud.queue[id] = true; setTimeout(() => flushCloud(id), 1500 + Math.random() * 1500); }
    else setSave('error', err && (err.message || err.code));
  } finally {
    cloud.writing[id] = false;
    if (cloud.queue[id] && cloud.mode !== 'error') { clearTimeout(cloud.timer[id]); cloud.timer[id] = setTimeout(() => flushCloud(id), 400); }
  }
}
/** 클라우드에서 온 문서 하나를 반영. 바뀐 게 있으면 true */
function applyRemote(id, d) {
  const local = Store.plans[id];
  if (d.deleted) {
    if (local && (local.updatedAt || 0) <= (d.updatedAt || 0)) { delete Store.plans[id]; return true; }
    return false;
  }
  if (d.writer === TAB_ID || (local && (local.updatedAt || 0) >= (d.updatedAt || 0))) return false;
  try { const p = JSON.parse(d.payload); if (!validPlan(p)) return false; Store.plans[id] = upgradePlan(p); return true; } catch { return false; }
}
async function initCloud() {
  if (!(window.claude && typeof window.claude.use === 'function')) { setSave('local'); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch { db = null; }
  if (!db) { setSave('local'); return; }
  try { cloud.col = db.collection('plans'); } catch { setSave('local'); return; }
  setSave('loading');
  const timer = setTimeout(() => { if (!cloud.loaded) setSave('offline'); }, 10000);
  cloud.col.onSnapshot(async snap => {
    const definitive = !snap.metadata.fromCache;
    let dirty = false;
    const seen = new Set();
    for (const doc of snap.docs) { seen.add(doc.id); if (applyRemote(doc.id, doc.data() || {})) dirty = true; }
    if (definitive && !cloud.loaded) {
      cloud.loaded = true; clearTimeout(timer);
      if (snap.empty) await importLegacyCloud(db);
      // 이 브라우저에만 있거나 더 최신인 계획은 올린다
      for (const p of Object.values(Store.plans)) {
        const d = snap.docs.find(x => x.id === p.id)?.data();
        if (!seen.has(p.id) || (d && !d.deleted && (p.updatedAt || 0) > (d.updatedAt || 0))) queueCloud(p.id);
      }
      if (!Object.keys(cloud.queue).length && cloud.mode !== 'error') setSave('cloud');
    }
    if (dirty) { persistLocal(); afterStoreChanged(); }
  }, err => { clearTimeout(timer); cloud.col = null; setSave('error', err && (err.message || err.code)); });
}
/** 예전 버전이 'planner/state' 한 문서에 저장했던 내용이 있으면 계획으로 가져온다 */
async function importLegacyCloud(db) {
  try {
    const snap = await db.doc('planner/state').get();
    if (!snap.exists) return;
    const s = JSON.parse(snap.data().payload);
    if (!validPlan(s)) return;
    const p = upgradePlan(s);
    const local = Store.plans[p.id];
    if (!local || (local.updatedAt || 0) < (s.updatedAt || 0)) { Store.plans[p.id] = p; persistLocal(); afterStoreChanged(); }
  } catch {}
}
/** 저장소가 바깥(클라우드)에서 바뀐 뒤: 보고 있던 계획을 다시 잡고 화면 갱신 */
function afterStoreChanged() {
  if (!Object.keys(Store.plans).length && S) Store.plans[S.id] = S;   // 마지막 계획까지 지워지면 보던 것을 남긴다
  if (!Store.plans[Store.currentId]) Store.currentId = latestPlanId(Store);
  usePlan(Store.plans[Store.currentId]);
  if (typeof render === 'function') { render(); if (ui.drawerId && D.byId[ui.drawerId]) openDrawer(ui.drawerId); }
}

/* ===== src/js/github.js ===== */
/* ---------- GitHub 저장 ----------
   정적 페이지(GitHub Pages)가 GitHub API로 저장소 파일을 직접 읽고 쓴다.
   - 위치: 저장소의 'data' 브랜치 / data/plans.json (코드가 있는 main과 분리 → 저장해도 사이트 재배포·코드 기록에 영향 없음)
   - 토큰(fine-grained, 이 저장소 Contents 읽기·쓰기)이 있으면 바뀐 뒤 몇 초 뒤 자동 커밋, 없으면 불러와서 보기만.
   - 다른 컴퓨터가 먼저 저장했으면(409) 다시 불러와 mergeStores()로 합친 뒤 저장.
   - 토큰은 이 브라우저 localStorage에만 둔다. */
const GH_KEY = 'exam-planner:github';
const GH_API = 'https://api.github.com';
const GH_SAVE_DELAY = 4000;
const gh = { cfg: null, sha: null, lastText: null, timer: null, busy: false, again: false, dirty: false, mode: 'off', error: '', repoInfo: null, savedAt: 0, loadedAt: 0 };

/** GitHub Pages 주소(<owner>.github.io/<repo>/)에서 저장소를 짐작 */
function ghGuessRepo(loc = location) {
  const h = loc.hostname || '';
  if (!h.endsWith('.github.io')) return '';
  const owner = h.split('.')[0];
  const seg = (loc.pathname || '').split('/').filter(Boolean)[0];
  return `${owner}/${seg && !seg.includes('.') ? seg : h}`;
}
function ghLoadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem(GH_KEY) || '{}') || {}; } catch {}
  gh.cfg = { repo: c.repo || ghGuessRepo(), branch: c.branch || 'data', path: c.path || 'data/plans.json', token: c.token || '' };
}
function ghStoreCfg() { try { localStorage.setItem(GH_KEY, JSON.stringify(gh.cfg)); } catch {} }
const ghOn = () => !!(gh.cfg && /^[\w.-]+\/[\w.-]+$/.test(gh.cfg.repo));
const ghCanWrite = () => ghOn() && !!gh.cfg.token;

function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function ghApi(method, path, body, accept) {
  const headers = { Accept: accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (gh.cfg.token) headers.Authorization = 'Bearer ' + gh.cfg.token;
  if (body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(`${GH_API}/repos/${gh.cfg.repo}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch { throw new GhError(0, 'GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  return r;
}
async function ghFail(r, what) {
  let detail = '';
  try { detail = (await r.json()).message || ''; } catch {}
  const s = r.status;
  const msg = s === 401 ? '토큰이 틀렸거나 만료됐어요. 새 토큰을 넣어 주세요.'
    : s === 403 && /rate limit/i.test(detail) ? 'GitHub 요청 한도를 넘었어요. 토큰을 넣으면 한도가 늘어나요. 잠시 후 다시 해 주세요.'
    : s === 403 ? '이 토큰에 저장소 쓰기 권한이 없어요. 토큰의 Repository permissions에서 Contents를 Read and write로 해 주세요.'
    : s === 404 ? `${what}을(를) 찾지 못했어요. 저장소 이름을 확인해 주세요. 비공개 저장소라면 토큰이 필요해요.`
    : `${what} 실패 (${s}) ${detail}`;
  return new GhError(s, msg);
}

/** 저장소 정보(공개 여부·기본 브랜치) */
async function ghRepoInfo() {
  const r = await ghApi('GET', '');
  if (!r.ok) throw await ghFail(r, '저장소');
  const j = await r.json();
  gh.repoInfo = { private: !!j.private, defaultBranch: j.default_branch || 'main', canPush: !!(j.permissions && j.permissions.push), url: j.html_url };
  return gh.repoInfo;
}
/** 저장 브랜치가 없으면 기본 브랜치에서 만든다 */
async function ghEnsureBranch() {
  const b = encodeURIComponent(gh.cfg.branch);
  const r = await ghApi('GET', `/git/ref/heads/${b}`);
  if (r.ok) return;
  if (r.status !== 404) throw await ghFail(r, '브랜치');
  const info = gh.repoInfo || await ghRepoInfo();
  const base = await ghApi('GET', `/git/ref/heads/${encodeURIComponent(info.defaultBranch)}`);
  if (!base.ok) throw await ghFail(base, '기본 브랜치');
  const sha = (await base.json()).object.sha;
  const c = await ghApi('POST', '/git/refs', { ref: `refs/heads/${gh.cfg.branch}`, sha });

/** GitHub의 data/plans.json → { store|null, sha|null } (파일·브랜치가 아직 없으면 store null) */
async function ghRead() {
  const path = `/contents/${gh.cfg.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(gh.cfg.branch)}`;
  const r = await ghApi('GET', path);
  if (r.status === 404) {
    if (!gh.repoInfo) await ghRepoInfo();   // 저장소 자체가 없으면 여기서 오류
    return { store: null, sha: null };
  }
  if (!r.ok) throw await ghFail(r, '저장 파일');
  const j = await r.json();
  let text;
  if (j.encoding === 'base64' && j.content) text = b64DecodeUtf8(j.content);
  else {   // 1MB가 넘으면 content가 비어 온다 → 원본으로 다시 받기
    const raw = await ghApi('GET', path, null, 'application/vnd.github.raw+json');
    if (!raw.ok) throw await ghFail(raw, '저장 파일');
    text = await raw.text();
  }
  const store = toStore(JSON.parse(text));
  if (!store) throw new GhError(0, `GitHub의 ${gh.cfg.path}가 이 도구의 저장 형식이 아니에요.`);
  return { store, sha: j.sha, text };
}
async function ghWrite(text, message) {
  const body = { message, content: b64EncodeUtf8(text), branch: gh.cfg.branch };
  if (gh.sha) body.sha = gh.sha;
  const r = await ghApi('PUT', `/contents/${gh.cfg.path.split('/').map(encodeURIComponent).join('/')}`, body);
  if (r.status === 409 || (r.status === 422 && !gh.sha)) return false;   // 다른 곳에서 먼저 저장함
  if (!r.ok) throw await ghFail(r, '저장');
  gh.sha = (await r.json()).content.sha;
  return true;
}
const ghPayloadText = () => JSON.stringify(storePayload(Store), null, 1) + '\n';

/** GitHub 내용과 이 브라우저 내용을 합친다. 이 브라우저 쪽이 바뀌면 화면을 다시 그린다. → GitHub에 올릴 게 있는지 */

}

  setSave(mode, error);

}
function commitMessage() {
  const p = S && Store.plans[S.id];
  return p ? `시험 데이터 저장: ${p.title}` : '시험 데이터 저장';
}

/** 불러오기 + 합치기 + (쓸 수 있고 바뀐 게 있으면) 저장. 한 번에 하나만 돈다. */
async function ghSync({ push = true, fresh = false } = {}) {
  if (!ghOn()) return;
  if (gh.busy) { gh.again = true; gh.againFresh = gh.againFresh || fresh; return; }
  gh.busy = true; gh.dirty = false;
  try {
    ghSetMode(gh.loadedAt ? 'gh-saving' : 'gh-loading');
    if (!gh.repoInfo) await ghRepoInfo().catch(e => { if (e.status !== 403) throw e; });
    for (let attempt = 0; attempt < 3; attempt++) {
      if (fresh || !gh.loadedAt || attempt > 0 || !gh.sha) {
        const remote = await ghRead();
        gh.sha = remote.sha; gh.lastText = remote.text ?? null; gh.loadedAt = Date.now();
        ghMergeIn(remote);
      }
      if (!push || !ghCanWrite()) break;
      const text = ghPayloadText();
      if (text === gh.lastText) break;          // 바뀐 게 없음
      if (!gh.sha) await ghEnsureBranch();
      if (await ghWrite(text, commitMessage())) { gh.lastText = text; gh.savedAt = Date.now(); break; }
      if (attempt === 2) throw new GhError(409, '다른 곳에서 계속 저장하고 있어서 저장하지 못했어요. 잠시 후 다시 해 주세요.');
    }
    ghSetMode(ghCanWrite() ? 'gh-saved' : 'gh-readonly');
  } catch (err) {
    gh.dirty = true;
    ghSetMode('gh-error', err.message || String(err));
  } finally {
    gh.busy = false;
    if (gh.again) { const f = gh.againFresh; gh.again = gh.againFresh = false; ghSync({ push, fresh: f }); }
  }
}
/** 이 브라우저 저장소가 바뀔 때마다 부른다 (persistLocal). 잠시 모았다가 한 번에 커밋. */
function ghQueue() {
  if (!ghCanWrite() || !gh.loadedAt) return;
  if (ghPayloadText() === gh.lastText) return;
  gh.dirty = true;

}
function ghSaveNow() { clearTimeout(gh.timer); return ghSync(); }
function initGitHub() {
  ghLoadCfg();
  window.addEventListener('beforeunload', e => { if (gh.dirty || gh.busy) { ghSaveNow(); e.preventDefault(); e.returnValue = ''; } });
  // 다른 컴퓨터에서 저장한 내용: 이 창으로 돌아올 때 다시 불러온다 (30초에 한 번까지)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ghOn() && gh.loadedAt && Date.now() - gh.loadedAt > 30000) ghSync({ fresh: true });
  });
  if (ghOn()) ghSync();
}

/* ---------- 엑셀 내보내기 · 파일 저장 ----------

    { header: '확정', key: 'done', width: 6 }, { header: '겹침·확인 필요', key: 'issues', width: 44 }, { header: '요청사항·메모', key: 'note', width: 36 }];

  $('#listTable').innerHTML = `<thead><tr><th>상태</th><th>반</th><th>과목 · 교수</th><th>원래 수업</th><th>방식</th><th>시험 날짜</th><th>시작</th><th>길이</th><th>강의실</th><th>요청사항·메모</th><th>확정</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="11" class="hint">조건에 맞는 과목이 없어요.</td></tr>`}</tbody>`;
}
function profMessage(prof) {
  const list = S.classes.filter(c => c.prof === prof).sort((a, b) => (S.exams[a.id].date || '').localeCompare(S.exams[b.id].date || '') || S.exams[a.id].start - S.exams[b.id].start);
  const lines = [`[${S.title} 일정 확인]`, `${prof} 교수님, 안녕하세요. ${S.dept} 사무실입니다.`, '담당 과목 시험 일정을 아래와 같이 정리했습니다.', ''];
  list.forEach((c, i) => {
    const ex = S.exams[c.id];
    if (!hasSlot(ex)) lines.push(`${i + 1}) ${c.course} (${groupOf(c)}): ${ex.method}`);
    else lines.push(`${i + 1}) ${c.course} (${groupOf(c)}): ${fmt(ex.date)} ${pRange(ex.start, ex.len)} ${tRange(ex.start, ex.len)}, ${roomLabel(ex.room)}, ${methodLabel(c) === '미정' ? '시험 방식 미정' : methodLabel(c)}`);
    if (ex.note) lines.push(`   메모: ${ex.note}`);
  });
  lines.push('', '시험 방식이나 시간을 바꾸셔야 하면 회신 부탁드립니다. 감사합니다.');
  return lines.join('\n');
}
function renderProfs() {
  $('#profGrid').innerHTML = D.profs.map(p => {
    const list = S.classes.filter(c => c.prof === p);
    const done = list.filter(c => S.exams[c.id].done).length;
    const bad = list.filter(c => statusOf(c).bad.length).length;
    return `<article class="card"><h3>${esc(p)} <small>${list.length}과목 · 확정 ${done}${bad ? ` · <span style="color:var(--bad)">겹침 ${bad}</span>` : ''}</small></h3>
      <pre class="msg" id="msg-${esc(p)}">${esc(profMessage(p))}</pre>
      <div class="row"><button type="button" class="btn small" data-copy="${esc(p)}">문구 복사</button>
      <button type="button" class="btn small" data-markdone="${esc(p)}">이 교수님 과목 모두 확정</button></div></article>`;
  }).join('');
}

/** 설정 탭에서 넣은 자료 하나를 지금 시험에 적용 → 결과 문구 */
function applyFound(f) {
  if (f.type === 'timetable') {
    const old = S.exams;
    const unmoved = new Set(S.classes.filter(c => !isMoved(c)).map(c => c.id));
    S.classes = f.classes; S.sources = { ...(S.sources || {}), timetable: f.name }; S.exams = {};
    derive();
    // 같은 수업(id)이면 입력해 둔 방식·메모·확정을 이어받고, 옮기지 않았던 시험은 새 기본 시간으로
    let kept = 0;
    for (const c of S.classes) if (old[c.id]) {
      S.exams[c.id] = old[c.id]; kept++;
      if (unmoved.has(c.id)) Object.assign(S.exams[c.id], { date: defaultDate(c), start: defaultStart(c), len: defaultLen(c), room: defaultRoom(c) });
    }
    refreshRoomList();
    return `시간표를 바꿨어요. 수업 ${S.classes.length}개 중 ${kept}개는 입력해 둔 내용을 이어받았어요.`;
  }
  if (f.type === 'calendar') {
    rebaseUnmoved(() => { S.calendar = f.calendar; S.sources = { ...(S.sources || {}), calendar: f.name }; });
    return `수업일 현황을 바꿨어요 (${f.msg}).`;
  }
  if (f.type === 'makeups') {
    const r = parseMakeups(f.text, S.classes, S.calendar, S.year);
    let added = 0;
    rebaseUnmoved(() => {
      S.makeups = S.makeups || [];
      for (const m of r.makeups) if (!S.makeups.some(x => x.id === m.id)) { S.makeups.push(m); added++; }
      const names = new Set(String(S.sources?.makeups || '').split(', ').filter(Boolean)); names.add(f.name);
      S.sources = { ...(S.sources || {}), makeups: [...names].join(', ') };
    });
    return `보강 ${added}건을 추가했어요${r.makeups.length - added ? ` (이미 있던 ${r.makeups.length - added}건 제외)` : ''}.${r.unmatched.length ? ` 짝을 못 찾은 줄 ${r.unmatched.length}개: ${r.unmatched.map(u => u.line.replace(/\t+/g, ' ')).join(' / ')}` : ''}`;
  }
  return '';
}

function bindSetup() {
  const sg = $('#setupGrid');
  sg.addEventListener('change', async e => {
    const el = e.target;
    if (isLocked()) return;
    if (el.id === 'sTitle') { S.title = el.value.trim() || S.title; changed(); }
    else if (el.id === 'sDept') { S.dept = el.value.trim() || S.dept; changed(); }
    else if (el.id === 'sFiles' && el.files.length) {
      const files = [...el.files]; el.value = '';
      ui.pending.busy = `파일 ${files.length}개 읽는 중…`; ui.pending.applyMsg = ''; renderSetup();
      const out = [];
      for (const f of files) { const r = await recognizeFile(f); out.push({ ...r }); }
      ui.pending.files = out; ui.pending.busy = '';
      renderSetup();
    }
  });
  sg.addEventListener('click', e => {
    const id = e.target.id;
    const cancel = e.target.dataset && e.target.dataset.cancel;
    if (cancel) { delete ui.pending[cancel]; if (cancel === 'cal') delete ui.pending.calText; renderSetup(); return; }
    if (isLocked()) return;
    const ap = e.target.closest('[data-apply]');
    if (ap) {
      const f = ui.pending.files[+ap.dataset.apply];
      ui.pending.applyMsg = applyFound(f); f.applied = true;
      changed(); toast(ui.pending.applyMsg.split('.')[0] + '.'); return;
    }
    const dm = e.target.closest('[data-delmk]');
    if (dm) { rebaseUnmoved(() => { S.makeups = (S.makeups || []).filter(m => m.id !== dm.dataset.delmk); }); changed(); toast('보강을 지웠어요.'); return; }
    if (id === 'mkAdd') {
      const c = D.byId[$('#mkClass').value], from = $('#mkFrom').value, to = $('#mkTo').value;
      const s = +$('#mkStart').value, en = +$('#mkEnd').value;
      if (!c || !to) { toast('수업과 보강일을 골라 주세요.'); return; }
      if (en < s) { toast('교시 범위를 확인해 주세요.'); return; }
      const m = { id: `${c.id}|${from}|${to}|${s}`, classId: c.id, from, to, start: s, end: en, room: cleanRoom($('#mkRoom').value) || c.room, note: '직접 입력' };
      rebaseUnmoved(() => { S.makeups = (S.makeups || []).filter(x => x.id !== m.id).concat([m]); });
      changed(); toast(`${c.course}(${groupOf(c)}) 보강을 추가했어요.`); return;
    }
    if (id === 'btnWeek') { const w = +$('#sWeek').value; if (w !== S.examWeek) { ui.pending.week = w; renderSetup(); } return; }
    if (id === 'btnWeekYes') { S.examWeek = ui.pending.week; S.exams = {}; S.extraDates = []; delete S.range; delete ui.pending.week; derive(); changed(); toast(`${S.examWeek}주차 기준으로 다시 배치했어요.`); return; }
    if (id === 'btnCal') { ui.pending.calText = $('#sCal').value; ui.pending.cal = parseCalendarText(ui.pending.calText); ui.pending.calYear = +$('#sYear').value || S.year; renderSetup(); return; }
    if (id === 'btnCalYes') {
      const cal = ui.pending.cal.data, yr = ui.pending.calYear || S.year;
      delete ui.pending.cal; delete ui.pending.calText;
      rebaseUnmoved(() => { S.calendar = cal; S.year = yr; });
      for (const c of S.classes) { const ex = S.exams[c.id]; if (!D.dateMap[ex.date] && !(D.makeups || []).some(m => m.to === ex.date)) ex.date = defaultDate(c); }
      changed(); toast('수업일 현황을 바꿨어요.'); return;
    }
    if (id === 'btnReset') { ui.pending.reset = true; renderSetup(); return; }
    if (id === 'btnResetYes') { delete ui.pending.reset; S.exams = {}; S.extraDates = []; delete S.range; derive(); changed(); toast('처음 상태로 되돌렸어요.'); return; }
  });
}

/* ===== src/js/view-history.js ===== */
/* ---------- 학기별 기록 탭: 모든 시험(학기 × 중간/기말) 목록, 보관(잠금), 삭제, 전체 백업 ---------- */
function renderHistory() {
  const plans = sortedPlans();
  const h = ui.hist;
  const byTerm = new Map();
  for (const p of plans) { const k = `${p.termYear}학년도 ${p.term}학기`; if (!byTerm.has(k)) byTerm.set(k, []); byTerm.get(k).push(p); }
  const card = p => {
    const k = countsOfPlan(p);
    const cur = p.id === S.id;
    const groups = new Set(p.classes.map(groupOf)).size;
    const src = p.sources || {};
    return `<article class="plancard${cur ? ' cur' : ''}" data-plan="${esc(p.id)}">
      <h3>${esc(KINDS[p.kind]?.label || p.title)} <small class="hint">${p.examWeek}주차</small>${p.locked ? '<span class="pill na">🔒 보관됨</span>' : ''}${cur ? '<span class="pill ok">지금 보는 중</span>' : ''}</h3>
      <div class="meta">${esc(p.title)} · 수업 ${p.classes.length}개 · ${groups}개 반</div>
      <div class="st">${k.bad ? `<span class="pill bad">겹침 ${k.bad}</span>` : '<span class="pill ok">겹침 0</span>'}<span class="pill ${k.done === k.all ? 'ok' : 'na'}">확정 ${k.done}/${k.all}</span>${k.moved ? `<span class="pill mv">변경 ${k.moved}</span>` : ''}${k.und ? `<span class="pill warn">방식 미정 ${k.und}</span>` : ''}</div>
      <div class="meta">마지막 수정 ${esc(fmtStamp(p.updatedAt))}${src.timetable || src.calendar ? `<br>자료: ${esc([src.timetable, src.calendar].filter(Boolean).join(', '))}` : ''}</div>
      <div class="row">
        ${cur ? '' : `<button type="button" class="btn small primary" data-act="open">열기</button>`}
        <button type="button" class="btn small" data-act="lock">${p.locked ? '보관 해제' : '보관(잠금)'}</button>
        <button type="button" class="btn small" data-act="backup">이 시험 백업</button>
        <button type="button" class="btn small danger" data-act="del"${plans.length <= 1 ? ' disabled title="마지막 시험은 지울 수 없어요"' : ''}>삭제</button>
      </div>
      ${h.del === p.id ? `<div class="result bad">'${esc(p.title)}'을(를) 지울까요? 되돌릴 수 없어요. 먼저 백업을 받아 두세요.
        <div class="row" style="margin-top:6px"><button type="button" class="btn small danger" data-act="delYes">지우기</button><button type="button" class="btn small" data-act="delNo">취소</button></div></div>` : ''}
    </article>`;
  };
  $('#historyBox').innerHTML = `
    <div class="histhead">
      <p class="hint">학기마다 중간고사·기말고사를 따로 만들어 두고 언제든 다시 열어 볼 수 있어요. 끝난 시험은 '보관(잠금)'하면 실수로 고쳐지지 않아요.</p>
      <div class="row">
        <button type="button" class="btn primary" data-act="new">+ 새 시험 만들기</button>

        <label class="btn small" for="hRestore">백업 불러오기</label><input type="file" id="hRestore" accept=".json,application/json" hidden>
      </div>
