<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 시간표 편성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 행정용 작업 도구. 상단 요약 → 탭(날짜별 배치 / 과목 목록 / 교수님 확인 / 설정) → 오른쪽 편집 서랍.
   학년 색(1 노랑, 2 파랑, 3 초록)은 학과 강의시간표 관례를 그대로 따른다. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2333; --muted:#5b6474; --line:#d9dde5; --accent:#1f3a68; --accent-ink:#ffffff;
  --y1:#fff4cf; --y1s:#f2c94c; --y2:#e1ecfb; --y2s:#5f8fdc; --y3:#e2f2dc; --y3s:#5ea64f;
  --bad:#c42b2b; --bad-bg:#fde7e7; --warn:#9a5b00; --warn-bg:#fff0d6; --ok:#257346; --ok-bg:#e0f3e8;
  --fixed:#e9ebf0; --fixed-ink:#6b7280; --lunch:#f7f7f9;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
    --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
    --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
    --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
  --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
  --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
  --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:22px 0 14px}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px;font-weight:500}
h1{font-size:24px;font-weight:700;letter-spacing:-0.01em}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.savepill{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savepill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.savepill.cloud::before{background:var(--ok)}
.savepill.saving::before,.savepill.loading::before{background:var(--warn)}
.savepill.error::before{background:var(--bad)}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 14px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-size:15px}
button.chip:hover{border-color:var(--accent)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.bad b{color:var(--bad)}
.chip.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip.ok b{color:var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px 0 80px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* board */
.boardbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.sw.y1{background:var(--y1);border-color:var(--y1s)} .sw.y2{background:var(--y2);border-color:var(--y2s)} .sw.y3{background:var(--y3);border-color:var(--y3s)}
.sw.fx{background:repeating-linear-gradient(135deg,var(--fixed) 0 4px,transparent 4px 7px)}
.sw.bd{background:var(--bad-bg);border:2px solid var(--bad)}
.board{display:flex;flex-direction:column;gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.dayhead h3{font-size:17px}
.dayhead .dow{font-weight:500;color:var(--muted);margin-left:2px}
.tag{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--fixed);color:var(--muted)}
.tag.alt{background:var(--warn-bg);color:var(--warn)}
.tag.free{background:var(--ok-bg);color:var(--ok)}
.dayhead .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.scroller{overflow-x:auto}
.grid{min-width:940px}
.ghead,.grow{display:grid;grid-template-columns:52px 1fr}
.ghead .periods,.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.55fr) repeat(5,minmax(0,1fr))}
.ghead{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ghead .periods div{padding:4px 0;text-align:center;border-left:1px solid var(--line);line-height:1.3}
.ghead .periods b{display:block;color:var(--ink);font-size:12.5px}
.glabel{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border-right:1px solid var(--line);position:relative}
.glabel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.glabel.y1::before{background:var(--y1s)} .glabel.y2::before{background:var(--y2s)} .glabel.y3::before{background:var(--y3s)}
.grow{border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow.yb{border-top:2px solid var(--line)}
.track{position:relative;grid-auto-rows:minmax(42px,auto);padding:3px 0}
.cell{grid-row:1/-1;border-left:1px solid var(--line);margin:-3px 0}
.cell.lunch{background:var(--lunch)}
.cell.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.cell.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.blk{margin:2px 3px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;min-width:0;text-align:left;border:1px solid transparent;position:relative;z-index:1;overflow:hidden}
.blk .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.blk.fixed{background:repeating-linear-gradient(135deg,var(--fixed) 0 6px,transparent 6px 10px);border-color:var(--line);color:var(--fixed-ink)}
.blk.fixed .t{font-weight:500}
.blk.exam{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.blk.exam.y1{background:var(--y1);border-color:var(--y1s)} .blk.exam.y2{background:var(--y2);border-color:var(--y2s)} .blk.exam.y3{background:var(--y3);border-color:var(--y3s)}
.blk.exam:hover{filter:brightness(.97)}
.blk.exam.bad{border:2px solid var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.blk .badge{position:absolute;top:3px;right:4px;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px}
.badge.b-bad{background:var(--bad);color:#fff}
.badge.b-mv{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.badge.b-ok{background:var(--ok);color:#fff}
.blk.has-badge .t{padding-right:30px}
body.dragging,body.dragging *{cursor:grabbing !important}
body.dragging .blk{pointer-events:none}
.blk.src{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:6px;padding:5px 8px;max-width:320px;line-height:1.4}
.adddate{display:flex;gap:6px;align-items:center;font-size:13px}
select,input[type="text"],input[type="number"],textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
textarea{width:100%;resize:vertical}

/* list */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:12px}
.listtable select,.listtable input[type="text"]{padding:3px 6px;font-size:13px}
.listtable .note{min-width:160px;width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.st{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mv{border:1px solid var(--warn);color:var(--warn)} .pill.na{background:var(--fixed);color:var(--muted)}
tr.rbad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.gtag{font-weight:700}

/* profs */
.profgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-size:12.5px;color:var(--muted);font-weight:500}
.msg{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;max-height:240px;overflow:auto;font-family:var(--font-body)}

/* settings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card h2{font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field span{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result{font-size:13px;border-radius:7px;padding:8px 10px;background:var(--bg)}
.result.bad{background:var(--bad-bg);color:var(--bad)} .result.ok{background:var(--ok-bg);color:var(--ok)}
ul.plain{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.dhead h2{font-size:18px}
.dhead .btn{white-space:nowrap;flex-shrink:0}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dbody{padding:14px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid select,.fgrid input{width:100%}
.fgrid input[type="checkbox"]{width:auto;margin:0 6px 0 0}
.chk{display:flex;align-items:center;color:var(--ink) !important;min-height:30px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks .it{border-radius:7px;padding:7px 9px}
.checks .it.bad{background:var(--bad-bg);color:var(--bad)} .checks .it.warn{background:var(--warn-bg);color:var(--warn)} .checks .it.ok{background:var(--ok-bg);color:var(--ok)}
.slots{display:flex;flex-direction:column;gap:8px}
.slotday{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:start;font-size:13px}
.slotday .lbl{color:var(--muted);padding-top:3px}
.slotday .lbl b{color:var(--ink)}
.slotday .opts{display:flex;flex-wrap:wrap;gap:4px}
.slotbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 7px;font-size:12.5px}
.slotbtn:hover{border-color:var(--ok);background:var(--ok-bg)}
.slotbtn.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dsec h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:640px){
  .wrap{padding:0 16px}
  h1{font-size:20px}
  .setgrid,.profgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }

/* plan picker · lock banner */
.planpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.planpick select{min-width:240px;max-width:100%}
.lockbanner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:9px 13px;margin-bottom:12px;font-size:13.5px}
.lockbanner[hidden]{display:none}
body.locked .blk.exam{cursor:pointer}

/* history */
.histhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.term{margin-bottom:16px}
.term h2{font-size:16px;margin:0 0 8px}
.plancards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.plancard.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plancard h3{font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plancard .meta{font-size:12.5px;color:var(--muted)}
.plancard .row{gap:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

/* modal (새 시험 만들기) */
.modal{position:fixed;inset:0;z-index:45;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox .dhead{border-radius:12px 12px 0 0}
.mbox .dbody{overflow:visible}
.step{border:1px solid var(--line);border-radius:9px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.step h3{font-size:14px;margin:0;display:flex;gap:8px;align-items:center}
.step h3 .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;align-items:center;justify-content:center}
.radios{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px}
.radios label{display:flex;gap:6px;align-items:center}
.calprev{overflow-x:auto}
.calprev table{font-size:12px;min-width:480px}
.calprev th,.calprev td{padding:3px 6px;text-align:center}
.calprev tr.ex td{background:var(--y2);font-weight:600}
.calprev td.alt{color:var(--warn);font-weight:700}
.miniscroll{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:7px}
.miniscroll table{font-size:12px}
.miniscroll td,.miniscroll th{padding:3px 7px}
@media (max-width:640px){ .plancards{grid-template-columns:1fr} .planpick select{min-width:0;width:100%} }
.savepill.gh-saved::before{background:var(--ok)}
.savepill.gh-loading::before,.savepill.gh-saving::before,.savepill.gh-pending::before{background:var(--warn)}
.savepill.gh-error::before{background:var(--bad)}
.savepill.gh-error{color:var(--bad)}
#ghCard code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
#ghCard details ol{margin-top:6px}
a.btn{text-decoration:none;color:inherit;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="deptLabel"></p>
      <h1 id="titleLabel"></h1>
      <div class="planpick">
        <label for="planSel">시험 선택</label>
        <select id="planSel"></select>
        <button type="button" class="btn small" id="btnNewPlan">+ 새 시험 만들기</button>
      </div>
    </div>
    <div class="actions">
      <span id="saveState" class="savepill" role="status"></span>
      <button type="button" class="btn" id="btnRegister">시험 일정 등록</button>
      <button type="button" class="btn primary" id="btnExport">엑셀로 내보내기</button>
    </div>
  </header>
  <div id="lockBanner" class="lockbanner" hidden></div>
  <section class="summary" id="summary" aria-label="요약"></section>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button type="button" role="tab" id="tab-btn-board" data-tab="board" aria-selected="true">날짜별 배치</button>
    <button type="button" role="tab" id="tab-btn-courses" data-tab="courses" aria-selected="false">과목 목록</button>
    <button type="button" role="tab" id="tab-btn-professors" data-tab="professors" aria-selected="false">교수님 확인</button>
    <button type="button" role="tab" id="tab-btn-history" data-tab="history" aria-selected="false">학기별 기록</button>
    <button type="button" role="tab" id="tab-btn-setup" data-tab="setup" aria-selected="false">설정</button>
  </nav>
  <main>
    <section id="tab-board" class="tabpanel" role="tabpanel">
      <div class="boardbar">
        <p class="hint">시험 블록을 끌어서 다른 시간·날짜로 옮기면 같은 반 수업, 교수님 일정, 강의실 겹침을 바로 확인해요. 블록을 누르면 방식·시간을 입력할 수 있어요.</p>

      </div>

/* ---------- 수업일 현황 → 날짜 계산 ----------

function tokToIso(tok, year = S.year, firstMonth = D.firstMonth) {

/* 어떤 날짜에 시간을 차지하는 것 전부.

  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (!libP[url]) libP[url] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => window[globalName] ? res(window[globalName]) : rej(new Error(failMsg));
    s.onerror = () => { delete libP[url]; rej(new Error(failMsg + ' 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);

/**

  const tokRe = /\d{1,2}\s*\/\s*\d{1,2}(?:\s*\(\s*[월화수목금토일]\s*\))?/g;

/** PDF 글자 조각(pdf.js textContent.items) → 줄 텍스트. 같은 높이(y)끼리 묶고 왼쪽부터 잇는다. */

        const t = txt(cell); if (!t) continue;

        while (k + span < np) { const nx = ws.getCell(r, hdr.c + 3 + k + span); if (nx.isMerged && nx.master && nx.master.address === cell.address) span++; else break; }
        const m = t.match(/^(.+?)\s*\(([^)]+)\)\s*-?\s*(.*)$/);
        out.push({ day, year, ban: ban.toUpperCase(), start: k + 1, end: k + span, course: (m ? m[1] : t).trim(), prof: m ? m[2].trim() : '', room: (m ? m[3] : '').replace(/호/g, '').replace(/\s+/g, '') });
        k += span - 1;
      }
    }
    if (out.length) return { sheet: ws.name, classes: assignIds(out) };
  }
  throw new Error('강의시간표 형식을 찾지 못했어요. "요일·학년·반·교시" 머리글이 있는 시트인지 확인해 주세요.');
}

/* ===== src/js/store.js ===== */
/* ---------- 저장 ----------
   - 기본: 이 브라우저 localStorage('exam-planner:v2'). 예전 v1 데이터('exam-planner:v1')는 처음 열 때 계획 하나로 옮긴다(원본은 그대로 둠).
   - claude.ai 아티팩트로 열면 window.claude.use('db')의 'plans/{planId}' 문서에 계획별로 저장한다.
     삭제는 {deleted:true} 표시만 남겨 다른 사람 화면에서도 지워지게 한다. 지금 보는 계획(currentId)은 브라우저마다 따로. */
const LS_KEY = 'exam-planner:v2';
const LS_KEY_V1 = 'exam-planner:v1';
const TAB_ID = Math.random().toString(36).slice(2, 10);

/** 이 브라우저에 저장. silent가 아니면 GitHub 저장도 예약(github.js) */
function persistLocal({ silent = false } = {}) {
  let ok = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(Store)); } catch { ok = false; }
  if (!silent && typeof ghQueue === 'function') ghQueue();
  return ok;
}
function loadLocal() {
  try { const t = localStorage.getItem(LS_KEY); if (t) { const st = toStore(JSON.parse(t)); if (st && Object.keys(st.plans).length) return st; } } catch {}
  try { const t = localStorage.getItem(LS_KEY_V1); if (t) return toStore(JSON.parse(t)); } catch {}
  return null;
}

const cloud = { col: null, loaded: false, mode: 'local', queue: {}, writing: {}, timer: {} };
function setSave(mode, detail) {
  if (mode) cloud.mode = mode;
  const el = $('#saveState');
  const map = { local: '이 브라우저에만 저장돼요', loading: '저장된 내용 불러오는 중', saving: '저장 중', cloud: '저장됨', offline: '저장소 연결 대기 중 · 이 브라우저에 보관', error: '저장소에 저장하지 못했어요 · 이 브라우저에 보관',
    'gh-loading': 'GitHub에서 불러오는 중', 'gh-pending': 'GitHub에 저장 대기', 'gh-saving': 'GitHub에 저장 중', 'gh-saved': 'GitHub에 저장됨',
    'gh-readonly': 'GitHub에서 불러옴 · 보기 전용', 'gh-error': 'GitHub 저장 실패 · 이 브라우저에 보관' };
  el.textContent = map[cloud.mode] || '';
  el.className = 'savepill ' + cloud.mode;
  el.title = detail ? String(detail) : '';
}
/** 계획 p가 바뀌었다고 알림 → 로컬 저장 + (있으면) 클라우드 예약 */
function touchPlan(p) {
  p.rev = (p.rev || 0) + 1; p.updatedAt = Date.now(); p.writer = TAB_ID;
  persistLocal();
  queueCloud(p.id);
}
function queueCloud(id) {
  if (!cloud.col) return;
  cloud.queue[id] = true; setSave('saving');
  clearTimeout(cloud.timer[id]); cloud.timer[id] = setTimeout(() => flushCloud(id), 700);
}
async function flushCloud(id) {
  if (!cloud.col || cloud.writing[id] || !cloud.queue[id]) return;
  cloud.writing[id] = true; delete cloud.queue[id];
  const p = Store.plans[id];
  try {
    const body = p ? { payload: JSON.stringify(p), rev: p.rev || 0, updatedAt: p.updatedAt || 0, writer: TAB_ID }
      : { deleted: true, updatedAt: Date.now(), writer: TAB_ID };
    await cloud.col.doc(id).set(body);
    if (!Object.keys(cloud.queue).length) setSave('cloud');
  } catch (err) {
    if (err && err.code === 'unavailable') { cloud.queue[id] = true; setTimeout(() => flushCloud(id), 1500 + Math.random() * 1500); }
    else setSave('error', err && (err.message || err.code));
  } finally {
    cloud.writing[id] = false;
    if (cloud.queue[id] && cloud.mode !== 'error') { clearTimeout(cloud.timer[id]); cloud.timer[id] = setTimeout(() => flushCloud(id), 400); }
  }
}
/** 클라우드에서 온 문서 하나를 반영. 바뀐 게 있으면 true */
function applyRemote(id, d) {
  const local = Store.plans[id];
  if (d.deleted) {
    if (local && (local.updatedAt || 0) <= (d.updatedAt || 0)) { delete Store.plans[id]; return true; }
    return false;
  }
  if (d.writer === TAB_ID || (local && (local.updatedAt || 0) >= (d.updatedAt || 0))) return false;
  try { const p = JSON.parse(d.payload); if (!validPlan(p)) return false; Store.plans[id] = upgradePlan(p); return true; } catch { return false; }
}
async function initCloud() {
  if (!(window.claude && typeof window.claude.use === 'function')) { setSave('local'); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch { db = null; }
  if (!db) { setSave('local'); return; }
  try { cloud.col = db.collection('plans'); } catch { setSave('local'); return; }
  setSave('loading');
  const timer = setTimeout(() => { if (!cloud.loaded) setSave('offline'); }, 10000);
  cloud.col.onSnapshot(async snap => {
    const definitive = !snap.metadata.fromCache;
    let dirty = false;
    const seen = new Set();
    for (const doc of snap.docs) { seen.add(doc.id); if (applyRemote(doc.id, doc.data() || {})) dirty = true; }
    if (definitive && !cloud.loaded) {
      cloud.loaded = true; clearTimeout(timer);
      if (snap.empty) await importLegacyCloud(db);
      // 이 브라우저에만 있거나 더 최신인 계획은 올린다
      for (const p of Object.values(Store.plans)) {
        const d = snap.docs.find(x => x.id === p.id)?.data();
        if (!seen.has(p.id) || (d && !d.deleted && (p.updatedAt || 0) > (d.updatedAt || 0))) queueCloud(p.id);
      }
      if (!Object.keys(cloud.queue).length && cloud.mode !== 'error') setSave('cloud');
    }
    if (dirty) { persistLocal(); afterStoreChanged(); }
  }, err => { clearTimeout(timer); cloud.col = null; setSave('error', err && (err.message || err.code)); });
}
/** 예전 버전이 'planner/state' 한 문서에 저장했던 내용이 있으면 계획으로 가져온다 */
async function importLegacyCloud(db) {
  try {
    const snap = await db.doc('planner/state').get();
    if (!snap.exists) return;
    const s = JSON.parse(snap.data().payload);
    if (!validPlan(s)) return;
    const p = upgradePlan(s);
    const local = Store.plans[p.id];
    if (!local || (local.updatedAt || 0) < (s.updatedAt || 0)) { Store.plans[p.id] = p; persistLocal(); afterStoreChanged(); }
  } catch {}
}
/** 저장소가 바깥(클라우드)에서 바뀐 뒤: 보고 있던 계획을 다시 잡고 화면 갱신 */
function afterStoreChanged() {
  if (!Object.keys(Store.plans).length && S) Store.plans[S.id] = S;   // 마지막 계획까지 지워지면 보던 것을 남긴다
  if (!Store.plans[Store.currentId]) Store.currentId = latestPlanId(Store);
  usePlan(Store.plans[Store.currentId]);
  if (typeof render === 'function') { render(); if (ui.drawerId && D.byId[ui.drawerId]) openDrawer(ui.drawerId); }
}

/* ===== src/js/github.js ===== */
/* ---------- GitHub 저장 ----------
   정적 페이지(GitHub Pages)가 GitHub API로 저장소 파일을 직접 읽고 쓴다.
   - 위치: 저장소의 'data' 브랜치 / data/plans.json (코드가 있는 main과 분리 → 저장해도 사이트 재배포·코드 기록에 영향 없음)
   - 토큰(fine-grained, 이 저장소 Contents 읽기·쓰기)이 있으면 바뀐 뒤 몇 초 뒤 자동 커밋, 없으면 불러와서 보기만.
   - 다른 컴퓨터가 먼저 저장했으면(409) 다시 불러와 mergeStores()로 합친 뒤 저장.
   - 토큰은 이 브라우저 localStorage에만 둔다. */
const GH_KEY = 'exam-planner:github';
const GH_API = 'https://api.github.com';
const GH_SAVE_DELAY = 4000;
const gh = { cfg: null, sha: null, lastText: null, timer: null, busy: false, again: false, dirty: false, mode: 'off', error: '', repoInfo: null, savedAt: 0, loadedAt: 0 };

/** GitHub Pages 주소(<owner>.github.io/<repo>/)에서 저장소를 짐작 */
function ghGuessRepo(loc = location) {
  const h = loc.hostname || '';
  if (!h.endsWith('.github.io')) return '';
  const owner = h.split('.')[0];
  const seg = (loc.pathname || '').split('/').filter(Boolean)[0];
  return `${owner}/${seg && !seg.includes('.') ? seg : h}`;
}
function ghLoadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem(GH_KEY) || '{}') || {}; } catch {}
  gh.cfg = { repo: c.repo || ghGuessRepo(), branch: c.branch || 'data', path: c.path || 'data/plans.json', token: c.token || '' };
}
function ghStoreCfg() { try { localStorage.setItem(GH_KEY, JSON.stringify(gh.cfg)); } catch {} }
const ghOn = () => !!(gh.cfg && /^[\w.-]+\/[\w.-]+$/.test(gh.cfg.repo));
const ghCanWrite = () => ghOn() && !!gh.cfg.token;

function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function ghApi(method, path, body, accept) {
  const headers = { Accept: accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (gh.cfg.token) headers.Authorization = 'Bearer ' + gh.cfg.token;
  if (body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(`${GH_API}/repos/${gh.cfg.repo}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch { throw new GhError(0, 'GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  return r;
}
async function ghFail(r, what) {
  let detail = '';
  try { detail = (await r.json()).message || ''; } catch {}
  const s = r.status;
  const msg = s === 401 ? '토큰이 틀렸거나 만료됐어요. 새 토큰을 넣어 주세요.'
    : s === 403 && /rate limit/i.test(detail) ? 'GitHub 요청 한도를 넘었어요. 토큰을 넣으면 한도가 늘어나요. 잠시 후 다시 해 주세요.'
    : s === 403 ? '이 토큰에 저장소 쓰기 권한이 없어요. 토큰의 Repository permissions에서 Contents를 Read and write로 해 주세요.'
    : s === 404 ? `${what}을(를) 찾지 못했어요. 저장소 이름을 확인해 주세요. 비공개 저장소라면 토큰이 필요해요.`
    : `${what} 실패 (${s}) ${detail}`;
  return new GhError(s, msg);
}

/** 저장소 정보(공개 여부·기본 브랜치) */
async function ghRepoInfo() {
  const r = await ghApi('GET', '');
  if (!r.ok) throw await ghFail(r, '저장소');
  const j = await r.json();
  gh.repoInfo = { private: !!j.private, defaultBranch: j.default_branch || 'main', canPush: !!(j.permissions && j.permissions.push), url: j.html_url };
  return gh.repoInfo;
}
/** 저장 브랜치가 없으면 기본 브랜치에서 만든다 */
async function ghEnsureBranch() {
  const b = encodeURIComponent(gh.cfg.branch);
  const r = await ghApi('GET', `/git/ref/heads/${b}`);
  if (r.ok) return;
  if (r.status !== 404) throw await ghFail(r, '브랜치');
  const info = gh.repoInfo || await ghRepoInfo();
  const base = await ghApi('GET', `/git/ref/heads/${encodeURIComponent(info.defaultBranch)}`);
  if (!base.ok) throw await ghFail(base, '기본 브랜치');
  const sha = (await base.json()).object.sha;
  const c = await ghApi('POST', '/git/refs', { ref: `refs/heads/${gh.cfg.branch}`, sha });
  if (!c.ok && c.status !== 422) throw await ghFail(c, '브랜치 만들기');
}
/** GitHub의 data/plans.json → { store|null, sha|null } (파일·브랜치가 아직 없으면 store null) */
async function ghRead() {
  const path = `/contents/${gh.cfg.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(gh.cfg.branch)}`;
  const r = await ghApi('GET', path);
  if (r.status === 404) {
    if (!gh.repoInfo) await ghRepoInfo();   // 저장소 자체가 없으면 여기서 오류
    return { store: null, sha: null };
  }
  if (!r.ok) throw await ghFail(r, '저장 파일');
  const j = await r.json();
  let text;
  if (j.encoding === 'base64' && j.content) text = b64DecodeUtf8(j.content);
  else {   // 1MB가 넘으면 content가 비어 온다 → 원본으로 다시 받기
    const raw = await ghApi('GET', path, null, 'application/vnd.github.raw+json');
    if (!raw.ok) throw await ghFail(raw, '저장 파일');
    text = await raw.text();
  }
  const store = toStore(JSON.parse(text));
  if (!store) throw new GhError(0, `GitHub의 ${gh.cfg.path}가 이 도구의 저장 형식이 아니에요.`);
  return { store, sha: j.sha, text };
}
async function ghWrite(text, message) {
  const body = { message, content: b64EncodeUtf8(text), branch: gh.cfg.branch };
  if (gh.sha) body.sha = gh.sha;
  const r = await ghApi('PUT', `/contents/${gh.cfg.path.split('/').map(encodeURIComponent).join('/')}`, body);
  if (r.status === 409 || (r.status === 422 && !gh.sha)) return false;   // 다른 곳에서 먼저 저장함
  if (!r.ok) throw await ghFail(r, '저장');
  gh.sha = (await r.json()).content.sha;
  return true;
}
const ghPayloadText = () => JSON.stringify(storePayload(Store), null, 1) + '\n';

/** GitHub 내용과 이 브라우저 내용을 합친다. 이 브라우저 쪽이 바뀌면 화면을 다시 그린다. → GitHub에 올릴 게 있는지 */
function ghMergeIn(remote) {
  if (!remote.store) return true;
  const m = mergeStores(Store, remote.store);
  if (m.localChanged) {
    Store.plans = m.plans; Store.deleted = m.deleted;
    persistLocal({ silent: true });
    afterStoreChanged();
  }
  return m.remoteChanged;
}
function ghSetMode(mode, error = '') {
  gh.mode = mode; gh.error = error;
  if (cloud.col) return;   // claude.ai 저장소를 쓰는 중이면 그쪽 표시 유지
  setSave(mode, error);
  if (ui.tab === 'history' && typeof renderGitHubCard === 'function') renderGitHubCard();
}
function commitMessage() {
  const p = S && Store.plans[S.id];
  return p ? `시험 데이터 저장: ${p.title}` : '시험 데이터 저장';
}

/** 불러오기 + 합치기 + (쓸 수 있고 바뀐 게 있으면) 저장. 한 번에 하나만 돈다. */
async function ghSync({ push = true, fresh = false } = {}) {
  if (!ghOn()) return;
  if (gh.busy) { gh.again = true; gh.againFresh = gh.againFresh || fresh; return; }
  gh.busy = true; gh.dirty = false;
  try {
    ghSetMode(gh.loadedAt ? 'gh-saving' : 'gh-loading');
    if (!gh.repoInfo) await ghRepoInfo().catch(e => { if (e.status !== 403) throw e; });
    for (let attempt = 0; attempt < 3; attempt++) {
      if (fresh || !gh.loadedAt || attempt > 0 || !gh.sha) {
        const remote = await ghRead();
        gh.sha = remote.sha; gh.lastText = remote.text ?? null; gh.loadedAt = Date.now();
        ghMergeIn(remote);
      }
      if (!push || !ghCanWrite()) break;
      const text = ghPayloadText();
      if (text === gh.lastText) break;          // 바뀐 게 없음
      if (!gh.sha) await ghEnsureBranch();
      if (await ghWrite(text, commitMessage())) { gh.lastText = text; gh.savedAt = Date.now(); break; }
      if (attempt === 2) throw new GhError(409, '다른 곳에서 계속 저장하고 있어서 저장하지 못했어요. 잠시 후 다시 해 주세요.');
    }
    ghSetMode(ghCanWrite() ? 'gh-saved' : 'gh-readonly');
  } catch (err) {
    gh.dirty = true;
    ghSetMode('gh-error', err.message || String(err));
  } finally {
    gh.busy = false;
    if (gh.again) { const f = gh.againFresh; gh.again = gh.againFresh = false; ghSync({ push, fresh: f }); }
  }
}
/** 이 브라우저 저장소가 바뀔 때마다 부른다 (persistLocal). 잠시 모았다가 한 번에 커밋. */
function ghQueue() {
  if (!ghCanWrite() || !gh.loadedAt) return;
  if (ghPayloadText() === gh.lastText) return;
  gh.dirty = true;
  ghSetMode('gh-pending');
  clearTimeout(gh.timer);
  gh.timer = setTimeout(() => ghSync(), GH_SAVE_DELAY);
}
function ghSaveNow() { clearTimeout(gh.timer); return ghSync(); }
function initGitHub() {
  ghLoadCfg();
  window.addEventListener('beforeunload', e => { if (gh.dirty || gh.busy) { ghSaveNow(); e.preventDefault(); e.returnValue = ''; } });
  // 다른 컴퓨터에서 저장한 내용: 이 창으로 돌아올 때 다시 불러온다 (30초에 한 번까지)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ghOn() && gh.loadedAt && Date.now() - gh.loadedAt > 30000) ghSync({ fresh: true });
  });
  if (ghOn()) ghSync();
}

/* ---------- 학기별 기록 탭의 'GitHub 저장' 카드 ---------- */
function ghStatusText() {
  const m = gh.mode;
  if (!ghOn()) return { cls: '', text: '연결 안 됨 · 이 브라우저에만 저장돼요' };
  if (m === 'gh-error') return { cls: 'bad', text: gh.error };
  if (m === 'gh-loading') return { cls: '', text: 'GitHub에서 불러오는 중…' };
  if (m === 'gh-saving' || m === 'gh-pending') return { cls: '', text: '저장 중…' };
  if (!ghCanWrite()) return { cls: '', text: `GitHub에서 불러왔어요 (${fmtStamp(gh.loadedAt)}). 토큰이 없어서 보기만 할 수 있어요. 고친 내용은 이 브라우저에만 남아요.` };
  return { cls: 'ok', text: gh.savedAt ? `GitHub에 저장했어요 (${fmtStamp(gh.savedAt)})` : `GitHub와 같아요 (${fmtStamp(gh.loadedAt)} 확인)` };
}
function renderGitHubCard() {
  const box = $('#ghCard'); if (!box) return;
  const c = gh.cfg, st = ghStatusText(), info = gh.repoInfo;
  const fileUrl = ghOn() ? `https://github.com/${c.repo}/commits/${encodeURIComponent(c.branch)}/${c.path}` : '';
  box.innerHTML = `<h2>GitHub에 저장</h2>
    <p class="hint">저장소의 <b>${esc(c.branch)}</b> 브랜치 <code>${esc(c.path)}</code> 파일에 모든 시험을 저장해요. 어느 컴퓨터에서 열어도 같은 내용을 불러오고, 저장할 때마다 커밋 기록이 남아요.</p>
    <div class="row">
      <label class="field" for="ghRepo"><span>저장소 (아이디/저장소)</span><input type="text" id="ghRepo" value="${esc(c.repo)}" placeholder="torgeleli22-lang/ExamScheduleCreate" size="32"></label>
      <label class="field" for="ghToken"><span>토큰 ${c.token ? '(저장됨)' : '(저장하려면 필요)'}</span><input type="password" id="ghToken" value="" placeholder="${c.token ? '••••••••  바꾸려면 새로 입력' : 'github_pat_…'}" size="30" autocomplete="off"></label>

let dlP = null;
function getDownloads() {

async function saveFile(filename, data) {
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  if (!inClaude) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('파일을 저장했어요.'); return true;
    } catch { toast('파일을 저장하지 못했어요.'); return false; }
  }
  const dl = await getDownloads();
  if (!dl) { toast('이 화면에서는 파일 저장을 쓸 수 없어요. claude.ai에서 이 페이지를 열어 다시 눌러 주세요.'); return false; }
  try { await dl.save({ filename, data }); toast('파일을 저장했어요.'); return true; }
  catch (err) {
    const code = err && err.code;
    if (code === 'declined') toast('저장을 취소했어요.');
    else if (code === 'rate_limited') toast('저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.');
    else toast('파일을 저장하지 못했어요. ' + (err && err.message ? err.message : ''));
    return false;
  }
}

        const tip = [`${it.c.course} (${it.c.prof}) ${g}`, `${fmt(ex.date)} ${pRange(ex.start, ex.len)} ${tRange(ex.start, ex.len)} · ${roomLabel(ex.room)} · ${ex.method}`, ...st.bad.map(describeConflict), ...st.warn].join('\n');

      }).join('');
      rows += `<div class="grow${prevYear !== null && prevYear !== year ? ' yb' : ''}"><div class="glabel y${esc(year)}">${esc(g)}</div><div class="track" style="grid-template-rows:repeat(${lanes},minmax(42px,auto))">${cells}${blocks}</div></div>`;
      prevYear = year;
    }
    html.push(`<section class="day" data-day="${d}">
      <div class="dayhead"><h3>${+m}/${+dd}<span class="dow">(${DOW[dowOf(d)]})</span></h3><span class="tag ${lab.cls}">${esc(lab.text)}</span>
      <span class="cnt">시험 ${nExam}과목</span>${removable ? `<button type="button" class="btn small" data-rmdate="${d}">목록에서 빼기</button>` : ''}</div>
      <div class="scroller"><div class="grid">${head}${rows}</div></div></section>`);
  }
  $('#board').innerHTML = html.join('');
  const shown = new Set(dates);
  $('#addDate').innerHTML = `<option value="">날짜 선택</option>` + D.candDates.filter(d => !shown.has(d)).map(d => `<option value="${d}">${fmt(d)} · ${D.dateMap[d].col}${D.dateMap[d].week}주차</option>`).join('');
}
function dateOptions(cur) {
  const list = D.candDates.slice();
  if (cur && !list.includes(cur)) { list.push(cur); list.sort(); }
  return list.map(d => `<option value="${d}"${d === cur ? ' selected' : ''}>${fmt(d)} ${D.dateMap[d] ? `· ${D.dateMap[d].col}${D.dateMap[d].week}` : ''}</option>`).join('');
}
function filteredClasses() {
  const f = ui.filter, q = f.q.trim().toLowerCase();
  const dayIdx = d => DAY_ORDER.indexOf(d);
  return S.classes.filter(c => {
    if (f.group && groupOf(c) !== f.group) return false;
    if (f.prof && c.prof !== f.prof) return false;
    if (q && !`${c.course} ${c.prof} ${c.room} ${S.exams[c.id].room} ${groupOf(c)}`.toLowerCase().includes(q)) return false;
    if (f.status) {
      const st = statusOf(c);
      if (f.status === 'bad' && !st.bad.length) return false;
      if (f.status === 'warn' && !st.warn.length) return false;
      if (f.status === 'moved' && !st.moved) return false;
      if (f.status === 'undecided' && !st.undecided) return false;
      if (f.status === 'open' && st.done) return false;
      if (f.status === 'done' && !st.done) return false;
    }
    return true;
  }).sort((a, b) => groupOf(a).localeCompare(groupOf(b)) || dayIdx(a.day) - dayIdx(b.day) || a.start - b.start);
}
function statusPills(st) {
  const out = [];
  if (st.noslot) out.push('<span class="pill na">시험 없음</span>');
  if (st.bad.length) out.push(`<span class="pill bad" title="${esc(st.bad.map(describeConflict).join('\n'))}">겹침 ${st.bad.length}</span>`);
  if (st.warn.length) out.push(`<span class="pill warn" title="${esc(st.warn.join('\n'))}">확인 ${st.warn.length}</span>`);
  if (st.moved) out.push('<span class="pill mv">변경</span>');
  if (st.done) out.push('<span class="pill ok">확정</span>');
  if (!out.length) out.push('<span class="pill na">기본</span>');
  return `<div class="st">${out.join('')}</div>`;
}
function renderList() {
  const f = ui.filter;
  $('#fGroup').innerHTML = `<option value="">전체</option>` + opts(D.groups, f.group);
  $('#fProf').innerHTML = `<option value="">전체</option>` + opts(D.profs, f.prof);
  $('#fStatus').value = f.status;
  if (document.activeElement !== $('#fQ')) $('#fQ').value = f.q;
  const rows = filteredClasses().map(c => {
    const ex = S.exams[c.id], st = statusOf(c), dis = st.noslot ? ' disabled' : '';

    return `<tr data-id="${id}" class="${st.bad.length ? 'rbad' : ''}">

      <td><button type="button" class="linkbtn" data-open="${id}">${esc(c.course)}</button><span class="sub">${esc(c.prof)}</span></td>

      <td><select aria-label="날짜" data-f="date"${dis}>${dateOptions(ex.date)}</select></td>
      <td><select aria-label="시작 교시" data-f="start"${dis}>${opts(range(1, NP), ex.start, v => `${v}교시`)}</select></td>
      <td><select aria-label="교시 수" data-f="len"${dis}>${opts(range(1, 6), ex.len, v => `${v}교시`)}</select><span class="sub">${st.noslot ? '' : tRange(ex.start, ex.len)}</span></td>
      <td><input type="text" aria-label="강의실" data-f="room" value="${esc(ex.room)}" size="7" list="roomList"${dis}></td>
      <td><input type="text" class="note" aria-label="요청사항" data-f="note" value="${esc(ex.note)}" placeholder="교수님 요청사항"></td>
      <td><input type="checkbox" aria-label="확정" data-f="done"${ex.done ? ' checked' : ''}></td>
    </tr>`;
  }).join('');
  $('#listTable').innerHTML = `<thead><tr><th>상태</th><th>반</th><th>과목 · 교수</th><th>원래 수업</th><th>방식</th><th>시험 날짜</th><th>시작</th><th>길이</th><th>강의실</th><th>요청사항·메모</th><th>확정</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="11" class="hint">조건에 맞는 과목이 없어요.</td></tr>`}</tbody>`;
}
function profMessage(prof) {
  const list = S.classes.filter(c => c.prof === prof).sort((a, b) => (S.exams[a.id].date || '').localeCompare(S.exams[b.id].date || '') || S.exams[a.id].start - S.exams[b.id].start);
  const lines = [`[${S.title} 일정 확인]`, `${prof} 교수님, 안녕하세요. ${S.dept} 사무실입니다.`, '담당 과목 시험 일정을 아래와 같이 정리했습니다.', ''];
  list.forEach((c, i) => {
    const ex = S.exams[c.id];
    if (!hasSlot(ex)) lines.push(`${i + 1}) ${c.course} (${groupOf(c)}): ${ex.method}`);
    else lines.push(`${i + 1}) ${c.course} (${groupOf(c)}): ${fmt(ex.date)} ${pRange(ex.start, ex.len)} ${tRange(ex.start, ex.len)}, ${roomLabel(ex.room)}, ${ex.method === '미정' ? '시험 방식 미정' : ex.method}`);
    if (ex.note) lines.push(`   메모: ${ex.note}`);
  });
  lines.push('', '시험 방식이나 시간을 바꾸셔야 하면 회신 부탁드립니다. 감사합니다.');
  return lines.join('\n');
}
function renderProfs() {
  $('#profGrid').innerHTML = D.profs.map(p => {
    const list = S.classes.filter(c => c.prof === p);
    const done = list.filter(c => S.exams[c.id].done).length;
    const bad = list.filter(c => statusOf(c).bad.length).length;
    return `<article class="card"><h3>${esc(p)} <small>${list.length}과목 · 확정 ${done}${bad ? ` · <span style="color:var(--bad)">겹침 ${bad}</span>` : ''}</small></h3>
      <pre class="msg" id="msg-${esc(p)}">${esc(profMessage(p))}</pre>
      <div class="row"><button type="button" class="btn small" data-copy="${esc(p)}">문구 복사</button>
      <button type="button" class="btn small" data-markdone="${esc(p)}">이 교수님 과목 모두 확정</button></div></article>`;
  }).join('');
}

function bindSetup() {
  const sg = $('#setupGrid');
  sg.addEventListener('change', async e => {
    const el = e.target;
    if (isLocked()) return;
    if (el.id === 'sTitle') { S.title = el.value.trim() || S.title; changed(); }
    else if (el.id === 'sDept') { S.dept = el.value.trim() || S.dept; changed(); }
    else if (el.id === 'sCalPdf' && el.files[0]) {
      const f = el.files[0];
      ui.pending.cal = { msg: 'PDF 읽는 중…' }; renderSetup();
      try { const res = await parseCalendarPdf(await f.arrayBuffer()); ui.pending.calText = res.text; ui.pending.calName = f.name; ui.pending.cal = res; ui.pending.calYear = S.year; }
      catch (err) { ui.pending.cal = { error: true, msg: err.message || 'PDF를 읽지 못했어요.' }; }
      renderSetup();
    } else if (el.id === 'sXlsx' && el.files[0]) {
      const f = el.files[0];
      ui.pending.xlsx = { msg: '읽는 중…' }; renderSetup();
      try { const res = await parseTimetableXlsx(await f.arrayBuffer());
        const g = new Set(res.classes.map(groupOf)).size, pr = new Set(res.classes.map(c => c.prof)).size;
        ui.pending.xlsx = { data: res.classes, name: f.name, msg: `'${res.sheet}' 시트에서 수업 ${res.classes.length}개(${g}개 반, 교수님 ${pr}분)를 읽었어요. 바꾸면 이 시험에 입력한 정보는 지워져요.` };
      } catch (err) { ui.pending.xlsx = { error: true, msg: err.message || '파일을 읽지 못했어요.' }; }
      renderSetup();
    }
  });
  sg.addEventListener('click', e => {
    const id = e.target.id;
    const cancel = e.target.dataset && e.target.dataset.cancel;
    if (cancel) { delete ui.pending[cancel]; if (cancel === 'cal') delete ui.pending.calText; renderSetup(); return; }
    if (isLocked()) return;
    if (id === 'btnWeek') { const w = +$('#sWeek').value; if (w !== S.examWeek) { ui.pending.week = w; renderSetup(); } return; }
    if (id === 'btnWeekYes') { S.examWeek = ui.pending.week; S.exams = {}; S.extraDates = []; delete ui.pending.week; derive(); changed(); toast(`${S.examWeek}주차 기준으로 다시 배치했어요.`); return; }
    if (id === 'btnCal') { ui.pending.calText = $('#sCal').value; ui.pending.cal = parseCalendarText(ui.pending.calText); ui.pending.calYear = +$('#sYear').value || S.year; renderSetup(); return; }
    if (id === 'btnCalYes') {
      S.calendar = ui.pending.cal.data; S.year = ui.pending.calYear || S.year;
      if (ui.pending.calName) S.sources = { ...(S.sources || {}), calendar: ui.pending.calName };
      delete ui.pending.cal; delete ui.pending.calText; delete ui.pending.calName;
      derive();
      for (const c of S.classes) { const ex = S.exams[c.id]; if (!D.dateMap[ex.date]) ex.date = defaultDate(c); }
      changed(); toast('수업일 현황을 바꿨어요.'); return;
    }
    if (id === 'btnXlsxYes') {
      S.classes = ui.pending.xlsx.data; S.sources = { ...(S.sources || {}), timetable: ui.pending.xlsx.name };
      S.exams = {}; S.extraDates = []; delete ui.pending.xlsx; derive(); refreshRoomList(); changed(); toast('새 강의시간표로 바꿨어요.'); return;
    }
    if (id === 'btnReset') { ui.pending.reset = true; renderSetup(); return; }
    if (id === 'btnResetYes') { delete ui.pending.reset; S.exams = {}; S.extraDates = []; derive(); changed(); toast('처음 상태로 되돌렸어요.'); return; }
  });
}

      <div class="meta">마지막 수정 ${esc(fmtStamp(p.updatedAt))}${src.timetable || src.calendar ? `<br>자료: ${esc([src.timetable, src.calendar].filter(Boolean).join(', '))}` : ''}</div>

  $('#historyBox').innerHTML = `
    <div class="histhead">

        <button type="button" class="btn primary" data-act="new">+ 새 시험 만들기</button>
        <button type="button" class="btn small" data-act="backupAll">전체 백업 저장 (.json)</button>
        <label class="btn small" for="hRestore">백업 불러오기</label><input type="file" id="hRestore" accept=".json,application/json" hidden>
      </div>
    </div>
    <article class="card" id="ghCard" style="margin-bottom:16px"></article>
    ${h.restore ? `<div class="result ${h.restore.error ? 'bad' : ''}" style="margin-bottom:14px">${esc(h.restore.msg)}
      ${h.restore.store ? `<button type="button" class="btn small danger" data-act="restoreYes">불러오기</button> <button type="button" class="btn small" data-act="restoreNo">취소</button>` : ''}</div>` : ''}
    ${[...byTerm].map(([k, list]) => `<section class="term"><h2>${esc(k)}</h2><div class="plancards">${list.map(card).join('')}</div></section>`).join('')
      || '<div class="empty">아직 만든 시험이 없어요.</div>'}`;
  renderGitHubCard();
}

/** 백업 파일을 지금 저장소와 합칠 계획을 세운다: 없는 시험은 추가, 같은 시험은 백업이 더 최신일 때만 덮어씀 */
function planRestore(raw) {
  const st = toStore(raw);
  if (!st || !Object.keys(st.plans).length) return { error: true, msg: '이 도구의 백업 파일이 아니에요.' };
  let add = 0, over = 0, skip = 0;
  for (const p of Object.values(st.plans)) {
    const cur = Store.plans[p.id];
    if (!cur) add++; else if ((p.updatedAt || 0) > (cur.updatedAt || 0)) over++; else skip++;
  }
  return { store: st, msg: `백업에 시험 ${Object.keys(st.plans).length}개가 있어요: 새로 추가 ${add}개, 백업이 더 최신이라 덮어쓰기 ${over}개, 지금 것이 같거나 최신이라 건너뛰기 ${skip}개.` };
}
function applyRestore(st) {
  let n = 0;
  for (const p of Object.values(st.plans)) {
    const cur = Store.plans[p.id];
    if (!cur || (p.updatedAt || 0) > (cur.updatedAt || 0)) { Store.plans[p.id] = p; persistLocal(); queueCloud(p.id); n++; }
  }
  return n;
}

function switchPlan(id) {
  const p = Store.plans[id]; if (!p) return;
  Store.currentId = id; usePlan(p);
  ui.pending = {}; ui.filter = { group: '', prof: '', status: '', q: '' };
  closeDrawer(); refreshRoomList(); persistLocal(); render();
}

function bindHistory() {
  bindGitHubCard();
  const box = $('#historyBox');
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.closest('[data-plan]')?.dataset.plan, p = id && Store.plans[id];
    if (act === 'new') { openWizard(); return; }
    if (act === 'backupAll') { await saveFile(`시험시간표_전체백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(Store, null, 1)); return; }
    if (act === 'restoreNo') { ui.hist.restore = null; renderHistory(); return; }
    if (act === 'restoreYes') { const n = applyRestore(ui.hist.restore.store); ui.hist.restore = null; afterStoreChanged(); toast(`백업에서 시험 ${n}개를 불러왔어요.`); return; }
    if (!p) return;
    if (act === 'open') { switchPlan(id); setTab('board'); toast(`${p.title}을(를) 열었어요.`); return; }
    if (act === 'lock') { p.locked = !p.locked; touchPlan(p); render(); toast(p.locked ? `${p.title}을(를) 보관했어요. 이제 수정할 수 없어요.` : `${p.title} 보관을 풀었어요.`); return; }
    if (act === 'backup') { await saveFile(`${safeName(p.title)}_백업.json`, JSON.stringify({ v: 2, plans: { [p.id]: p }, currentId: p.id }, null, 1)); return; }
    if (act === 'del') { ui.hist.del = id; renderHistory(); return; }
    if (act === 'delNo') { ui.hist.del = null; renderHistory(); return; }
    if (act === 'delYes') {
      ui.hist.del = null;
      delete Store.plans[id];
      (Store.deleted = Store.deleted || {})[id] = Date.now();
      if (Store.currentId === id) Store.currentId = latestPlanId(Store);
      persistLocal(); queueCloud(id);
      switchPlan(Store.currentId);
      toast(`${p.title}을(를) 지웠어요.`); return;
    }
  });
  box.addEventListener('change', async e => {
    if (e.target.id !== 'hRestore' || !e.target.files[0]) return;
    try { ui.hist.restore = planRestore(JSON.parse(await e.target.files[0].text())); }
    catch { ui.hist.restore = { error: true, msg: '파일을 읽지 못했어요. JSON 백업 파일인지 확인해 주세요.' }; }
    renderHistory();
  });
}

/* ===== src/js/wizard.js ===== */
/* ---------- 새 시험 만들기 (학기 강의시간표 + 수업일 현황 → 중간고사·기말고사 계획) ----------
   1) 학기 · 만들 시험(중간 8주차 / 기말 15주차)
   2) 자료: 파일 올리기(시간표 xlsx + 수업일 현황 PDF 또는 붙여넣기) 또는 같은 학기 다른 시험에서 가져오기
   3) 미리보기(시험 주차 날짜, 대체 수업일) → 만들기 */

/** 다음에 만들 시험 기본값: 최근 학기에 빠진 시험이 있으면 그 학기, 둘 다 있으면 다음 학기 */
function wizardDefaults() {
  const last = sortedPlans()[0];
  const now = new Date();
  if (!last) return { termYear: now.getFullYear(), term: now.getMonth() < 7 ? 1 : 2, kinds: { mid: true, final: true }, from: '' };
  const same = sortedPlans().filter(p => p.termYear === last.termYear && p.term === last.term);
  const has = k => same.some(p => p.kind === k);
  if (!has('mid') || !has('final')) return { termYear: last.termYear, term: last.term, kinds: { mid: !has('mid'), final: !has('final') }, from: last.id };
  return last.term === 1 ? { termYear: last.termYear, term: 2, kinds: { mid: true, final: true }, from: '' }
    : { termYear: last.termYear + 1, term: 1, kinds: { mid: true, final: true }, from: '' };
}
function openWizard() {
  const d = wizardDefaults();
  ui.wiz = { ...d, dept: S?.dept || '', src: d.from ? 'copy' : 'upload', tt: null, groupsOff: {}, cal: null, calText: '', busy: '' };
  closeDrawer();
  renderWizard();
  $('#modal').hidden = false;
  $('#wYear')?.focus();
}
function closeWizard() { ui.wiz = null; $('#modal').hidden = true; $('#modal').innerHTML = ''; }

/** 마법사 입력에서 실제로 쓸 시간표·수업일. 준비가 안 됐으면 null */
function wizardSource() {
  const w = ui.wiz;
  if (w.src === 'copy') { const p = Store.plans[w.from]; return p ? { classes: p.classes, calendar: p.calendar, year: p.year, sources: p.sources || {}, dept: p.dept } : null; }
  if (!w.tt?.classes || !w.cal?.data) return null;
  const classes = w.tt.classes.filter(c => !w.groupsOff[groupOf(c)]);
  return { classes, calendar: w.cal.data, year: +w.termYear, sources: { timetable: w.tt.name, calendar: w.cal.name || '붙여넣은 표' } };
}
function wizardIssues(src) {
  const w = ui.wiz, out = [];
  if (!(+w.termYear >= 2000)) out.push('학년도를 확인해 주세요.');
  if (!w.kinds.mid && !w.kinds.final) out.push('만들 시험을 하나 이상 골라 주세요.');
  if (!src) out.push(w.src === 'copy' ? '가져올 시험을 골라 주세요.' : '강의시간표와 수업일 현황을 모두 올려 주세요.');
  else {
    if (!src.classes.length) out.push('선택한 반에 수업이 없어요.');
    for (const k of ['mid', 'final']) if (w.kinds[k] && !src.calendar.weeks[KINDS[k].week - 1]) out.push(`수업일 현황에 ${KINDS[k].week}주차(${KINDS[k].label})가 없어요.`);
  }
  return out;
}

function calendarPreview(cal, year, examWeeks) {
  const { dateMap } = buildDateMap(cal, year);
  const isoOf = {}; for (const [iso, x] of Object.entries(dateMap)) isoOf[`${x.col}|${x.week}`] = iso;
  const rows = cal.weeks.map((row, wi) => {
    if (!row) return '';
    const wk = wi + 1;
    const cells = cal.cols.map(col => {
      const iso = isoOf[`${col}|${wk}`];
      const shifted = iso && DOW[dowOf(iso)] !== col;
      return `<td class="${shifted ? 'alt' : ''}"${shifted ? ` title="${esc(`${fmt(iso)}에 ${col}요일 수업`)}"` : ''}>${iso ? esc(fmt(iso)) : ''}</td>`;
    }).join('');
    const label = examWeeks[wk] ? ` <span class="pill ok">${examWeeks[wk]}</span>` : '';
    return `<tr class="${examWeeks[wk] ? 'ex' : ''}"><th>${wk}주${label}</th>${cells}</tr>`;
  }).join('');
  return `<div class="calprev tablebox"><table><thead><tr><th>주차</th>${cal.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* 다시 그리는 도중 포커스된 칸이 지워지면서 change 이벤트가 또 renderWizard를 부를 수 있다 → 끝난 뒤 한 번 더 그린다 */
let wizRendering = false, wizAgain = false;
function renderWizard() {
  if (wizRendering) { wizAgain = true; return; }
  wizRendering = true;
  try { drawWizard(); } finally { wizRendering = false; }
  if (wizAgain) { wizAgain = false; renderWizard(); }
}
function drawWizard() {
  const w = ui.wiz; if (!w) return;
  const others = sortedPlans();
  const src = wizardSource();
  const issues = wizardIssues(src);
  const examWeeks = {}; for (const k of ['mid', 'final']) if (w.kinds[k]) examWeeks[KINDS[k].week] = KINDS[k].label;
  const exists = ['mid', 'final'].filter(k => w.kinds[k] && Store.plans[`${w.termYear}-${w.term}-${k}`]);
  const ttGroups = w.tt?.classes ? [...new Set(w.tt.classes.map(groupOf))].sort() : [];
  const shifted = src ? shiftedDays(src.calendar, src.year) : [];

  const uploadBox = `
    <label class="field" for="wTt"><span>① 학과 강의시간표 (.xlsx) — '요일·학년·반·1~10교시' 머리글이 있는 시트를 찾아 읽어요</span>
      <input type="file" id="wTt" accept=".xlsx"></label>
    ${w.tt ? `<div class="result ${w.tt.error ? 'bad' : w.tt.classes ? 'ok' : ''}">${esc(w.tt.msg)}</div>` : ''}
    ${ttGroups.length ? `<div class="field"><span>시험 대상 반 (전공심화·야간처럼 빼야 할 반은 체크를 푸세요)</span><div class="radios">${ttGroups.map(g => {
        const n = w.tt.classes.filter(c => groupOf(c) === g).length;
        return `<label><input type="checkbox" data-group="${esc(g)}"${w.groupsOff[g] ? '' : ' checked'}>${esc(g)} <small class="hint">${n}개</small></label>`; }).join('')}</div></div>` : ''}
    <label class="field" for="wCalPdf"><span>② 요일별 수업일 현황 (.pdf)</span><input type="file" id="wCalPdf" accept=".pdf,application/pdf"></label>
    <label class="field" for="wCalText"><span>또는 '주 / 월~토' 표를 붙여 넣기 (PDF를 읽은 결과도 여기에 나와요. 틀린 곳은 고친 뒤 '표 다시 읽기')</span>
      <textarea id="wCalText" rows="6" placeholder="주	월	화	수	목	금	토&#10;1	3/2	3/3	3/4	3/5	3/6	3/7&#10;…">${esc(w.calText)}</textarea></label>
    <div class="row"><button type="button" class="btn small" id="wCalParse">표 다시 읽기</button></div>
    ${w.cal ? `<div class="result ${w.cal.error ? 'bad' : w.cal.data ? 'ok' : ''}">${esc(w.cal.msg)}</div>` : ''}`;
  const copyBox = `
    <label class="field" for="wFrom"><span>가져올 시험 (그 시험의 강의시간표·수업일 현황을 그대로 써요. 시험 일정은 새로 시작)</span>
      <select id="wFrom"><option value="">고르세요</option>${others.map(p => `<option value="${esc(p.id)}"${p.id === w.from ? ' selected' : ''}>${esc(p.title)} · 수업 ${p.classes.length}개</option>`).join('')}</select></label>`;

  $('#modal').innerHTML = `<div class="mbox">
    <div class="dhead"><div><h2 id="modalTitle">새 시험 만들기</h2><p>학기 강의시간표와 수업일 현황으로 중간고사·기말고사 시간표를 만들어요. 지난 시험 기록은 그대로 남아요.</p></div>
      <button type="button" class="btn small" id="wClose">닫기</button></div>
    <div class="dbody">
      <section class="step"><h3><span class="n">1</span>학기와 시험</h3>
        <div class="row">
          <label class="field" for="wYear"><span>학년도</span><input type="number" id="wYear" value="${esc(w.termYear)}" min="2020" max="2100" style="width:110px"></label>
          <div class="field"><span>학기</span><div class="radios">${[1, 2].map(t => `<label><input type="radio" name="wTerm" value="${t}"${+w.term === t ? ' checked' : ''}>${t}학기</label>`).join('')}</div></div>
          <div class="field"><span>만들 시험</span><div class="radios">${['mid', 'final'].map(k => `<label><input type="checkbox" data-kind="${k}"${w.kinds[k] ? ' checked' : ''}>${KINDS[k].label} (${KINDS[k].week}주차)</label>`).join('')}</div></div>
        </div>
        <label class="field" for="wDept"><span>학과</span><input type="text" id="wDept" value="${esc(w.dept)}"></label>
        ${exists.length ? `<p class="hint" style="color:var(--warn)">${exists.map(k => KINDS[k].label).join('·')}는 이미 있어요. 만들면 별도 사본(…-2)으로 하나 더 생겨요.</p>` : ''}
      </section>
      <section class="step"><h3><span class="n">2</span>강의시간표 · 수업일 현황</h3>
        <div class="radios">
          <label><input type="radio" name="wSrc" value="upload"${w.src === 'upload' ? ' checked' : ''}>파일 올리기 (새 학기)</label>
          <label><input type="radio" name="wSrc" value="copy"${w.src === 'copy' ? ' checked' : ''}${others.length ? '' : ' disabled'}>다른 시험에서 가져오기 (같은 학기 중간→기말)</label>
        </div>
        ${w.src === 'copy' ? copyBox : uploadBox}
        ${w.busy ? `<p class="hint">${esc(w.busy)}</p>` : ''}
      </section>
      <section class="step"><h3><span class="n">3</span>확인</h3>
        ${src ? `<p class="hint">수업 ${src.classes.length}개 · ${new Set(src.classes.map(groupOf)).size}개 반 · 교수님 ${new Set(src.classes.map(c => c.prof).filter(Boolean)).size}분. 색칠된 줄이 시험 주차예요. 주황 날짜는 실제 요일과 다른 요일 수업을 하는 날(대체 수업일)이라 그 요일 시간표로 겹침을 검사해요.</p>
          ${shifted.length ? `<ul class="plain">${shifted.map(x => `<li>${esc(fmt(x.iso))} → ${esc(x.col)}요일 ${x.week}주차 수업일</li>`).join('')}</ul>` : ''}
          ${calendarPreview(src.calendar, src.year, examWeeks)}` : '<p class="hint">자료를 올리면 여기서 주차별 날짜를 확인할 수 있어요.</p>'}
        ${issues.length ? `<div class="checks">${issues.map(t => `<div class="it warn">${esc(t)}</div>`).join('')}</div>` : ''}
        <div class="row"><button type="button" class="btn primary" id="wCreate"${issues.length || w.busy ? ' disabled' : ''}>시험 만들기</button></div>
      </section>
    </div></div>`;
}

function createFromWizard() {
  const w = ui.wiz, src = wizardSource();
  if (!src || wizardIssues(src).length) return;
  const made = [];
  for (const k of ['mid', 'final']) {
    if (!w.kinds[k]) continue;
    const p = makePlan({ termYear: +w.termYear, term: +w.term, kind: k, dept: w.dept.trim() || src.dept || S?.dept,
      calendar: src.calendar, classes: src.classes, sources: src.sources, taken: Store.plans });
    p.year = src.year;
    Store.plans[p.id] = p; made.push(p);
    touchPlan(p);
  }
  closeWizard();
  switchPlan(made[0].id);
  setTab('board');
  toast(`${made.map(p => p.title).join(', ')}을(를) 만들었어요.`);
}

function bindWizard() {
  const m = $('#modal');
  m.addEventListener('click', e => {
    if (e.target === m || e.target.closest('#wClose')) { closeWizard(); return; }
    if (e.target.closest('#wCreate')) { createFromWizard(); return; }
    if (e.target.closest('#wCalParse')) {
      const w = ui.wiz; w.calText = $('#wCalText').value;
      w.cal = { ...parseCalendarText(w.calText), name: w.cal?.name || '붙여넣은 표' };
      renderWizard();
    }
  });
  m.addEventListener('change', async e => {
    const w = ui.wiz, el = e.target; if (!w) return;
    if (el.id === 'wYear') w.termYear = +el.value;
    else if (el.name === 'wTerm') w.term = +el.value;
    else if (el.dataset.kind) w.kinds[el.dataset.kind] = el.checked;
    else if (el.id === 'wDept') w.dept = el.value;
    else if (el.name === 'wSrc') w.src = el.value;
    else if (el.id === 'wFrom') w.from = el.value;
    else if (el.dataset.group) w.groupsOff[el.dataset.group] = !el.checked;
    else if (el.id === 'wCalText') { w.calText = el.value; if (el.value.trim()) w.cal = { ...parseCalendarText(el.value), name: '붙여넣은 표' }; }
    else if (el.id === 'wTt' && el.files[0]) {
      const f = el.files[0]; w.busy = '강의시간표 읽는 중…'; renderWizard();
      try {
        const res = await parseTimetableXlsx(await f.arrayBuffer());
        const g = new Set(res.classes.map(groupOf)).size, pr = new Set(res.classes.map(c => c.prof).filter(Boolean)).size;
        w.tt = { name: f.name, classes: res.classes, msg: `${f.name}: '${res.sheet}' 시트에서 수업 ${res.classes.length}개(${g}개 반, 교수님 ${pr}분)를 읽었어요.` };
        w.groupsOff = {};
      } catch (err) { w.tt = { error: true, msg: `${f.name}: ${err.message || '파일을 읽지 못했어요.'}` }; }
      w.busy = '';
    } else if (el.id === 'wCalPdf' && el.files[0]) {
      const f = el.files[0]; w.busy = '수업일 현황 PDF 읽는 중…'; renderWizard();
      try { const res = await parseCalendarPdf(await f.arrayBuffer()); w.calText = res.text; w.cal = { ...res, name: f.name, fromPdf: true, msg: `${f.name}: ${res.msg}` }; }
      catch (err) { w.cal = { error: true, msg: `${f.name}: ${err.message || 'PDF를 읽지 못했어요.'}` }; }
      w.busy = '';
    } else return;
    renderWizard();
  });
}

/* ===== src/js/drag.js ===== */
/* ---------- 날짜별 배치 화면 드래그 (pointer 이벤트, 같은 반 줄 안에서만, 가장자리 자동 스크롤) ---------- */
let drag = null;
function clearHighlight() { $$('.cell.ok,.cell.bad').forEach(el => el.classList.remove('ok', 'bad')); }
function dragTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest ? el.closest('.cell') : null;
  if (!cell) return null;
  return { date: cell.dataset.date, group: cell.dataset.group, p: +cell.dataset.p, track: cell.parentElement };
}
function onDragMove(e) {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.started = true;
    document.body.classList.add('dragging');
    drag.el.classList.add('src');
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('src');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.gridColumn = ''; g.style.gridRow = '';
    document.body.appendChild(g);
    drag.ghost = g; drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
  }
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  if (!drag.raf) drag.raf = requestAnimationFrame(autoScroll);
  updateTarget(e.clientX, e.clientY);
}
function autoScroll() {
  if (!drag || !drag.started) return;
  const y = drag.lastY, edge = 80;
  let dy = 0;
  if (y < edge) dy = -Math.ceil((edge - y) / 3); else if (y > window.innerHeight - edge) dy = Math.ceil((y - (window.innerHeight - edge)) / 3);
  if (dy) { const before = window.scrollY; window.scrollBy(0, dy); if (window.scrollY !== before) updateTarget(drag.lastX, drag.lastY); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function updateTarget(x, y) {
  clearHighlight();
  const e = { clientX: x, clientY: y };
  const t = dragTarget(e.clientX, e.clientY);
  const tip = $('#dragTip');
  const c = D.byId[drag.id], ex = S.exams[drag.id];
  drag.target = null;
  if (!t) { tip.hidden = true; return; }
  if (t.group !== groupOf(c)) {
    tip.hidden = false; tip.textContent = `${groupOf(c)} 줄 안에서만 옮길 수 있어요`;
  } else {
    const start = Math.max(1, Math.min(NP - ex.len + 1, t.p - drag.grabP));
    const place = { date: t.date, start, len: ex.len, room: ex.room };
    const cf = conflictsOf(c, place), wn = warningsOf(c, place);
    const cls = cf.length ? 'bad' : 'ok';
    $$('.cell', t.track).forEach(el => { const p = +el.dataset.p; if (p >= start && p < start + ex.len) el.classList.add(cls); });
    drag.target = place;
    tip.hidden = false;
    tip.textContent = `${fmt(t.date)} ${pRange(start, ex.len)} ${tRange(start, ex.len)}` + (cf.length ? '\n' + cf.map(describeConflict).join('\n') : ' · 겹침 없음') + (wn.length ? '\n' + wn.join('\n') : '');
  }
  tip.style.whiteSpace = 'pre-line';
  tip.style.left = Math.min(window.innerWidth - 330, e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + 18) + 'px';
}
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.raf) cancelAnimationFrame(d.raf);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onCancel);
  clearHighlight();
  $('#dragTip').hidden = true;
  document.body.classList.remove('dragging');
  if (d.ghost) d.ghost.remove();
  if (d.el) d.el.classList.remove('src');
  if (cancelled) return;
  if (!d.started) { openDrawer(d.id); return; }
  if (d.target) {
    const ex = S.exams[d.id];
    if (ex.date !== d.target.date || ex.start !== d.target.start) {
      const before = `${fmt(ex.date)} ${pRange(ex.start, ex.len)}`;
      ex.date = d.target.date; ex.start = d.target.start;
      changed();
      const c = D.byId[d.id];
      const n = conflictsOf(c, { date: ex.date, start: ex.start, len: ex.len, room: ex.room }).length;
      toast(`${c.course}(${groupOf(c)}) ${before} → ${fmt(ex.date)} ${pRange(ex.start, ex.len)}${n ? ` · 겹침 ${n}건` : ''}`);
    }
  }
}
const onUp = e => endDrag(e, false);
const onCancel = e => endDrag(e, true);

  $('#planSel').addEventListener('change', e => { switchPlan(e.target.value); toast(`${S.title}을(를) 열었어요.`); });
  $('#btnNewPlan').addEventListener('click', openWizard);
  $('#lockBanner').addEventListener('click', e => { if (e.target.closest('#btnUnlock')) { S.locked = false; touchPlan(S); render(); toast('보관을 풀었어요. 이제 수정할 수 있어요.'); } });

  const board = $('#board');
  board.addEventListener('pointerdown', e => {
    const b = e.target.closest('.blk.exam'); if (!b || e.button !== 0 || isLocked()) return;
    const id = b.dataset.id, ex = S.exams[id];
    const r = b.getBoundingClientRect();
    const grabP = Math.max(0, Math.min(ex.len - 1, Math.floor((e.clientX - r.left) / (r.width / ex.len))));
    drag = { id, el: b, x0: e.clientX, y0: e.clientY, started: false, grabP };
    e.preventDefault();
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  board.addEventListener('click', e => {
    const rm = e.target.closest('[data-rmdate]');
    if (rm) { if (isLocked()) return; S.extraDates = (S.extraDates || []).filter(d => d !== rm.dataset.rmdate); changed(); return; }
    const b = e.target.closest('.blk.exam');
    if (b && (e.detail === 0 || isLocked())) openDrawer(b.dataset.id);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (drag) endDrag(e, true); else if (ui.wiz) closeWizard(); else if (ui.drawerId || ui.reg) closeDrawer();
  });
  $('#addDate').addEventListener('change', e => { const d = e.target.value; if (!d || isLocked()) return; S.extraDates = [...new Set([...(S.extraDates || []), d])]; changed(); toast(`${fmt(d)}을 추가했어요. 시험 블록을 이 날짜로 끌어 놓을 수 있어요.`); });

  const lt = $('#listTable');
  lt.addEventListener('change', e => {
    const el = e.target, f = el.dataset.f, tr = el.closest('tr[data-id]'); if (!f || !tr || isLocked()) return;
    setExamField(tr.dataset.id, f, el.type === 'checkbox' ? el.checked : el.value);
    changed();
  });
  lt.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openDrawer(b.dataset.open); });
  $('#fGroup').addEventListener('change', e => { ui.filter.group = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fProf').addEventListener('change', e => { ui.filter.prof = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fStatus').addEventListener('change', e => { ui.filter.status = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#fQ').addEventListener('input', e => { ui.filter.q = e.target.value; renderList(); if (isLocked()) lockControls(); });
  $('#btnCopyTsv').addEventListener('click', () => copyText(listTsv()));

  $('#profGrid').addEventListener('click', e => {
    const cp = e.target.closest('[data-copy]');
    if (cp) { copyText(profMessage(cp.dataset.copy), document.getElementById('msg-' + cp.dataset.copy)); return; }
    const md = e.target.closest('[data-markdone]');
    if (md && !isLocked()) { for (const c of S.classes) if (c.prof === md.dataset.markdone) S.exams[c.id].done = true; changed(); toast(`${md.dataset.markdone} 교수님 과목을 확정으로 표시했어요.`); }
  });

  bindDrawer();
  bindSetup();
  bindHistory();
  bindWizard();
}

(function boot() {
  const seed = JSON.parse(document.getElementById('seed').textContent);
  Store = loadLocal();
  if (!Store) {
    // 처음 여는 브라우저: 저장소에 들어 있는 기본 자료(data/seed.json)로 계획 하나를 만든다
    Store = newStore();
    const p = upgradePlan({ v: 1, ...seed, exams: {}, extraDates: [], rev: 0, updatedAt: 0 });
    Store.plans[p.id] = p; Store.currentId = p.id;
  }
  if (!Store.plans[Store.currentId]) Store.currentId = latestPlanId(Store);
  usePlan(Store.plans[Store.currentId]);
  persistLocal();
  refreshRoomList();
  bind();
  const h = location.hash.slice(1);
  setTab(TABS.includes(h) ? h : 'board', false);
  setSave('local');
  initCloud();
  initGitHub();
  getDownloads();
})();
window.__planner = {
  openRegister, saveRegister, get reg() { return ui.reg; }, get state() { return S; }, get store() { return Store; },
  derive, render, conflictsOf, warningsOf, statusOf, counts, freeSlots, itemsOn, buildWorkbook, parseCalendarText, parseTimetableXlsx,
  parseCalendarPdf, profMessage, openDrawer, changed, switchPlan, openWizard, gh, ghSync,
};

</script>
</body>
</html>
