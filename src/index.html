<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 시간표 편성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*STYLES*/
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="deptLabel"></p>
      <h1 id="titleLabel"></h1>
      <div class="planpick" role="group" aria-label="시험 선택">
        <label>학년도 <select id="selYear"></select></label>
        <label>학기 <select id="selTerm"><option value="1">1학기</option><option value="2">2학기</option></select></label>
        <label>시험 <select id="selKind"><option value="mid">중간고사</option><option value="final">기말고사</option></select></label>
      </div>
    </div>
    <div class="actions">
      <span id="saveState" class="savepill" role="status"></span>
      <button type="button" class="btn" id="btnRegister">시험 일정 등록</button>
      <button type="button" class="btn primary" id="btnExport">엑셀로 내보내기</button>
    </div>
  </header>
  <section id="createPanel" class="createpanel" hidden></section>
  <div id="lockBanner" class="lockbanner" hidden></div>
  <section class="summary" id="summary" aria-label="요약"></section>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button type="button" role="tab" id="tab-btn-board" data-tab="board" aria-selected="true">날짜별 배치</button>
    <button type="button" role="tab" id="tab-btn-courses" data-tab="courses" aria-selected="false">과목 목록</button>
    <button type="button" role="tab" id="tab-btn-history" data-tab="history" aria-selected="false">학기별 기록</button>
    <button type="button" role="tab" id="tab-btn-setup" data-tab="setup" aria-selected="false">설정</button>
  </nav>
  <main>
    <section id="tab-board" class="tabpanel" role="tabpanel">
      <div class="boardbar">
        <div class="rangebar">
          <div class="datefield-wrap">
            <span class="flabel">기간선택</span>
            <button type="button" class="datefield" id="rangeBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="rangePop"><span id="rangeText"></span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
            <section id="rangePop" class="calpop" hidden role="dialog" aria-label="기간 선택 달력"></section>
          </div>
          <button type="button" class="btn small" id="rangeReset">시험 주차에 맞추기</button>
          <label class="chkline"><input type="checkbox" id="showFixed" checked> 다른 주차 수업·보강도 보기</label>
        </div>
        <button type="button" class="btn small" id="btnKeepAll"></button>
      </div>
      <div class="striphead">
        <div><h3>날짜별 시간표</h3><p class="hint">시험 블록을 끌어서 다른 날짜·교시로 옮기세요 (같은 반 줄 안에서). 옆으로 넘겨 보고, 끄는 중에 가장자리로 가면 자동으로 넘어가요. 블록을 누르면 방식·확정을 고를 수 있어요.</p></div>
        <div class="row"><span class="hint" id="stripPos"></span><button type="button" class="btn small" id="stripPrev" aria-label="이전 날짜">‹</button><button type="button" class="btn small" id="stripNext" aria-label="다음 날짜">›</button></div>
      </div>
      <div class="legend" style="margin-bottom:8px">
        <span><i class="sw y1"></i>1학년</span><span><i class="sw y2"></i>2학년</span><span><i class="sw y3"></i>3학년</span>
        <span><span class="wk wk-exam">15주차</span> 시험 주차 수업(옮길 수 있음)</span>
        <span><span class="wk">14주차</span> 다른 주차 수업(고정)</span>
        <span><span class="wk wk-mk">보강</span> 보강 수업(고정)</span>
        <span><i class="sw bd"></i>겹침</span>
      </div>
      <div class="daystrip" id="board"></div>
      <h3 class="sectitle">주차 × 요일 한눈에 보기</h3>
      <p class="hint" style="margin-bottom:8px">카드를 다른 날짜 칸으로 끌면 같은 교시로 옮겨져요. 날짜를 누르면 위 날짜별 시간표가 그 날로 넘어가요.</p>
      <div class="weekgrid-wrap"><div id="weekGrid" class="weekgrid"></div></div>
    </section>
    <section id="tab-courses" class="tabpanel" role="tabpanel" hidden>
      <div class="filters">
        <label for="fGroup">반 <select id="fGroup"></select></label>
        <label for="fProf">교수 <select id="fProf"></select></label>
        <label for="fStatus">상태 <select id="fStatus">
          <option value="">전체</option><option value="bad">겹침 있음</option><option value="warn">확인 필요</option><option value="moved">날짜·시간 변경</option><option value="keep">기존 시간표 수업 진행</option><option value="undecided">방식 미정</option><option value="open">미확정</option><option value="done">확정</option>
        </select></label>
        <label for="fQ">검색 <input type="text" id="fQ" placeholder="과목·교수·강의실"></label>
        <button type="button" class="btn small" id="btnCopyTsv">표 복사 (엑셀 붙여넣기용)</button>
      </div>
      <div class="tablebox"><table class="listtable" id="listTable"></table></div>
    </section>
    <section id="tab-history" class="tabpanel" role="tabpanel" hidden>
      <div id="historyBox"></div>
    </section>
    <section id="tab-setup" class="tabpanel" role="tabpanel" hidden>
      <div class="setgrid" id="setupGrid"></div>
    </section>
  </main>
</div>
<aside id="drawer" class="drawer" hidden aria-label="과목 시험 설정"></aside>
<div id="dragTip" class="dragtip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="roomList"></datalist>
<script id="seed" type="application/json">/*SEED*/</script>
<script>
'use strict';
/*APP*/
</script>
</body>
</html>
