<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 시간표 편성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 행정용 작업 도구. 상단 요약 → 탭(날짜별 배치 / 과목 목록 / 교수님 확인 / 설정) → 오른쪽 편집 서랍.
   학년 색(1 노랑, 2 파랑, 3 초록)은 학과 강의시간표 관례를 그대로 따른다. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2333; --muted:#5b6474; --line:#d9dde5; --accent:#1f3a68; --accent-ink:#ffffff;
  --y1:#fff4cf; --y1s:#f2c94c; --y2:#e1ecfb; --y2s:#5f8fdc; --y3:#e2f2dc; --y3s:#5ea64f;
  --bad:#c42b2b; --bad-bg:#fde7e7; --warn:#9a5b00; --warn-bg:#fff0d6; --ok:#257346; --ok-bg:#e0f3e8;
  --fixed:#e9ebf0; --fixed-ink:#6b7280; --lunch:#f7f7f9;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
    --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
    --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
    --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#a2aab8; --line:#2f3744; --accent:#8fb0ea; --accent-ink:#0f1520;
  --y1:#3a3216; --y1s:#d9b23e; --y2:#1d2d47; --y2s:#6d9be6; --y3:#1f3320; --y3s:#6fbc5f;
  --bad:#ff7b7b; --bad-bg:#3d1b1d; --warn:#f0b357; --warn-bg:#3a2b12; --ok:#6fd49a; --ok-bg:#163223;
  --fixed:#262d38; --fixed-ink:#9aa3b2; --lunch:#161b23;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:22px 0 14px}
.eyebrow{margin:0 0 2px;color:var(--muted);font-size:13px;font-weight:500}
h1{font-size:24px;font-weight:700;letter-spacing:-0.01em}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.savepill{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savepill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.savepill.cloud::before{background:var(--ok)}
.savepill.saving::before,.savepill.loading::before{background:var(--warn)}
.savepill.error::before{background:var(--bad)}

.summary{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 14px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink);font-size:15px}
button.chip:hover{border-color:var(--accent)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.bad b{color:var(--bad)}
.chip.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip.ok b{color:var(--ok)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px 0 80px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* board */
.boardbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.sw.y1{background:var(--y1);border-color:var(--y1s)} .sw.y2{background:var(--y2);border-color:var(--y2s)} .sw.y3{background:var(--y3);border-color:var(--y3s)}
.sw.fx{background:repeating-linear-gradient(135deg,var(--fixed) 0 4px,transparent 4px 7px)}
.sw.bd{background:var(--bad-bg);border:2px solid var(--bad)}
.board{display:flex;flex-direction:column;gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.dayhead h3{font-size:17px}
.dayhead .dow{font-weight:500;color:var(--muted);margin-left:2px}
.tag{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--fixed);color:var(--muted)}
.tag.alt{background:var(--warn-bg);color:var(--warn)}
.tag.free{background:var(--ok-bg);color:var(--ok)}
.dayhead .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.scroller{overflow-x:auto}
.grid{min-width:940px}
.ghead,.grow{display:grid;grid-template-columns:52px 1fr}
.ghead .periods,.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.55fr) repeat(5,minmax(0,1fr))}
.ghead{font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ghead .periods div{padding:4px 0;text-align:center;border-left:1px solid var(--line);line-height:1.3}
.ghead .periods b{display:block;color:var(--ink);font-size:12.5px}
.glabel{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border-right:1px solid var(--line);position:relative}
.glabel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.glabel.y1::before{background:var(--y1s)} .glabel.y2::before{background:var(--y2s)} .glabel.y3::before{background:var(--y3s)}
.grow{border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow.yb{border-top:2px solid var(--line)}
.track{position:relative;grid-auto-rows:minmax(42px,auto);padding:3px 0}
.cell{grid-row:1/-1;border-left:1px solid var(--line);margin:-3px 0}
.cell.lunch{background:var(--lunch)}
.cell.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.cell.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.blk{margin:2px 3px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;min-width:0;text-align:left;border:1px solid transparent;position:relative;z-index:1;overflow:hidden}
.blk .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.blk.fixed{background:repeating-linear-gradient(135deg,var(--fixed) 0 6px,transparent 6px 10px);border-color:var(--line);color:var(--fixed-ink)}
.blk.fixed .t{font-weight:500}
.blk.exam{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.blk.exam.y1{background:var(--y1);border-color:var(--y1s)} .blk.exam.y2{background:var(--y2);border-color:var(--y2s)} .blk.exam.y3{background:var(--y3);border-color:var(--y3s)}
.blk.exam:hover{filter:brightness(.97)}
.blk.exam.bad{border:2px solid var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.blk .badge{position:absolute;top:3px;right:4px;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px}
.badge.b-bad{background:var(--bad);color:#fff}
.badge.b-mv{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.badge.b-ok{background:var(--ok);color:#fff}
.blk.has-badge .t{padding-right:30px}
body.dragging,body.dragging *{cursor:grabbing !important}
body.dragging .blk{pointer-events:none}
.blk.src{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:6px;padding:5px 8px;max-width:320px;line-height:1.4}
.adddate{display:flex;gap:6px;align-items:center;font-size:13px}
select,input[type="text"],input[type="number"],textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
textarea{width:100%;resize:vertical}

/* list */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:12px}
.listtable select,.listtable input[type="text"]{padding:3px 6px;font-size:13px}
.listtable .note{min-width:160px;width:100%}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.st{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mv{border:1px solid var(--warn);color:var(--warn)} .pill.na{background:var(--fixed);color:var(--muted)}
tr.rbad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.gtag{font-weight:700}

/* profs */
.profgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-size:12.5px;color:var(--muted);font-weight:500}
.msg{white-space:pre-wrap;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;max-height:240px;overflow:auto;font-family:var(--font-body)}

/* settings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card h2{font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field span{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result{font-size:13px;border-radius:7px;padding:8px 10px;background:var(--bg)}
.result.bad{background:var(--bad-bg);color:var(--bad)} .result.ok{background:var(--ok-bg);color:var(--ok)}
ul.plain{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.dhead h2{font-size:18px}
.dhead .btn{white-space:nowrap;flex-shrink:0}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dbody{padding:14px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid select,.fgrid input{width:100%}
.fgrid input[type="checkbox"]{width:auto;margin:0 6px 0 0}
.chk{display:flex;align-items:center;color:var(--ink) !important;min-height:30px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks .it{border-radius:7px;padding:7px 9px}
.checks .it.bad{background:var(--bad-bg);color:var(--bad)} .checks .it.warn{background:var(--warn-bg);color:var(--warn)} .checks .it.ok{background:var(--ok-bg);color:var(--ok)}
.slots{display:flex;flex-direction:column;gap:8px}
.slotday{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:start;font-size:13px}
.slotday .lbl{color:var(--muted);padding-top:3px}
.slotday .lbl b{color:var(--ink)}
.slotday .opts{display:flex;flex-wrap:wrap;gap:4px}
.slotbtn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 7px;font-size:12.5px}
.slotbtn:hover{border-color:var(--ok);background:var(--ok-bg)}
.slotbtn.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dsec h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:640px){
  .wrap{padding:0 16px}
  h1{font-size:20px}
  .setgrid,.profgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="deptLabel"></p>
      <h1 id="titleLabel"></h1>
    </div>
    <div class="actions">
      <span id="saveState" class="savepill" role="status"></span>
      <button type="button" class="btn" id="btnRegister">시험 일정 등록</button>
      <button type="button" class="btn primary" id="btnExport">엑셀로 내보내기</button>
    </div>
  </header>
  <section class="summary" id="summary" aria-label="요약"></section>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button type="button" role="tab" id="tab-btn-board" data-tab="board" aria-selected="true">날짜별 배치</button>
    <button type="button" role="tab" id="tab-btn-courses" data-tab="courses" aria-selected="false">과목 목록</button>
    <button type="button" role="tab" id="tab-btn-professors" data-tab="professors" aria-selected="false">교수님 확인</button>
    <button type="button" role="tab" id="tab-btn-setup" data-tab="setup" aria-selected="false">설정</button>
  </nav>
  <main>
    <section id="tab-board" class="tabpanel" role="tabpanel">
      <div class="boardbar">
        <p class="hint">시험 블록을 끌어서 다른 시간·날짜로 옮기면 같은 반 수업, 교수님 일정, 강의실 겹침을 바로 확인해요. 블록을 누르면 방식·시간을 입력할 수 있어요.</p>
        <div class="adddate"><label for="addDate">날짜 추가</label><select id="addDate"></select></div>
      </div>
      <div class="legend" style="margin-bottom:10px">
        <span><i class="sw y1"></i>1학년 시험</span><span><i class="sw y2"></i>2학년 시험</span><span><i class="sw y3"></i>3학년 시험</span>
        <span><i class="sw fx"></i>그날 정상 수업(옮길 수 없음)</span><span><i class="sw bd"></i>겹침</span>
      </div>
      <div class="board" id="board"></div>
    </section>
    <section id="tab-courses" class="tabpanel" role="tabpanel" hidden>
      <div class="filters">
        <label for="fGroup">반 <select id="fGroup"></select></label>
        <label for="fProf">교수 <select id="fProf"></select></label>
        <label for="fStatus">상태 <select id="fStatus">
          <option value="">전체</option><option value="bad">겹침 있음</option><option value="warn">확인 필요</option><option value="moved">날짜·시간 변경</option><option value="undecided">방식 미정</option><option value="open">미확정</option><option value="done">확정</option>
        </select></label>
        <label for="fQ">검색 <input type="text" id="fQ" placeholder="과목·교수·강의실"></label>
        <button type="button" class="btn small" id="btnCopyTsv">표 복사 (엑셀 붙여넣기용)</button>
      </div>
      <div class="tablebox"><table class="listtable" id="listTable"></table></div>
    </section>
    <section id="tab-professors" class="tabpanel" role="tabpanel" hidden>
      <p class="hint" style="margin-bottom:12px">교수님별로 담당 과목 시험 일정을 모았어요. 문구를 복사해서 메일이나 메신저로 확인 요청을 보내세요.</p>
      <div class="profgrid" id="profGrid"></div>
    </section>
    <section id="tab-setup" class="tabpanel" role="tabpanel" hidden>
      <div class="setgrid" id="setupGrid"></div>
    </section>
  </main>
</div>
<aside id="drawer" class="drawer" hidden aria-label="과목 시험 설정"></aside>
<div id="dragTip" class="dragtip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script id="seed" type="application/json">/*SEED*/</script>
<script>
'use strict';
const SEED = JSON.parse(document.getElementById('seed').textContent);
const PERIODS = [['09:00','09:50'],['09:55','10:45'],['10:50','11:40'],['11:45','12:35'],['12:40','13:30'],['13:35','14:25'],['14:30','15:20'],['15:25','16:15'],['16:20','17:10'],['17:15','18:05']];
const NP = 10, LUNCH = 5;
const DOW = ['일','월','화','수','목','금','토'];
const DAY_ORDER = ['월','화','수','목','금','토'];
const METHODS = ['미정','필기','실기','필기+실기','발표','과제 대체','시험 없음'];
const NO_SLOT = new Set(['과제 대체','시험 없음']);
const LS_KEY = 'exam-planner:v1';
const TAB_ID = Math.random().toString(36).slice(2, 10);
const EXCELJS_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clone = o => JSON.parse(JSON.stringify(o));
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

let S = null;
const D = {};
const ui = { tab: 'board', filter: { group: '', prof: '', status: '', q: '' }, drawerId: null, pending: {} };

/* ---------- state & derived data ---------- */
function freshState() {
  return { v: 1, title: SEED.title, dept: SEED.dept, year: SEED.year, examWeek: SEED.examWeek,
    calendar: clone(SEED.calendar), classes: clone(SEED.classes), exams: {}, extraDates: [], rev: 0, updatedAt: 0 };
}
function validState(s) {
  return !!(s && s.v === 1 && Array.isArray(s.classes) && s.calendar && Array.isArray(s.calendar.weeks) && Array.isArray(s.calendar.cols) && s.exams && typeof s.exams === 'object');
}
function tokToIso(tok) {
  const m = String(tok || '').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if (!m) return null;
  const mo = +m[1], da = +m[2];
  let y = +S.year;
  if (D.firstMonth >= 7 && mo <= 2) y += 1;
  return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
}
const dowOf = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
function fmt(iso) { if (!iso) return '-'; const [, m, d] = iso.split('-'); return `${+m}/${+d}(${DOW[dowOf(iso)]})`; }
const groupOf = c => `${c.year}${c.ban}`;
const lenOf = c => c.end - c.start + 1;
const roomLabel = r => !r ? '-' : (/^\d+$/.test(r) ? r + '호' : r);
const normRoom = r => String(r || '').replace(/호/g, '').replace(/\s+/g, '').toUpperCase();
const pRange = (s, len) => len <= 1 ? `${s}교시` : `${s}~${s + len - 1}교시`;
const tRange = (s, len) => { const e = Math.min(NP, s + len - 1); return `${PERIODS[s - 1]?.[0] ?? '?'}~${PERIODS[e - 1]?.[1] ?? '?'}`; };

function derive() {
  const first = S.calendar.weeks.find(Boolean)?.find(Boolean);
  D.firstMonth = first ? +String(first).split('/')[0] : 9;
  const dm = {}, colDates = {};
  S.calendar.weeks.forEach((row, wi) => {
    (row || []).forEach((tok, ci) => {
      const col = S.calendar.cols[ci];
      const iso = tokToIso(tok);
      if (!col || !iso) return;
      dm[iso] = { col, week: wi + 1 };
      (colDates[col] = colDates[col] || [])[wi] = iso;
    });
  });
  D.dateMap = dm; D.colDates = colDates;
  D.allDates = Object.keys(dm).sort();
  D.lastDate = D.allDates[D.allDates.length - 1];
  D.byId = Object.fromEntries(S.classes.map(c => [c.id, c]));
  D.groups = [...new Set(S.classes.map(groupOf))].sort();
  D.profs = [...new Set(S.classes.map(c => c.prof).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  D.rooms = [...new Set(S.classes.map(c => c.room).filter(Boolean))].sort();
  D.candDates = D.allDates.filter(d => dm[d].week >= S.examWeek - 2 && dowOf(d) !== 0);
  for (const c of S.classes) if (!S.exams[c.id]) S.exams[c.id] = defaultExam(c);
  for (const id of Object.keys(S.exams)) if (!D.byId[id]) delete S.exams[id];
}
const defaultDate = c => D.colDates[c.day]?.[S.examWeek - 1] || '';
const prevDate = c => D.colDates[c.day]?.[S.examWeek - 2] || '';
function defaultExam(c) {
  return { method: '미정', date: defaultDate(c), start: c.start, len: lenOf(c), room: c.room, note: '', done: false };
}
const hasSlot = ex => !NO_SLOT.has(ex.method);
const isMoved = c => { const ex = S.exams[c.id]; return hasSlot(ex) && (ex.date !== defaultDate(c) || ex.start !== c.start); };

/* Everything that occupies time on a date.
   - fixed: a regular class session held that day (any week except the exam week; also exam-week
     sessions of courses that have no exam slot, which we treat as held normally).
   - exam: any exam placed on that date. */
function itemsOn(iso, excludeId) {
  const out = [];
  const info = D.dateMap[iso];
  if (info) {
    const examWeekDay = info.week === S.examWeek;
    for (const c of S.classes) {
      if (c.day !== info.col) continue;
      if (examWeekDay && hasSlot(S.exams[c.id])) continue;
      out.push({ kind: 'fixed', c, s: c.start, e: c.end, room: c.room, week: info.week });
    }
  }
  for (const c of S.classes) {
    if (c.id === excludeId) continue;
    const ex = S.exams[c.id];
    if (!hasSlot(ex) || ex.date !== iso) continue;
    out.push({ kind: 'exam', c, s: ex.start, e: ex.start + ex.len - 1, room: ex.room });
  }
  return out;
}
function conflictsOf(c, p) {
  if (!p.date) return [];
  const s = p.start, e = p.start + p.len - 1, g = groupOf(c), rn = normRoom(p.room);
  const res = [];
  for (const it of itemsOn(p.date, c.id)) {
    if (it.s > e || it.e < s) continue;
    const kinds = [];
    if (groupOf(it.c) === g) kinds.push('반');
    if (it.c.prof && it.c.prof === c.prof) kinds.push('교수');
    if (rn && normRoom(it.room) === rn) kinds.push('강의실');
    if (kinds.length) res.push({ kinds, it });
  }
  return res;
}
function warningsOf(c, p) {
  const w = [];
  if (!p.date) { w.push('날짜를 정해 주세요'); return w; }
  const dw = dowOf(p.date);
  if (dw === 0 || dw === 6) w.push(`${DOW[dw]}요일이에요`);
  if (!D.dateMap[p.date]) w.push('수업일 현황에 없는 날짜예요');
  if (D.lastDate && p.date > D.lastDate) w.push(`학기 마지막 수업일(${fmt(D.lastDate)}) 이후예요`);
  const pv = prevDate(c);
  if (pv && p.date <= pv) w.push(`${S.examWeek - 1}주차 수업(${fmt(pv)})보다 이르거나 같은 날이에요`);
  if (p.start <= LUNCH && p.start + p.len - 1 >= LUNCH) w.push('점심시간(5교시)이 끼어 있어요');
  if (p.start + p.len - 1 > NP) w.push('10교시를 넘어가요');
  return w;
}
function describeConflict(x) {
  const it = x.it, o = it.c;
  const what = it.kind === 'exam' ? '시험' : `${it.week}주차 수업`;
  const room = x.kinds.includes('강의실') ? ` · ${roomLabel(it.room)}` : '';
  return `${x.kinds.join('·')} 겹침: ${o.course}(${o.prof}, ${groupOf(o)}) ${what} ${pRange(it.s, it.e - it.s + 1)}${room}`;
}
function statusOf(c) {
  const ex = S.exams[c.id];
  if (!hasSlot(ex)) return { bad: [], warn: [], moved: false, undecided: false, done: !!ex.done, noslot: true };
  const p = { date: ex.date, start: ex.start, len: ex.len, room: ex.room };
  return { bad: conflictsOf(c, p), warn: warningsOf(c, p), moved: isMoved(c), undecided: ex.method === '미정', done: !!ex.done, noslot: false };
}
function freeSlots(c, len, room) {
  const pv = prevDate(c);
  const dates = D.candDates.filter(d => (!pv || d > pv) && dowOf(d) !== 6);
  const out = [];
  for (const d of dates) {
    const starts = range(1, NP - len + 1).filter(s => !(s <= LUNCH && s + len - 1 >= LUNCH) && conflictsOf(c, { date: d, start: s, len, room }).length === 0);
    if (starts.length) out.push({ d, starts });
  }
  return out;
}
function dayInfoLabel(iso) {
  const info = D.dateMap[iso];
  if (!info) return { text: '수업일 현황에 없는 날', cls: 'alt' };
  const real = DOW[dowOf(iso)];
  const hasClasses = S.classes.some(c => c.day === info.col);
  let text = `${info.col}요일 시간표 · ${info.week}주차`;
  let cls = info.week === S.examWeek ? '' : 'alt';
  if (info.col !== real) text += ` (${real}요일에 ${info.col}요일 수업)`;
  if (!hasClasses) { text += ' · 우리 과 수업 없음'; cls = 'free'; }

/* ---------- persistence ---------- */
const cloud = { ref: null, writing: false, dirty: false, timer: null, loaded: false, retried: false, mode: 'local' };
function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; } catch { return false; } }
function loadLocal() { try { const t = localStorage.getItem(LS_KEY); if (!t) return null; const s = JSON.parse(t); return validState(s) ? s : null; } catch { return null; } }
function setSave(mode, detail) {
  if (mode) cloud.mode = mode;
  const el = $('#saveState');
  const map = { local: '이 브라우저에 저장돼요', loading: '저장된 내용 불러오는 중', saving: '저장 중', cloud: '저장됨', offline: '저장소 연결 대기 중 · 이 브라우저에 보관', error: '저장소에 저장하지 못했어요 · 이 브라우저에 보관' };
  el.textContent = map[cloud.mode] || '';
  el.className = 'savepill ' + cloud.mode;
  if (detail) el.title = String(detail);
}
function changed(opts = {}) {
  S.rev = (S.rev || 0) + 1; S.updatedAt = Date.now(); S.writer = TAB_ID;
  persistLocal();
  if (cloud.ref) { cloud.dirty = true; setSave('saving'); clearTimeout(cloud.timer); cloud.timer = setTimeout(flushCloud, 700); }
  if (!opts.noRender) render();
}
async function flushCloud() {
  if (!cloud.ref || cloud.writing || !cloud.dirty) return;
  cloud.writing = true; cloud.dirty = false;
  try {
    await cloud.ref.set({ payload: JSON.stringify(S), rev: S.rev, updatedAt: S.updatedAt, writer: TAB_ID });
    cloud.retried = false;
    setSave(cloud.dirty ? 'saving' : 'cloud');
  } catch (err) {
    if (err && err.code === 'unavailable' && !cloud.retried) { cloud.retried = true; cloud.dirty = true; setTimeout(flushCloud, 1200 + Math.random() * 1200); }
    else { setSave('error', err && (err.message || err.code)); }
  } finally {
    cloud.writing = false;
    if (cloud.dirty && cloud.mode !== 'error') { clearTimeout(cloud.timer); cloud.timer = setTimeout(flushCloud, 400); }
  }
}
async function initCloud() {
  if (!(window.claude && typeof window.claude.use === 'function')) { setSave('local'); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch { db = null; }
  if (!db) { setSave('local'); return; }
  let ref;
  try { ref = db.doc('planner/state'); } catch { setSave('local'); return; }
  cloud.ref = ref;
  setSave('loading');
  const timer = setTimeout(() => { if (!cloud.loaded) setSave('offline'); }, 10000);
  ref.onSnapshot(snap => {
    const definitive = !snap.metadata.fromCache;
    if (snap.exists) {
      const d = snap.data() || {};
      if (d.writer !== TAB_ID && (d.updatedAt || 0) > (S.updatedAt || 0)) {
        try { const s = JSON.parse(d.payload); if (validState(s)) { S = s; derive(); persistLocal(); render(); if (ui.drawerId) openDrawer(ui.drawerId); } } catch {}
      } else if (definitive && !cloud.loaded && (S.updatedAt || 0) > (d.updatedAt || 0)) { cloud.dirty = true; flushCloud(); }
    } else if (definitive && !cloud.loaded && (S.rev || 0) > 0) { cloud.dirty = true; flushCloud(); }
    if (definitive) { clearTimeout(timer); cloud.loaded = true; if (!cloud.writing && !cloud.dirty && cloud.mode !== 'error') setSave('cloud'); }
  }, err => { clearTimeout(timer); cloud.ref = null; setSave('error', err && (err.message || err.code)); });
}

/* ---------- rendering ---------- */
function render() {
  $('#deptLabel').textContent = S.dept;
  $('#titleLabel').textContent = `${S.title} 시간표`;
  renderSummary();
  if (ui.tab === 'board') renderBoard();
  if (ui.tab === 'courses') renderList();
  if (ui.tab === 'professors') renderProfs();
  if (ui.tab === 'setup') renderSetup();
  if (ui.drawerId) refreshDrawerChecks();
  if (ui.reg) refreshRegister();
}
function counts() {
  let total = 0, bad = 0, warn = 0, moved = 0, und = 0, done = 0, noslot = 0;
  for (const c of S.classes) {
    const st = statusOf(c);
    if (st.noslot) { noslot++; if (st.done) done++; continue; }
    total++;
    if (st.bad.length) bad++;
    if (st.warn.length) warn++;
    if (st.moved) moved++;
    if (st.undecided) und++;
    if (st.done) done++;
  }
  return { total, bad, warn, moved, und, done, noslot, all: S.classes.length };
}
function renderSummary() {
  const k = counts();
  $('#summary').innerHTML = `
    <span class="chip">시험 과목 <b>${k.total}</b>${k.noslot ? ` · 시험 없음 ${k.noslot}` : ''}</span>
    <button type="button" class="chip ${k.bad ? 'bad' : 'ok'}" data-jump="bad">겹침 <b>${k.bad}</b></button>
    <button type="button" class="chip ${k.warn ? 'warn' : ''}" data-jump="warn">확인 필요 <b>${k.warn}</b></button>
    <button type="button" class="chip" data-jump="moved">날짜·시간 변경 <b>${k.moved}</b></button>
    <button type="button" class="chip ${k.und ? 'warn' : ''}" data-jump="undecided">방식 미정 <b>${k.und}</b></button>
    <button type="button" class="chip ${k.done === k.all ? 'ok' : ''}" data-jump="done">확정 <b>${k.done}</b> / ${k.all}</button>`;
}
function boardDates() {
  const set = new Set();
  for (const col of S.calendar.cols) { const d = D.colDates[col]?.[S.examWeek - 1]; if (d) set.add(d); }
  for (const c of S.classes) { const ex = S.exams[c.id]; if (hasSlot(ex) && ex.date) set.add(ex.date); }
  for (const d of S.extraDates || []) set.add(d);
  return [...set].sort();
}
function lanesFor(items) {
  const sorted = items.slice().sort((a, b) => a.s - b.s || (a.kind === 'fixed' ? -1 : 1));
  const ends = [];
  for (const it of sorted) {
    let lane = ends.findIndex(e => e < it.s);
    if (lane < 0) { lane = ends.length; ends.push(it.e); } else ends[lane] = it.e;
    it.lane = lane;
  }
  return Math.max(1, ends.length);
}
function renderBoard() {
  const dates = boardDates();
  const html = [];
  const statusCache = {};
  for (const c of S.classes) statusCache[c.id] = statusOf(c);
  const head = `<div class="ghead"><div></div><div class="periods">${PERIODS.map((p, i) => `<div><b>${i + 1}</b>${i + 1 === LUNCH ? '점심' : p[0]}</div>`).join('')}</div></div>`;
  for (const d of dates) {
    const items = itemsOn(d, null);
    const nExam = items.filter(i => i.kind === 'exam').length;
    const lab = dayInfoLabel(d);
    const removable = (S.extraDates || []).includes(d) && !nExam;
    const [, m, dd] = d.split('-');
    let rows = '', prevYear = null;
    for (const g of D.groups) {
      const gi = items.filter(i => groupOf(i.c) === g);
      const lanes = lanesFor(gi);
      const year = g.slice(0, -1);
      const cells = range(1, NP).map(p => `<div class="cell${p === LUNCH ? ' lunch' : ''}" style="grid-column:${p}" data-date="${d}" data-group="${g}" data-p="${p}"></div>`).join('');
      const blocks = gi.map(it => {
        const pos = `grid-column:${it.s} / span ${Math.min(NP, it.e) - it.s + 1};grid-row:${it.lane + 1}`;
        if (it.kind === 'fixed') {
          return `<div class="blk fixed" style="${pos}" title="${esc(`${it.week}주차 정상 수업: ${it.c.course}(${it.c.prof}) ${roomLabel(it.c.room)}`)}"><span class="t">${esc(it.c.course)}</span><span class="s">${it.week}주차 수업 · ${esc(it.c.prof)}</span></div>`;
        }
        const ex = S.exams[it.c.id], st = statusCache[it.c.id];
        const badge = st.bad.length ? `<span class="badge b-bad">겹침</span>` : st.done ? `<span class="badge b-ok">확정</span>` : st.moved ? `<span class="badge b-mv">이동</span>` : '';
        const tip = [`${it.c.course} (${it.c.prof}) ${g}`, `${fmt(ex.date)} ${pRange(ex.start, ex.len)} ${tRange(ex.start, ex.len)} · ${roomLabel(ex.room)} · ${ex.method}`, ...st.bad.map(describeConflict), ...st.warn].join('\n');
        return `<button type="button" class="blk exam y${esc(year)}${st.bad.length ? ' bad' : ''}${badge ? ' has-badge' : ''}" style="${pos}" data-id="${esc(it.c.id)}" title="${esc(tip)}"><span class="t">${esc(it.c.course)}</span><span class="s">${esc(it.c.prof)} · ${esc(roomLabel(ex.room))} · ${esc(ex.method)}</span>${badge}</button>`;
      }).join('');
      rows += `<div class="grow${prevYear !== null && prevYear !== year ? ' yb' : ''}"><div class="glabel y${esc(year)}">${esc(g)}</div><div class="track" style="grid-template-rows:repeat(${lanes},minmax(42px,auto))">${cells}${blocks}</div></div>`;
      prevYear = year;
    }
    html.push(`<section class="day" data-day="${d}">
      <div class="dayhead"><h3>${+m}/${+dd}<span class="dow">(${DOW[dowOf(d)]})</span></h3><span class="tag ${lab.cls}">${esc(lab.text)}</span>
      <span class="cnt">시험 ${nExam}과목</span>${removable ? `<button type="button" class="btn small" data-rmdate="${d}">목록에서 빼기</button>` : ''}</div>
      <div class="scroller"><div class="grid">${head}${rows}</div></div></section>`);
  }
  $('#board').innerHTML = html.join('');
  const shown = new Set(dates);
  $('#addDate').innerHTML = `<option value="">날짜 선택</option>` + D.candDates.filter(d => !shown.has(d)).map(d => `<option value="${d}">${fmt(d)} · ${D.dateMap[d].col}${D.dateMap[d].week}주차</option>`).join('');
}
function dateOptions(cur) {
  const list = D.candDates.slice();
  if (cur && !list.includes(cur)) { list.push(cur); list.sort(); }
  return list.map(d => `<option value="${d}"${d === cur ? ' selected' : ''}>${fmt(d)} ${D.dateMap[d] ? `· ${D.dateMap[d].col}${D.dateMap[d].week}` : ''}</option>`).join('');
}
const opts = (arr, cur, lab = x => x) => arr.map(v => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(lab(v))}</option>`).join('');
function filteredClasses() {
  const f = ui.filter, q = f.q.trim().toLowerCase();
  const dayIdx = d => DAY_ORDER.indexOf(d);
  return S.classes.filter(c => {
    if (f.group && groupOf(c) !== f.group) return false;
    if (f.prof && c.prof !== f.prof) return false;
    if (q && !`${c.course} ${c.prof} ${c.room} ${S.exams[c.id].room} ${groupOf(c)}`.toLowerCase().includes(q)) return false;
    if (f.status) {
      const st = statusOf(c);
      if (f.status === 'bad' && !st.bad.length) return false;
      if (f.status === 'warn' && !st.warn.length) return false;
      if (f.status === 'moved' && !st.moved) return false;
      if (f.status === 'undecided' && !st.undecided) return false;
      if (f.status === 'open' && st.done) return false;
      if (f.status === 'done' && !st.done) return false;
    }
    return true;
  }).sort((a, b) => groupOf(a).localeCompare(groupOf(b)) || dayIdx(a.day) - dayIdx(b.day) || a.start - b.start);
}
function statusPills(st) {
  const out = [];
  if (st.noslot) out.push('<span class="pill na">시험 없음</span>');
  if (st.bad.length) out.push(`<span class="pill bad" title="${esc(st.bad.map(describeConflict).join('\n'))}">겹침 ${st.bad.length}</span>`);
  if (st.warn.length) out.push(`<span class="pill warn" title="${esc(st.warn.join('\n'))}">확인 ${st.warn.length}</span>`);
  if (st.moved) out.push('<span class="pill mv">변경</span>');
  if (st.done) out.push('<span class="pill ok">확정</span>');

function setExamField(id, f, raw) {
  const ex = S.exams[id]; if (!ex) return;
  if (f === 'start' || f === 'len') ex[f] = Math.max(1, Math.min(NP, parseInt(raw, 10) || 1));

  else ex[f] = String(raw);

let drag = null;
function clearHighlight() { $$('.cell.ok,.cell.bad').forEach(el => el.classList.remove('ok', 'bad')); }
function dragTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest ? el.closest('.cell') : null;
  if (!cell) return null;

}
function onDragMove(e) {
  if (!drag) return;
  if (!drag.started) {

function parseCalendarText(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let cols = DAY_ORDER.slice();
  const weeks = [];
  for (const l of lines) {
    if (!/\d{1,2}\s*\/\s*\d{1,2}/.test(l)) {
      const hdr = l.match(/[월화수목금토일]/g);
      if (hdr && hdr.length >= 5 && /주/.test(l)) cols = hdr.filter(h => DAY_ORDER.includes(h));
      continue;
    }
    const m = l.match(/^(\d{1,2})(?:\s*주(?:차)?)?[\s\t]+(.*)$/);
    if (!m) continue;
    const toks = m[2].match(/\d{1,2}\s*\/\s*\d{1,2}(?:\s*\([월화수목금토일]\))?/g);
    if (!toks || toks.length < Math.min(5, cols.length)) continue;
    weeks[+m[1] - 1] = toks.slice(0, cols.length).map(t => t.replace(/\s+/g, ''));
  }
  const n = weeks.filter(Boolean).length;
  if (!n) return { error: true, msg: '표에서 주차별 날짜를 찾지 못했어요. 각 줄이 "주차 번호 + 날짜들" 순서인지 확인해 주세요.' };
  for (let i = 0; i < weeks.length; i++) if (!weeks[i]) weeks[i] = null;
  return { data: { cols, weeks }, msg: `${n}주 × ${cols.length}요일(${cols.join('·')})을 읽었어요.` };
}

  return [head, ...rows].map(r => r.join('\t')).join('\n');
}
function setTab(tab, push = true) {
  ui.tab = tab;
  for (const b of $$('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  for (const p of $$('.tabpanel')) p.hidden = p.id !== 'tab-' + tab;
  if (push && location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch { location.hash = tab; } }
  render();
}

/* ---------- events ---------- */
function bind() {
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['board', 'courses', 'professors', 'setup'].includes(h) && h !== ui.tab) setTab(h, false); });
  $('#summary').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (!b) return; ui.filter = { group: '', prof: '', status: b.dataset.jump, q: '' }; setTab('courses'); });
  $('#btnExport').addEventListener('click', exportExcel);
  $('#btnRegister').addEventListener('click', () => openRegister());

  const board = $('#board');
  board.addEventListener('pointerdown', e => {
    const b = e.target.closest('.blk.exam'); if (!b || e.button !== 0) return;
    const id = b.dataset.id, ex = S.exams[id];
    const r = b.getBoundingClientRect();
    const grabP = Math.max(0, Math.min(ex.len - 1, Math.floor((e.clientX - r.left) / (r.width / ex.len))));
    drag = { id, el: b, x0: e.clientX, y0: e.clientY, started: false, grabP };
    e.preventDefault();
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  board.addEventListener('click', e => {
    const rm = e.target.closest('[data-rmdate]');
    if (rm) { S.extraDates = (S.extraDates || []).filter(d => d !== rm.dataset.rmdate); changed(); return; }
    const b = e.target.closest('.blk.exam');
    if (b && e.detail === 0) openDrawer(b.dataset.id);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (drag) endDrag(e, true); else if (ui.drawerId || ui.reg) closeDrawer(); } });
  $('#addDate').addEventListener('change', e => { const d = e.target.value; if (!d) return; S.extraDates = [...new Set([...(S.extraDates || []), d])]; changed(); toast(`${fmt(d)}을 추가했어요. 시험 블록을 이 날짜로 끌어 놓을 수 있어요.`); });

  const lt = $('#listTable');
  lt.addEventListener('change', e => {
    const el = e.target, f = el.dataset.f, tr = el.closest('tr[data-id]'); if (!f || !tr) return;
    setExamField(tr.dataset.id, f, el.type === 'checkbox' ? el.checked : el.value);
    changed();
  });
  lt.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openDrawer(b.dataset.open); });
  $('#fGroup').addEventListener('change', e => { ui.filter.group = e.target.value; renderList(); });
  $('#fProf').addEventListener('change', e => { ui.filter.prof = e.target.value; renderList(); });
  $('#fStatus').addEventListener('change', e => { ui.filter.status = e.target.value; renderList(); });
  $('#fQ').addEventListener('input', e => { ui.filter.q = e.target.value; renderList(); });
  $('#btnCopyTsv').addEventListener('click', () => copyText(listTsv()));

  $('#profGrid').addEventListener('click', e => {
    const cp = e.target.closest('[data-copy]');
    if (cp) { copyText(profMessage(cp.dataset.copy), document.getElementById('msg-' + cp.dataset.copy)); return; }
    const md = e.target.closest('[data-markdone]');
    if (md) { for (const c of S.classes) if (c.prof === md.dataset.markdone) S.exams[c.id].done = true; changed(); toast(`${md.dataset.markdone} 교수님 과목을 확정으로 표시했어요.`); }
  });

  const dr = $('#drawer');
  dr.addEventListener('change', e => {
    if (ui.reg && e.target.dataset.r) {
      const k = e.target.dataset.r, v = e.target.value;
      if (k === 'id') { openRegister(v); return; }
      ui.reg[k] = v;
      if (k === 'method') { const keep = { ...ui.reg }; openRegister(keep.id); Object.assign(ui.reg, keep); openRegisterValues(); return; }
      refreshRegister(); return;
    }
    const el = e.target, f = el.dataset.f; if (!f || !ui.drawerId) return;
    if (f === 'note') return;
    setExamField(ui.drawerId, f, el.type === 'checkbox' ? el.checked : el.value);
    changed();
    if (f === 'method') openDrawer(ui.drawerId);
  });
  let noteT = null;
  dr.addEventListener('input', e => {
    if (ui.reg && e.target.dataset.r === 'note') { ui.reg.note = e.target.value; return; }
    if (ui.reg && e.target.dataset.r === 'room') { ui.reg.room = e.target.value; refreshRegister(); return; }
    if (e.target.dataset.f !== 'note' || !ui.drawerId) return;
    S.exams[ui.drawerId].note = e.target.value;
    clearTimeout(noteT); noteT = setTimeout(() => changed({ noRender: true }), 500);
  });
  dr.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.f === 'note') { clearTimeout(noteT); changed(); } });
  dr.addEventListener('click', e => {
    if (e.target.closest('#dClose')) { closeDrawer(); return; }
    if (e.target.closest('#dToReg')) { openRegister(ui.drawerId); return; }
    if (e.target.closest('#rSave')) { saveRegister(); return; }
    if (e.target.closest('#rDefault')) { const c = D.byId[ui.reg.id]; Object.assign(ui.reg, { date: defaultDate(c), start: c.start, len: lenOf(c), room: c.room }); openRegisterValues(); return; }
    const rs = e.target.closest('[data-rslot]');
    if (rs) { const [d, st] = rs.dataset.rslot.split('|'); ui.reg.date = d; ui.reg.start = +st; openRegisterValues(); return; }
    if (e.target.closest('#dReset')) { const c = D.byId[ui.drawerId], ex = S.exams[ui.drawerId]; ex.date = defaultDate(c); ex.start = c.start; ex.len = lenOf(c); ex.room = c.room; changed(); openDrawer(ui.drawerId); return; }
    const sb = e.target.closest('[data-slot]');
    if (sb) { const [d, s] = sb.dataset.slot.split('|'); const ex = S.exams[ui.drawerId]; ex.date = d; ex.start = +s; changed(); openDrawer(ui.drawerId); }
  });

  const sg = $('#setupGrid');
  sg.addEventListener('change', async e => {
    const el = e.target;
    if (el.id === 'sTitle') { S.title = el.value.trim() || S.title; changed(); }
    else if (el.id === 'sDept') { S.dept = el.value.trim() || S.dept; changed(); }
    else if (el.id === 'sXlsx' && el.files[0]) {
      ui.pending.xlsx = { msg: '읽는 중…' }; renderSetup();
      try { const res = await parseTimetableXlsx(await el.files[0].arrayBuffer());
        const g = new Set(res.classes.map(groupOf)).size, pr = new Set(res.classes.map(c => c.prof)).size;
        ui.pending.xlsx = { data: res.classes, msg: `'${res.sheet}' 시트에서 수업 ${res.classes.length}개(${g}개 반, 교수님 ${pr}분)를 읽었어요. 바꾸면 지금 입력한 시험 정보는 지워져요.` };
      } catch (err) { ui.pending.xlsx = { error: true, msg: err.message || '파일을 읽지 못했어요.' }; }
      renderSetup();
    } else if (el.id === 'sRestore' && el.files[0]) {
      try { const s = JSON.parse(await el.files[0].text()); if (!validState(s)) throw new Error();
        ui.pending.restore = { data: s, msg: `백업(${s.title}, 수업 ${s.classes.length}개)을 읽었어요. 불러오면 지금 내용이 이 백업으로 바뀌어요.` };
      } catch { ui.pending.restore = { error: true, msg: '이 도구의 백업 파일이 아니에요.' }; }
      renderSetup();
    }
  });
  sg.addEventListener('click', async e => {
    const id = e.target.id;
    const cancel = e.target.dataset && e.target.dataset.cancel;
    if (cancel) { delete ui.pending[cancel]; renderSetup(); return; }
    if (id === 'btnWeek') { const w = +$('#sWeek').value; if (w !== S.examWeek) { ui.pending.week = w; renderSetup(); } return; }
    if (id === 'btnWeekYes') { S.examWeek = ui.pending.week; S.exams = {}; S.extraDates = []; delete ui.pending.week; derive(); changed(); toast(`${S.examWeek}주차 기준으로 다시 배치했어요.`); return; }
    if (id === 'btnCal') { ui.pending.cal = parseCalendarText($('#sCal').value); ui.pending.calYear = +$('#sYear').value || S.year; renderSetup(); return; }
    if (id === 'btnCalYes') {
      S.calendar = ui.pending.cal.data; S.year = ui.pending.calYear; delete ui.pending.cal;
      D.colDates = {}; derive();
      for (const c of S.classes) { const ex = S.exams[c.id]; if (!D.dateMap[ex.date]) ex.date = defaultDate(c); }
      changed(); toast('수업일 현황을 바꿨어요.'); return;
    }
    if (id === 'btnXlsxYes') { S.classes = ui.pending.xlsx.data; S.exams = {}; S.extraDates = []; delete ui.pending.xlsx; derive(); changed(); toast('새 강의시간표로 바꿨어요.'); return; }
    if (id === 'btnBackup') { await saveFile(`${safeName(S.title)}_백업.json`, JSON.stringify(S, null, 1)); return; }
    if (id === 'btnRestoreYes') { S = ui.pending.restore.data; delete ui.pending.restore; derive(); changed(); toast('백업을 불러왔어요.'); return; }
    if (id === 'btnReset') { ui.pending.reset = true; renderSetup(); return; }
    if (id === 'btnResetYes') { delete ui.pending.reset; const rev = S.rev; S = freshState(); S.rev = rev; derive(); changed(); toast('처음 상태로 되돌렸어요.'); return; }
  });
}

/* ---------- boot ---------- */
(function boot() {
  S = loadLocal() || freshState();
  derive();
  const dl = document.createElement('datalist'); dl.id = 'roomList';
  dl.innerHTML = D.rooms.map(r => `<option value="${esc(r)}"></option>`).join('');
  document.body.appendChild(dl);
  bind();
  const h = location.hash.slice(1);
  setTab(['board', 'courses', 'professors', 'setup'].includes(h) ? h : 'board', false);
  setSave('local');
  initCloud();
  getDownloads();
})();
window.__planner = { openRegister, saveRegister, get reg() { return ui.reg; }, get state() { return S; }, derive, render, conflictsOf, warningsOf, statusOf, counts, freeSlots, itemsOn, buildWorkbook, parseCalendarText, parseTimetableXlsx, profMessage, openDrawer, changed };
</script>
</body>
